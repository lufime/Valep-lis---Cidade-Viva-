name: Valepólis V0.3.0 — Kotlin Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: valepolis-kotlin-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Selecionar Fase 5.1, validar e compilar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Obter código
        uses: actions/checkout@v5

      - name: Selecionar e extrair explicitamente a Fase 5.1
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="Valepolis-V0.3.0-KOTLIN-FASE5.1-LIMITES-BAIRROS-3D.zip"

          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::Falta o ZIP obrigatório: $ZIP_NAME"
            echo "ZIPs encontrados na raiz:"
            find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | sort
            exit 1
          fi

          rm -rf _fase51_extract
          mkdir -p _fase51_extract
          unzip -q "$ZIP_NAME" -d _fase51_extract

          APP_GRADLE="$(find _fase51_extract -type f \( -path '*/app/build.gradle.kts' -o -path '*/app/build.gradle' \) -print -quit)"
          if [ -z "$APP_GRADLE" ]; then
            echo "::error::O ZIP da Fase 5.1 não contém app/build.gradle(.kts)."
            exit 1
          fi

          if [[ "$APP_GRADLE" == */app/build.gradle.kts ]]; then
            PROJECT_ROOT="${APP_GRADLE%/app/build.gradle.kts}"
          else
            PROJECT_ROOT="${APP_GRADLE%/app/build.gradle}"
          fi

          if [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ] && [ ! -f "$PROJECT_ROOT/settings.gradle" ]; then
            echo "::error::Falta settings.gradle(.kts) no projeto extraído."
            exit 1
          fi

          # Limpa ficheiros de projeto previamente extraídos e copia apenas a Fase 5.1.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name '_fase51_extract' -exec rm -rf {} +
          cp -a "$PROJECT_ROOT/." .
          echo "ZIP_SELECIONADO=$ZIP_NAME" | tee fase-selecionada.txt
          echo "PROJECT_ROOT=$PROJECT_ROOT"
          echo "Fase 5.1 extraída e preparada."

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Não foi encontrado sdkmanager em $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          test -d "$SDK_ROOT/platforms/android-35"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"

      - name: Validar que o código é realmente Fase 5.1
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/AndroidManifest.xml
          MAIN="$(find app/src/main -type f -name 'MainActivity.kt' -print -quit)"
          if [ -z "$MAIN" ]; then
            echo "::error::MainActivity.kt não encontrado."
            exit 1
          fi
          if ! grep -q 'Fase 5.1' "$MAIN"; then
            echo "::error::O código extraído não identifica Fase 5.1 em $MAIN"
            grep -n 'Migração Kotlin nativo' "$MAIN" || true
            exit 1
          fi
          if [ ! -f app/src/main/assets/data/limites_bairros_v030.json ]; then
            echo "::error::Falta limites_bairros_v030.json nos assets da aplicação."
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("app/src/main/assets/data/limites_bairros_v030.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          districts = data.get("neighborhoods", [])
          if len(districts) != 25:
              raise SystemExit(f"FALHA | Esperados 25 bairros, encontrados {len(districts)}")
          print("PASS | Fase 5.1 identificada; 25 registos territoriais encontrados")
          PY

      - name: Compilar APK Android
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon --stacktrace clean :app:assembleDebug 2>&1 | tee build-kotlin.log
          else
            gradle --no-daemon --stacktrace clean :app:assembleDebug 2>&1 | tee build-kotlin.log
          fi

      - name: Validar APK e calcular SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          echo "PASS | APK gerada"

      - name: Publicar APK, logs e fase selecionada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-Fase5.1-Android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            build-kotlin.log
            fase-selecionada.txt
          if-no-files-found: warn
          retention-days: 14
