name: Valepólis V0.3.0 — Kotlin Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: valepolis-kotlin-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validar e compilar APK Kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Obter código
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar projeto Kotlin
        shell: bash
        run: |
          set -euo pipefail

          # Preferir o ZIP da Fase 2, depois a Fase 1 e, por fim, o ZIP original.
          ARCHIVE=""
          for candidate in \
            "Valepolis-V0.3.0-KOTLIN-FASE2-MAPA-TERRITORIAL-2D.zip" \
            "Valepolis-V0.3.0-KOTLIN-FASE1-TERRITORIO-INTERFACE.zip" \
            "Valepolis-V0.3.0-KOTLIN-ANDROID-MIGRACAO.zip"; do
            if [ -s "$candidate" ]; then
              ARCHIVE="$candidate"
              break
            fi
          done

          # Também aceitar os ZIPs em subpastas.
          if [ -z "$ARCHIVE" ]; then
            ARCHIVE="$(find . -maxdepth 5 -type f \( \
              -name 'Valepolis-V0.3.0-KOTLIN-FASE2-MAPA-TERRITORIAL-2D.zip' -o \
              -name 'Valepolis-V0.3.0-KOTLIN-FASE1-TERRITORIO-INTERFACE.zip' -o \
              -name 'Valepolis-V0.3.0-KOTLIN-ANDROID-MIGRACAO.zip' \
              \) -print -quit)"
          fi

          if [ -n "$ARCHIVE" ]; then
            echo "A preparar projeto a partir de: $ARCHIVE"
            mkdir -p _kotlin_extract
            unzip -oq "$ARCHIVE" -d _kotlin_extract

            APP_GRADLE="$(find _kotlin_extract -type f -path '*/app/build.gradle.kts' -print -quit)"
            if [ -z "$APP_GRADLE" ]; then
              echo "::error::O ZIP não contém app/build.gradle.kts"
              find _kotlin_extract -maxdepth 5 -type f | sort | head -150
              exit 1
            fi

            PROJECT_ROOT="${APP_GRADLE%/app/build.gradle.kts}"
            for required in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml; do
              if [ ! -f "$PROJECT_ROOT/$required" ]; then
                echo "::error::Falta no ZIP: $required"
                exit 1
              fi
            done

            cp -a "$PROJECT_ROOT/." .
          elif [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            echo "PASS | Projeto Kotlin já está extraído na raiz"
          else
            echo "::error::Não foi encontrado ZIP Kotlin conhecido nem projeto Gradle na raiz."
            echo "Conteúdo da raiz:"
            ls -la
            find . -maxdepth 3 -type f | sort | head -150
            exit 1
          fi

          echo "PASS | Projeto Kotlin preparado"

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "::error::Android SDK não encontrado em $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(
            find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null |
            sort -V | tail -n 1
          )"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Não foi encontrado o sdkmanager"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

          test -d "$SDK_ROOT/platforms/android-35"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          echo "PASS | Android SDK configurado"

      - name: Validar estrutura Kotlin e dados
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/pt/valepolis/quandotocaasirene/MainActivity.kt"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Falta ficheiro obrigatório: $file"
              exit 1
            fi
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = Path("app/src/main/assets/data")
          required = [
              "bairros_valepolis.json",
              "populacao_valepolis.json",
              "episodes_200.json",
          ]

          for name in required:
              path = data / name
              if not path.is_file():
                  raise SystemExit(f"FALHA | Falta o recurso: {path}")
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"FALHA | JSON inválido em {path}: {exc}")

          print("PASS | Estrutura Kotlin e JSON válidos")
          PY

      - name: Compilar APK Android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            clean :app:assembleDebug 2>&1 | tee build-kotlin.log

      - name: Validar APK e calcular SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::A APK não foi gerada"
            exit 1
          fi

          sha256sum "$APK" | tee "$APK.sha256"
          echo "PASS | APK gerada e SHA-256 criado"

      - name: Publicar APK e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-Kotlin-Android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            build-kotlin.log
          if-no-files-found: warn
          retention-days: 14
