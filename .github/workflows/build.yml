name: Valepólis V0.3.0 — Build Android universal ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: valepolis-v030-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Descobrir ZIP, validar e compilar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Listar e selecionar ZIP do projeto
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          # Considerar todos os ZIPs na raiz, excluindo artefactos de logs/workflow
          # e arquivos de saída para não extrair acidentalmente o próprio workflow.
          mapfile -t ALL_ZIPS < <(
            find . -maxdepth 1 -type f -iname '*.zip' \
              ! -iname '*workflow*' \
              ! -iname '*logs*' \
              ! -iname '*diagnostico*' \
              ! -iname '*artifact*' \
              -printf '%f\n' | sort -V
          )

          if [ "${#ALL_ZIPS[@]}" -eq 0 ]; then
            echo "::error::Não foi encontrado nenhum ZIP de projeto na raiz."
            find . -maxdepth 1 -type f -printf '%f\n' | sort || true
            exit 1
          fi

          # Testar os ZIPs do mais recente pelo nome para trás e escolher o primeiro
          # que contenha estrutura Gradle Android reconhecível.
          SELECTED=""
          for ((i=${#ALL_ZIPS[@]}-1; i>=0; i--)); do
            candidate="${ALL_ZIPS[$i]}"
            if unzip -Z1 "$candidate" 2>/dev/null | grep -Eq '(^|/)app/build\.gradle(\.kts)?$'; then
              SELECTED="$candidate"
              break
            fi
          done

          if [ -z "$SELECTED" ]; then
            echo "::error::Nenhum ZIP contém app/build.gradle ou app/build.gradle.kts."
            echo "ZIPs verificados:"
            printf ' - %s\n' "${ALL_ZIPS[@]}"
            exit 1
          fi

          echo "zip_name=$SELECTED" >> "$GITHUB_OUTPUT"
          echo "ZIP selecionado: $SELECTED"
          echo "ZIP selecionado: \`$SELECTED\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Extrair e localizar raiz Android
        id: project
        shell: bash
        env:
          ZIP_NAME: ${{ steps.zip.outputs.zip_name }}
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/valepolis_android"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "$ZIP_NAME" -d "$DEST"

          mapfile -t APP_GRADLES < <(
            find "$DEST" -type f \
              \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) \
              -print | sort
          )
          if [ "${#APP_GRADLES[@]}" -eq 0 ]; then
            echo "::error::Não foi possível localizar o Gradle da app depois da extração."
            find "$DEST" -maxdepth 7 -type f | head -300 || true
            exit 1
          fi

          ROOT=""
          for app_gradle in "${APP_GRADLES[@]}"; do
            candidate_root="$(dirname "$(dirname "$app_gradle")")"
            if [ -f "$candidate_root/settings.gradle" ] || [ -f "$candidate_root/settings.gradle.kts" ]; then
              ROOT="$candidate_root"
              break
            fi
          done

          if [ -z "$ROOT" ]; then
            echo "::error::Não foi encontrada uma raiz com settings.gradle(.kts)."
            printf 'Gradle da app encontrado:\n'
            printf ' - %s\n' "${APP_GRADLES[@]}"
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Projeto selecionado: $ROOT"
          echo "Projeto selecionado: \`$ROOT\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Validar ficheiros territoriais se presentes
        shell: bash
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          BOUNDARIES="$ROOT/app/src/main/assets/data/limites_bairros_v030.json"

          if [ -f "$BOUNDARIES" ]; then
            python3 - "$BOUNDARIES" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          if isinstance(data, list):
              neighborhoods = data
          elif isinstance(data, dict):
              neighborhoods = next(
                  (data[k] for k in ("bairros", "neighborhoods", "features", "limites", "items")
                   if isinstance(data.get(k), list)), None
              )
          else:
              neighborhoods = None
          if neighborhoods is None:
              raise SystemExit("::error::Estrutura de dados dos bairros não reconhecida.")
          if len(neighborhoods) != 25:
              raise SystemExit(f"::error::Esperados 25 bairros; encontrados {len(neighborhoods)}.")
          print("PASS: foram encontrados 25 bairros.")
          PY
          else
            echo "::warning::O JSON limites_bairros_v030.json não existe nesta variante. A validação territorial foi ignorada."
          fi

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK debug
        id: build
        shell: bash
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          cd "$ROOT"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            echo "::notice::Sem gradlew; a compilação será tentada com Gradle 8.9 instalado pelo workflow."
            gradle --no-daemon --stacktrace assembleDebug
          fi

          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::A compilação não produziu nenhum APK."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/valepolis_apk"
          cp "$APK" "$RUNNER_TEMP/valepolis_apk/Valepolis-V0.3.0-Android.apk"
          echo "apk_path=$RUNNER_TEMP/valepolis_apk/Valepolis-V0.3.0-Android.apk" >> "$GITHUB_OUTPUT"
          echo "APK gerada: $APK"
          echo "APK gerada: \`$APK\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-Android
          if-no-files-found: error
          path: ${{ steps.build.outputs.apk_path }}

      - name: Publicar diagnóstico em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-Build-Diagnostico
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/valepolis_android/**
            ${{ steps.project.outputs.root }}/app/build/reports/**
            ${{ steps.project.outputs.root }}/app/build/outputs/logs/**
