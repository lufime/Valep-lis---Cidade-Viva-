name: Valepólis V0.3.0 — PRE-FLIGHT e APK Android (Terrain3D)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: valepolis-v030-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.5-stable'
  APK_NAME: 'Quando-Toca-a-Sirene-V0.3.0.apk'

jobs:
  build:
    name: Auditar, testar e exportar APK Android de validação
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Localizar projeto Godot ou ZIP do projeto
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/valepolis-project"
          PROJECT_FILE=""

          # Aceita projeto na raiz ou dentro de uma pasta extraída.
          if [ -f "project.godot" ]; then
            PROJECT_FILE="$PWD/project.godot"
          else
            PROJECT_FILE="$(find . -path './.git' -prune -o -path './build' -prune -o -type f -name project.godot -print -quit)"
          fi

          # Não escolher silenciosamente um ZIP arbitrário. Se houver ZIPs, exige
          # exatamente um ZIP que contenha project.godot; assim não testa versões antigas.
          if [ -z "$PROJECT_FILE" ]; then
            mapfile -t candidates < <(find . -path './.git' -prune -o -path './build' -prune -o -type f -iname '*.zip' -print | while IFS= read -r z; do
              if unzip -Z1 "$z" 2>/dev/null | grep -Eq '(^|/)project\.godot$'; then printf '%s\n' "$z"; fi
            done)
            if [ "${#candidates[@]}" -ne 1 ]; then
              echo "ERRO: esperava exatamente um ZIP completo com project.godot; encontrados ${#candidates[@]}."
              printf '%s\n' "${candidates[@]}"
              exit 1
            fi
            candidate="${candidates[0]}"
            echo "ZIP único do projeto encontrado: $candidate"
            unzip -q "$candidate" -d "$RUNNER_TEMP/valepolis-project"
            PROJECT_FILE="$(find "$RUNNER_TEMP/valepolis-project" -type f -name project.godot -print -quit)"
          fi

          if [ -z "$PROJECT_FILE" ] || [ ! -f "$PROJECT_FILE" ]; then
            echo 'ERRO: não foi encontrado project.godot nem ZIP contendo project.godot.'
            echo 'Coloca o projeto extraído no repositório ou inclui o ZIP completo do projeto.'
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto selecionado: $PROJECT_DIR"
          test -f "$PROJECT_DIR/Main.tscn"
          test -f "$PROJECT_DIR/main.gd"
          test -f "$PROJECT_DIR/export_presets.cfg"

      - name: Desativar plugin de editor Terrain3D apenas no runner CI
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPLUGIN'
          from pathlib import Path
          import re
          p = Path("project.godot")
          content = p.read_text(encoding="utf-8")
          pattern = re.compile(r"(?ms)^\[editor_plugins\][ \t]*\n(.*?)(?=^\[|\Z)")
          match = pattern.search(content)
          if not match:
              content = content.rstrip() + '\n\n[editor_plugins]\nenabled=PackedStringArray()\n'
          else:
              section = match.group(1)
              if not re.search(r"(?m)^enabled\s*=", section):
                  new_section = section.rstrip() + '\nenabled=PackedStringArray()\n'
              else:
                  new_section = re.sub(r"(?m)^enabled\s*=.*$", "enabled=PackedStringArray()", section)
              content = content[:match.start(1)] + new_section + content[match.end(1):]
          p.write_text(content, encoding="utf-8")
          check = p.read_text(encoding="utf-8")
          if not re.search(r"(?ms)^\[editor_plugins\]\s*\nenabled=PackedStringArray\(\)", check):
              raise SystemExit("Não foi possível desativar o plugin de editor no runner.")
          print("CI_EDITOR_PLUGIN_DISABLED=Terrain3D")
          print("INFO|A extensão nativa Terrain3D e os seus binários não foram removidos.")
          PYPLUGIN

      - name: Instalar Blender para gerar retrato da personagem-base
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libgles2
          # O Blender instalado pelo Ubuntu usa Python próprio; disponibilizar o NumPy
          # do Python de sistema (mesma versão Python no runner Ubuntu 24.04).
          echo "PYTHONPATH=/usr/lib/python3/dist-packages:${PYTHONPATH:-}" >> "$GITHUB_ENV"
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          blender --background --factory-startup --python-expr "import numpy; print('BLENDER_NUMPY_OK=' + numpy.__version__)" 2>&1 | tee blender-numpy-check.log
          grep -q '^BLENDER_NUMPY_OK=' blender-numpy-check.log
          blender --version | head -n 2

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Godot e templates de exportação
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.5.stable"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -oq "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot/bin" -maxdepth 2 -type f -name 'Godot_v*_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          sudo install "$GODOT_BIN" /usr/local/bin/godot

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o "$RUNNER_TEMP/godot/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot/templates-unpacked"
          unzip -oq "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates-unpacked"
          TEMPLATE_DIR="$(find "$RUNNER_TEMP/godot/templates-unpacked" -type d -name templates -print -quit)"
          test -n "$TEMPLATE_DIR"
          cp -a "$TEMPLATE_DIR/." "$HOME/.local/share/godot/export_templates/4.5.stable/"
          godot --version

      - name: Instalar Android SDK e ferramentas de assinatura
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo 'ERRO: sdkmanager não encontrado.' >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Inicializar ADB para verificações Android sem dispositivo físico
        shell: bash
        run: |
          set -euo pipefail
          # A exportação não requer um telefone ligado; iniciar o servidor evita
          # a falha de ligação a tcp:5037 quando as ferramentas Android o consultam.
          adb start-server
          adb devices -l

      - name: PRE-FLIGHT estático do projeto
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          if [ -x tools/preflight.sh ]; then
            bash tools/preflight.sh build/preflight-v0.3.0.txt
          elif [ -f tools/preflight.sh ]; then
            bash tools/preflight.sh build/preflight-v0.3.0.txt
          else
            echo 'FAIL|tools/preflight.sh não encontrado' | tee -a build/preflight-v0.3.0.txt
            exit 1
          fi

      - name: Importar recursos Godot (diagnóstico isolado sem .blend)
        id: godot_import
        working-directory: ${{ env.PROJECT_DIR }}
        timeout-minutes: 8
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build
          LOG="build-godot-import.log"
          BLEND_FILE="$(find blender . -maxdepth 4 -type f -name 'Valepolis_Character_Base_V030.blend' -print -quit)"
          RESTORE_FILE=""
          restore_blend() {
            if [ -n "$RESTORE_FILE" ] && [ -f "$RESTORE_FILE" ]; then
              mv "$RESTORE_FILE" "$BLEND_FILE"
              echo "INFO|Ficheiro .blend original restaurado: $BLEND_FILE" | tee -a "$LOG"
            fi
          }
          trap restore_blend EXIT
          if [ -n "$BLEND_FILE" ] && [ -f "$BLEND_FILE" ]; then
            RESTORE_FILE="${BLEND_FILE}.valepolis-diagnostic-disabled"
            if [ -e "$RESTORE_FILE" ]; then
              echo 'FAIL|Já existe um ficheiro temporário de diagnóstico; não será sobrescrito.' | tee -a build/preflight-v0.3.0.txt
              exit 1
            fi
            mv "$BLEND_FILE" "$RESTORE_FILE"
            echo "INFO|Teste isolado: .blend temporariamente fora da árvore de importação; original será restaurado." | tee "$LOG"
          else
            echo 'WARN|O .blend não foi encontrado nesta fase; importação será testada sem ele.' | tee "$LOG"
          fi
          echo "INFO|Início da importação Godot: $(date -Is)" | tee -a "$LOG"
          echo "INFO|Godot: $(godot --version 2>&1)" | tee -a "$LOG"
          set +e
          timeout --verbose --signal=TERM --kill-after=20s 7m \
            godot --headless --editor --path . --import --verbose 2>&1 | tee -a "$LOG"
          status=${PIPESTATUS[0]}
          set -e
          echo "INFO|Código de saída da importação: $status" | tee -a "$LOG"
          echo "INFO|Fim da importação: $(date -Is)" | tee -a "$LOG"
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo 'FAIL|Importação Godot excedeu 7 minutos mesmo com o .blend temporariamente fora da árvore de importação.' | tee -a build/preflight-v0.3.0.txt
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "FAIL|Importação Godot terminou com código $status." | tee -a build/preflight-v0.3.0.txt
            exit 1
          fi
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|(^|[[:space:]])ERROR:' "$LOG"; then
            echo 'FAIL|Importação Godot registou erros no log.' | tee -a build/preflight-v0.3.0.txt
            exit 1
          fi
          echo 'PASS|Importação Godot inicial concluída sem erros detetados, antes da geração dos recursos Blender.' | tee -a build/preflight-v0.3.0.txt

      - name: Gerar dados persistentes Terrain3D de Valepólis
        id: terrain3d_data
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f terrain/valepolis_heightmap.png
          godot --headless --path . --script tools/generate_terrain3d_data.gd 2>&1 | tee build-terrain3d-data-generation.log
          grep -q '^TERRAIN3D_DATA_GENERATED=' build-terrain3d-data-generation.log
          test -d terrain/ValepolisTerrainData
          test -n "$(find terrain/ValepolisTerrainData -type f -print -quit)"
          echo 'PASS|Dados persistentes Terrain3D gerados a partir do heightmap procedural de Valepólis.' | tee -a build/preflight-v0.3.0.txt

      - name: Verificar integração real do Terrain3D
        id: terrain3d_gate
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/preflight_terrain3d.gd ]; then
            echo 'FAIL|Teste runtime Terrain3D ausente' | tee -a build/preflight-v0.3.0.txt
            exit 1
          fi
          if ! godot --headless --path . --script tools/preflight_terrain3d.gd 2>&1 | tee build-terrain3d-runtime.log; then
            echo 'FAIL|Teste runtime Terrain3D' | tee -a build/preflight-v0.3.0.txt
            exit 1
          fi
          if grep -Eiq '(^|[[:space:]])ERROR:|SCRIPT ERROR:|Parse Error:' build-terrain3d-runtime.log; then
            echo 'FAIL|Terrain3D runtime registou erros, mesmo que o processo tenha terminado com código 0.' | tee -a build/preflight-v0.3.0.txt
            exit 1
          fi
          grep -q '^TERRAIN3D_RUNTIME_PASS=regions:[0-9][0-9]*,camera=assigned$' build-terrain3d-runtime.log || { echo 'FAIL|Terrain3D runtime não confirmou regiões e câmara atribuída' | tee -a build/preflight-v0.3.0.txt; exit 1; }
          echo 'PASS|Teste runtime Terrain3D: regiões e câmara atribuída, sem erros no log' | tee -a build/preflight-v0.3.0.txt
          python3 - <<'PYCODE'
          from pathlib import Path
          import re, sys
          root = Path('.')
          scene = (root / 'City3D.tscn').read_text(encoding='utf-8', errors='replace') if (root / 'City3D.tscn').is_file() else ''
          gd = '\n'.join(p.read_text(encoding='utf-8', errors='replace') for p in root.rglob('*.gd') if 'addons/terrain_3d/' not in p.as_posix())
          has_node = bool(re.search(r'\[node[^\]]+type="Terrain3D"', scene)) or bool(re.search(r'ClassDB\.class_exists\("Terrain3D"\)', gd) and re.search(r'ClassDB\.instantiate\("Terrain3D"\)', gd))
          data_files = [p for p in root.rglob('*') if p.is_file() and ('terrain' in p.as_posix().lower() or 'heightmap' in p.as_posix().lower()) and p.suffix.lower() in {'.res','.tres','.exr','.png','.raw','.r16','.tif','.tiff'} and 'addons/terrain_3d/' not in p.as_posix()]
          if not has_node:
              print('FAIL|Terrain3D: não existe nó Terrain3D na cena nem criação runtime detetável')
              sys.exit(1)
          if not data_files:
              print('FAIL|Terrain3D: não foram encontrados dados persistentes de terreno fora do addon')
              sys.exit(1)
          print(f'PASS|Terrain3D: nó/configuração detetável e {len(data_files)} ficheiros candidatos a dados')
          PYCODE
          echo 'PASS|Verificação estrutural Terrain3D' | tee -a build/preflight-v0.3.0.txt

      - name: Gerar modelo Blender e retrato PNG
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p blender/generated build
          blender --background --python blender/scripts/create_valepolis_base.py 2>&1 | tee blender-generation.log
          test -s blender/Valepolis_Character_Base_V030.blend || test -s Valepolis_Character_Base_V030.blend || test -s blender/scripts/Valepolis_Character_Base_V030.blend
          PORTRAIT="$(find . -type f -name 'portrait_valepolis_base.png' -size +1k -print -quit)"
          if [ -z "$PORTRAIT" ]; then
            echo 'FAIL|Blender não produziu portrait_valepolis_base.png' | tee -a build/preflight-v0.3.0.txt
            exit 1
          fi
          DEST="blender/generated/portrait_valepolis_base.png"
          # O Blender normalmente já grava diretamente no destino. Não copiar o ficheiro para si próprio.
          if [ "$(realpath "$PORTRAIT")" != "$(realpath -m "$DEST")" ]; then
            cp "$PORTRAIT" "$DEST"
          fi
          test -s "$DEST"
          echo 'PASS|Blender gerou retrato PNG da personagem-base' | tee -a build/preflight-v0.3.0.txt

      - name: Diagnóstico Blender — exportar personagem-base para GLB
        id: blender_glb_diagnostic
        working-directory: ${{ env.PROJECT_DIR }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          BLEND_FILE="$(find blender . -maxdepth 4 -type f -name 'Valepolis_Character_Base_V030.blend' -print -quit)"
          if [ -z "$BLEND_FILE" ] || [ ! -s "$BLEND_FILE" ]; then
            echo 'FAIL|Não foi encontrado o .blend da personagem-base para o teste GLB.' | tee -a build/preflight-v0.3.0.txt
            exit 1
          fi
          export VALPOLIS_BLEND_FILE="$(realpath "$BLEND_FILE")"
          export VALPOLIS_DIAG_GLB="$RUNNER_TEMP/Valepolis_Character_Base_V030-diagnostic.glb"
          cat > "$RUNNER_TEMP/export_valepolis_diag_glb.py" <<'PYBLENDER'
          import bpy, os
          src = os.environ['VALPOLIS_BLEND_FILE']
          dst = os.environ['VALPOLIS_DIAG_GLB']
          if bpy.data.filepath and os.path.realpath(bpy.data.filepath) != os.path.realpath(src):
              raise RuntimeError('Blender abriu um ficheiro diferente do esperado')
          result = bpy.ops.export_scene.gltf(filepath=dst, export_format='GLB', export_apply=True)
          if 'FINISHED' not in result or not os.path.isfile(dst) or os.path.getsize(dst) < 20:
              raise RuntimeError('Exportação GLB não produziu um ficheiro válido')
          with open(dst, 'rb') as f:
              if f.read(4) != b'glTF':
                  raise RuntimeError('Cabeçalho GLB inválido')
          print('BLENDER_DIAGNOSTIC_GLB=PASS')
          print('BLENDER_DIAGNOSTIC_GLB_BYTES=' + str(os.path.getsize(dst)))
          PYBLENDER
          blender --background "$VALPOLIS_BLEND_FILE" --python "$RUNNER_TEMP/export_valepolis_diag_glb.py" 2>&1 | tee build-blender-glb-diagnostic.log
          grep -q '^BLENDER_DIAGNOSTIC_GLB=PASS$' build-blender-glb-diagnostic.log
          echo 'PASS|Modelo Blender original preservado; exportação GLB de diagnóstico validada fora do projeto.' | tee -a build/preflight-v0.3.0.txt

      - name: Instalar Blender e gerar recursos 3D automaticamente
        id: blender_assets
        working-directory: ${{ env.PROJECT_DIR }}
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          blender --background --factory-startup --python blender/scripts/generate_valepolis_asset_library.py 2>&1 | tee build-blender-assets.log
          grep -q '^ASSET_LIBRARY_RESULT=PASS$' build-blender-assets.log
          # Validar o cabeçalho GLB (magic glTF) e o tamanho, não apenas a existência.
          glb_count=$(python3 - <<'PYGLB'
          from pathlib import Path
          valid = []
          for p in Path('assets').rglob('*.glb'):
              try:
                  with p.open('rb') as f:
                      header = f.read(12)
                  if len(header) == 12 and header[:4] == b'glTF' and int.from_bytes(header[4:8], 'little') == 2 and int.from_bytes(header[8:12], 'little') <= p.stat().st_size:
                      valid.append(p)
              except OSError:
                  pass
          print(len(valid))
          PYGLB
          )
          if [ "$glb_count" -lt 10 ]; then
            echo "FAIL|Geração Blender: esperados pelo menos 10 GLB válidos; encontrados $glb_count" | tee -a build/preflight-v0.3.0.txt
            exit 1
          fi
          echo "PASS|Geração Blender: $glb_count ficheiros GLB com cabeçalho válido" | tee -a build/preflight-v0.3.0.txt
          find assets -type f -name '*.glb' -size +0c -print | sort > build/blender-assets-manifest.txt

      - name: Importar recursos gerados pelo Blender no Godot
        id: godot_import_after_blender
        working-directory: ${{ env.PROJECT_DIR }}
        timeout-minutes: 8
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build
          LOG="build-godot-import-after-blender.log"
          BLEND_FILE="$(find blender . -maxdepth 4 -type f -name 'Valepolis_Character_Base_V030.blend' -print -quit)"
          RESTORE_FILE=""
          restore_blend() {
            if [ -n "$RESTORE_FILE" ] && [ -f "$RESTORE_FILE" ]; then
              mv "$RESTORE_FILE" "$BLEND_FILE"
              echo "INFO|Ficheiro .blend original restaurado: $BLEND_FILE" | tee -a "$LOG"
            fi
          }
          trap restore_blend EXIT
          if [ -n "$BLEND_FILE" ] && [ -f "$BLEND_FILE" ]; then
            RESTORE_FILE="${BLEND_FILE}.valepolis-diagnostic-disabled"
            if [ -e "$RESTORE_FILE" ]; then
              echo 'FAIL|Já existe um ficheiro temporário de diagnóstico; não será sobrescrito.' | tee -a build/preflight-v0.3.0.txt
              exit 1
            fi
            mv "$BLEND_FILE" "$RESTORE_FILE"
            echo 'INFO|Modelo Blender temporariamente fora da árvore de importação; original será restaurado.' | tee "$LOG"
          fi
          set +e
          timeout --verbose --signal=TERM --kill-after=20s 7m \
            godot --headless --editor --path . --import --verbose 2>&1 | tee -a "$LOG"
          status=${PIPESTATUS[0]}
          set -e
          echo "INFO|Código de saída da importação após Blender: $status" | tee -a "$LOG"
          if [ "$status" -ne 0 ] || grep -Eiq 'SCRIPT ERROR:|Parse Error:|(^|[[:space:]])ERROR:' "$LOG"; then
            echo 'FAIL|Importação Godot após geração Blender falhou ou registou erros.' | tee -a build/preflight-v0.3.0.txt
            exit 1
          fi
          echo 'PASS|Recursos Blender gerados importados pelo Godot sem erros; .blend original preservado.' | tee -a build/preflight-v0.3.0.txt

      - name: Executar testes funcionais V0.3.0
        id: functional
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f tools/preflight_functional.gd ]; then
            echo 'FAIL|tools/preflight_functional.gd não encontrado' | tee -a build/preflight-v0.3.0.txt
            exit 1
          fi
          if godot --headless --path . --script tools/preflight_functional.gd 2>&1 | tee build-functional.log; then status=0; else status=$?; fi
          if [ "$status" -ne 0 ] || grep -Eiq 'SCRIPT ERROR:|Parse Error:|(^|[[:space:]])ERROR:' build-functional.log || ! grep -q '^RESULTADO=FUNCTIONAL_UI_PASS$' build-functional.log; then
            echo 'FAIL|Testes funcionais V0.3.0' | tee -a build/preflight-v0.3.0.txt
            exit 1
          fi
          echo 'PASS|Testes funcionais V0.3.0' | tee -a build/preflight-v0.3.0.txt

      - name: Exportar APK Android de validação (sem secrets)
        id: export_apk
        working-directory: ${{ env.PROJECT_DIR }}
        timeout-minutes: 17
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          LOG="godot-export.log"
          echo "INFO|Início da exportação Android: $(date -Is)" | tee "$LOG"
          echo "INFO|Godot: $(godot --version 2>&1)" | tee -a "$LOG"
          echo "INFO|Preset: Android; modo: debug; destino: build/${APK_NAME}" | tee -a "$LOG"
          set +e
          timeout --verbose --signal=TERM --kill-after=30s 15m \
            godot --headless --path . --export-debug 'Android' "build/${APK_NAME}" --verbose 2>&1 | tee -a "$LOG"
          export_status=${PIPESTATUS[0]}
          set -e
          echo "INFO|Código de saída da exportação: $export_status" | tee -a "$LOG"
          echo "INFO|Fim da exportação: $(date -Is)" | tee -a "$LOG"
          if [ "$export_status" -eq 124 ] || [ "$export_status" -eq 137 ]; then
            echo 'FAIL|Exportação Android excedeu 15 minutos; consultar godot-export.log.' | tee -a build/preflight-v0.3.0.txt
            exit 1
          fi
          if [ "$export_status" -ne 0 ]; then
            echo "FAIL|Exportação Android terminou com código $export_status; consultar godot-export.log." | tee -a build/preflight-v0.3.0.txt
            exit "$export_status"
          fi
          if [ ! -s "build/${APK_NAME}" ]; then
            echo 'FAIL|Godot terminou sem erro, mas a APK não existe ou está vazia.' | tee -a build/preflight-v0.3.0.txt
            exit 1
          fi
          echo 'PASS|Exportação da APK Android de validação (debug)' | tee -a build/preflight-v0.3.0.txt

      - name: Verificar alinhamento, assinatura debug e hash da APK
        id: verify_apk
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          zipalign -c -v 4 "build/${APK_NAME}"
          apksigner verify --verbose "build/${APK_NAME}"
          sha256sum "build/${APK_NAME}" > "build/${APK_NAME}.sha256"
          echo 'PASS|Verificação de alinhamento e assinatura debug da APK' | tee -a build/preflight-v0.3.0.txt

      - name: Finalizar relatório PRE-FLIGHT
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build
          REPORT=build/preflight-v0.3.0.txt
          touch "$REPORT"
          # Evita relatórios que declarem PASS se algum gate ou a exportação falhou.
          if [ "$JOB_STATUS" != 'success' ]; then
            if ! grep -q '^FAIL|' "$REPORT"; then echo 'FAIL|Workflow terminou com falha antes da conclusão de todos os gates.' >> "$REPORT"; fi
            result=FAIL
          elif ! grep -q '^PASS|Importação e análise dos scripts Godot$' "$REPORT" || \
               ! grep -q '^PASS|Verificação estrutural Terrain3D$' "$REPORT" || \
               ! grep -q '^PASS|Testes funcionais V0.3.0$' "$REPORT" || \
               ! grep -q '^PASS|Exportação da APK Android de validação (debug)$' "$REPORT" || \
               ! grep -q '^PASS|Verificação de alinhamento e assinatura debug da APK$' "$REPORT"; then
            echo 'INCOMPLETE|Falta confirmação de um ou mais gates obrigatórios.' >> "$REPORT"
            result=INCOMPLETE
          else
            result=PASS
          fi
          # Reescreve apenas o resumo final para não acumular contagens antigas.
          sed -i '/^TOTAL_PASS=/d; /^TOTAL_FAIL=/d; /^TOTAL_SKIP=/d; /^RESULTADO=/d' "$REPORT"
          passes=$(grep -c '^PASS|' "$REPORT" || true)
          fails=$(grep -c '^FAIL|' "$REPORT" || true)
          skips=$(grep -c '^SKIP|' "$REPORT" || true)
          printf 'TOTAL_PASS=%s\nTOTAL_FAIL=%s\nTOTAL_SKIP=%s\nRESULTADO=%s\n' "$passes" "$fails" "$skips" "$result" >> "$REPORT"
          cat "$REPORT"
          if [ "$result" != 'PASS' ]; then exit 1; fi

      - name: Publicar relatório e logs (mesmo em falha)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-PRE-FLIGHT-Report
          path: |
            ${{ env.PROJECT_DIR }}/build/preflight-v0.3.0.txt
            ${{ env.PROJECT_DIR }}/build-godot-import.log
            ${{ env.PROJECT_DIR }}/build-functional.log
            ${{ env.PROJECT_DIR }}/build-blender-assets.log
            ${{ env.PROJECT_DIR }}/build-terrain3d-runtime.log
            ${{ env.PROJECT_DIR }}/build-terrain3d-data-generation.log
            ${{ env.PROJECT_DIR }}/build/blender-assets-manifest.txt
            ${{ env.PROJECT_DIR }}/godot-export.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar APK assinada com chave GitHub
        if: success() && steps.verify_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-Android-Preview
          path: |
            ${{ env.PROJECT_DIR }}/build/${{ env.APK_NAME }}
            ${{ env.PROJECT_DIR }}/build/${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Empacotar projeto completo validado
        if: success() && steps.verify_apk.outcome == 'success'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          zip -qr "$RUNNER_TEMP/Valepolis-V0.3.0-Projeto-Completo-Validado.zip" . \
            -x './.git/*' './.godot/*' './build/*' './*.log' './blender/scripts/__pycache__/*'

      - name: Publicar ZIP completo do projeto
        if: success() && steps.verify_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-Projeto-Completo
          path: ${{ runner.temp }}/Valepolis-V0.3.0-Projeto-Completo-Validado.zip
          if-no-files-found: error
          retention-days: 14
