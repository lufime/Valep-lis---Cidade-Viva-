name: Valepólis V0.3.0 — Android Build (Fase 5.2)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: valepolis-v030-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight-android:
    name: Localizar projeto, validar e compilar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Encontrar ZIP do projeto Kotlin
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CANDIDATES < <(
            find . -maxdepth 1 -type f \
              \( -iname 'Valepolis-V0.3.0-KOTLIN-FASE5.2*.zip' \
              -o -iname 'Valepolis-V0.3.0-KOTLIN-FASE5.1*.zip' \
              -o -iname 'Valepolis-V0.3.0-KOTLIN-ANDROID-MIGRACAO*.zip' \) \
              -printf '%f\n' | sort -V
          )
          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "::error::Não encontrei ZIP de projeto Kotlin na raiz do repositório."
            find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | sort || true
            exit 1
          fi
          SELECTED=""
          for candidate in "${CANDIDATES[@]}"; do
            if [[ "$candidate" == *"FASE5.2"* ]]; then SELECTED="$candidate"; fi
          done
          if [ -z "$SELECTED" ]; then
            for candidate in "${CANDIDATES[@]}"; do
              if [[ "$candidate" == *"FASE5.1"* ]]; then SELECTED="$candidate"; fi
            done
          fi
          if [ -z "$SELECTED" ]; then SELECTED="${CANDIDATES[-1]}"; fi
          echo "zip_name=$SELECTED" >> "$GITHUB_OUTPUT"
          echo "ZIP selecionado: $SELECTED"
          echo "ZIP selecionado: $SELECTED" >> "$GITHUB_STEP_SUMMARY"

      - name: Extrair e localizar projeto Android
        id: project
        shell: bash
        env:
          ZIP_NAME: ${{ steps.zip.outputs.zip_name }}
        run: |
          set -euo pipefail
          EXTRACT_DIR="$RUNNER_TEMP/valepolis_project"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_NAME" -d "$EXTRACT_DIR"
          mapfile -t GRADLE_FILES < <(
            find "$EXTRACT_DIR" -type f \
              \( -path '*/app/build.gradle.kts' -o -path '*/app/build.gradle' \) \
              -print | sort
          )
          if [ "${#GRADLE_FILES[@]}" -eq 0 ]; then
            echo "::error::O ZIP selecionado não contém app/build.gradle.kts nem app/build.gradle."
            find "$EXTRACT_DIR" -maxdepth 7 -type f | head -250 || true
            exit 1
          fi
          APP_GRADLE="${GRADLE_FILES[0]}"
          ROOT="$(dirname "$(dirname "$APP_GRADLE")")"
          if [ ! -f "$ROOT/settings.gradle.kts" ] && [ ! -f "$ROOT/settings.gradle" ]; then
            echo "::error::Não encontrei settings.gradle(.kts) em $ROOT"
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Projeto Android: $ROOT"
          echo "Projeto Android: $ROOT" >> "$GITHUB_STEP_SUMMARY"

      - name: Validar dados dos 25 bairros
        shell: bash
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          BOUNDARIES="$ROOT/app/src/main/assets/data/limites_bairros_v030.json"
          if [ ! -f "$BOUNDARIES" ]; then
            echo "::error::Falta o ficheiro territorial: $BOUNDARIES"
            exit 1
          fi
          python3 - "$BOUNDARIES" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          data = json.loads(p.read_text(encoding="utf-8"))
          if isinstance(data, list):
              items = data
          elif isinstance(data, dict):
              items = next((data[k] for k in ("bairros", "neighborhoods", "features", "limites", "items")
                            if isinstance(data.get(k), list)), None)
          else:
              items = None
          if items is None:
              raise SystemExit("Formato territorial não reconhecido.")
          if len(items) != 25:
              raise SystemExit(f"Esperados 25 bairros; encontrados {len(items)}.")
          print("PASS: 25 bairros encontrados.")
          PY

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK debug
        id: build
        shell: bash
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          cd "$ROOT"
          gradle --no-daemon --stacktrace assembleDebug
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::A compilação terminou sem produzir APK."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/valepolis_apk"
          cp "$APK" "$RUNNER_TEMP/valepolis_apk/Valepolis-V0.3.0-Android.apk"
          echo "apk=$RUNNER_TEMP/valepolis_apk/Valepolis-V0.3.0-Android.apk" >> "$GITHUB_OUTPUT"

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-Android
          if-no-files-found: error
          path: ${{ steps.build.outputs.apk }}

      - name: Guardar diagnóstico em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-Build-Diagnostico
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/valepolis_project/**
            ${{ steps.project.outputs.root }}/app/build/reports/**
            ${{ steps.project.outputs.root }}/app/build/outputs/logs/**
