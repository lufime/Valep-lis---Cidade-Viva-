name: Valepólis V0.3.0 — Build Android universal ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: valepolis-v030-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Descobrir ZIP, validar e compilar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Encontrar ZIP completo do projeto
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_DIR="$RUNNER_TEMP/zip_candidates"
          rm -rf "$CANDIDATE_DIR"
          mkdir -p "$CANDIDATE_DIR"

          mapfile -t ALL_ZIPS < <(
            find . -maxdepth 1 -type f -iname '*.zip' \
              ! -iname '*workflow*' \
              ! -iname '*logs*' \
              ! -iname '*diagnostico*' \
              ! -iname '*artifact*' \
              -printf '%f\n' | sort -V
          )

          if [ "${#ALL_ZIPS[@]}" -eq 0 ]; then
            echo "::error::Não foi encontrado nenhum ZIP na raiz do repositório."
            exit 1
          fi

          SELECTED=""
          SELECTED_DIR=""
          # Extrair e verificar cada ZIP do mais recente para o mais antigo.
          # Evita depender do comportamento de listagem de ZIP e não confunde
          # pacotes de workflow/logs com projetos Android.
          for ((i=${#ALL_ZIPS[@]}-1; i>=0; i--)); do
            candidate="${ALL_ZIPS[$i]}"
            test_dir="$CANDIDATE_DIR/candidate_$i"
            mkdir -p "$test_dir"

            if ! unzip -tq "$candidate" >/dev/null 2>&1; then
              echo "Ignorado: ZIP inválido: $candidate"
              rm -rf "$test_dir"
              continue
            fi

            if ! unzip -q "$candidate" -d "$test_dir"; then
              echo "Ignorado: não foi possível extrair $candidate"
              rm -rf "$test_dir"
              continue
            fi

            if find "$test_dir" -type f \
                \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) \
                -print -quit | grep -q .; then
              if find "$test_dir" -type f \
                  \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
                  -print -quit | grep -q .; then
                SELECTED="$candidate"
                SELECTED_DIR="$test_dir"
                break
              fi
            fi

            rm -rf "$test_dir"
          done

          if [ -z "$SELECTED" ]; then
            echo "::error::Nenhum ZIP contém app/build.gradle(.kts) e settings.gradle(.kts)."
            echo "ZIPs encontrados:"
            printf ' - %s\n' "${ALL_ZIPS[@]}"
            echo "Conteúdo resumido dos ZIPs:"
            for candidate in "${ALL_ZIPS[@]}"; do
              echo "### $candidate"
              unzip -Z1 "$candidate" 2>/dev/null | head -30 || true
            done
            exit 1
          fi

          echo "zip_name=$SELECTED" >> "$GITHUB_OUTPUT"
          echo "extract_dir=$SELECTED_DIR" >> "$GITHUB_OUTPUT"
          echo "ZIP selecionado: $SELECTED"
          echo "ZIP selecionado: \`$SELECTED\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Localizar raiz Android
        id: project
        shell: bash
        env:
          EXTRACT_DIR: ${{ steps.zip.outputs.extract_dir }}
        run: |
          set -euo pipefail
          mapfile -t APP_GRADLES < <(
            find "$EXTRACT_DIR" -type f \
              \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) \
              -print | sort
          )

          ROOT=""
          for app_gradle in "${APP_GRADLES[@]}"; do
            candidate_root="$(dirname "$(dirname "$app_gradle")")"
            if [ -f "$candidate_root/settings.gradle" ] || [ -f "$candidate_root/settings.gradle.kts" ]; then
              ROOT="$candidate_root"
              break
            fi
          done

          if [ -z "$ROOT" ]; then
            echo "::error::O ZIP foi selecionado, mas a raiz Gradle não pôde ser determinada."
            find "$EXTRACT_DIR" -maxdepth 7 -type f | head -300 || true
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Projeto Android: $ROOT"
          echo "Projeto Android: \`$ROOT\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Validar dados territoriais quando presentes
        shell: bash
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          BOUNDARIES="$ROOT/app/src/main/assets/data/limites_bairros_v030.json"
          if [ -f "$BOUNDARIES" ]; then
            python3 - "$BOUNDARIES" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          data = json.loads(p.read_text(encoding="utf-8"))
          if isinstance(data, list):
              items = data
          elif isinstance(data, dict):
              items = next((data[k] for k in ("bairros", "neighborhoods", "features", "limites", "items")
                            if isinstance(data.get(k), list)), None)
          else:
              items = None
          if items is None:
              raise SystemExit("Formato territorial não reconhecido.")
          if len(items) != 25:
              raise SystemExit(f"Esperados 25 bairros; encontrados {len(items)}.")
          print("PASS: 25 bairros encontrados.")
          PY
          else
            echo "::warning::Não existe limites_bairros_v030.json nesta versão; validação territorial omitida."
          fi

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK debug
        id: build
        shell: bash
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          cd "$ROOT"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::A compilação terminou sem gerar APK."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/valepolis_apk"
          cp "$APK" "$RUNNER_TEMP/valepolis_apk/Valepolis-V0.3.0-Android.apk"
          echo "apk_path=$RUNNER_TEMP/valepolis_apk/Valepolis-V0.3.0-Android.apk" >> "$GITHUB_OUTPUT"
          echo "APK gerada: $APK"
          echo "APK gerada: \`$APK\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-Android
          if-no-files-found: error
          path: ${{ steps.build.outputs.apk_path }}

      - name: Guardar diagnóstico em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-Build-Diagnostico
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/zip_candidates/**
            ${{ steps.project.outputs.root }}/app/build/reports/**
            ${{ steps.project.outputs.root }}/app/build/outputs/logs/**
