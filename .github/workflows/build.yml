name: Valepólis V0.3.0 — PRE-FLIGHT 3D e APK bloqueado

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: valepolis-v030-preflight-3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Localizar projeto e auditar dados 3D
    runs-on: ubuntu-24.04
    outputs:
      project_dir: ${{ steps.locate.outputs.project_dir }}
      release_approved: ${{ steps.gate.outputs.release_approved }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Localizar raiz real do projeto
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            "."
            "valepolis-kotlin-migration"
          )
          found=""
          for d in "${candidates[@]}"; do
            if [[ -f "$d/settings.gradle.kts" && -f "$d/app/build.gradle.kts" ]]; then
              found="$d"; break
            fi
          done
          if [[ -z "$found" ]]; then
            found="$(find . -type f -name settings.gradle.kts -not -path '*/.gradle/*' -printf '%h\n' | head -n 1 || true)"
          fi
          if [[ -z "$found" || ! -f "$found/app/build.gradle.kts" ]]; then
            echo "::error::Não encontrei a raiz Android (settings.gradle.kts + app/build.gradle.kts). Carrega o conteúdo do projeto para a raiz do repositório."
            find . -maxdepth 4 -type f | sort | head -n 150
            exit 1
          fi
          echo "project_dir=$found" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado em: $found"

      - name: PRE-FLIGHT estático autónomo (não depende de tools/preflight_3d.py)
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          root=Path(os.environ['PROJECT_DIR']).resolve()
          checks=[]
          def check(label, ok, detail=''):
              checks.append((label,bool(ok),detail))
          required=[
            'settings.gradle.kts',
            'build.gradle.kts',
            'app/build.gradle.kts',
            'app/src/main/AndroidManifest.xml',
            'app/src/main/java/pt/valepolis/quandotocaasirene/MainActivity.kt',
          ]
          for rel in required:
              check('Ficheiro obrigatório: '+rel,(root/rel).is_file())
          def load(rel):
              p=root/rel
              try: return json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  check('JSON válido: '+rel,False,str(e)); return None
          b=load('app/src/main/assets/data/bairros_valepolis.json')
          if isinstance(b,dict):
              ns=b.get('neighborhoods')
              check('Cidade Valepólis',b.get('city')=='Valepólis',repr(b.get('city')))
              check('25 bairros declarados',b.get('neighborhood_count')==25)
              check('25 registos de bairros',isinstance(ns,list) and len(ns)==25)
              if isinstance(ns,list):
                  ids=[x.get('id') for x in ns if isinstance(x,dict)]
                  names=[x.get('name') for x in ns if isinstance(x,dict)]
                  check('IDs únicos',len(ids)==25 and len(set(ids))==25)
                  check('Nomes presentes e únicos',len(names)==25 and all(isinstance(n,str) and n.strip() for n in names) and len(set(names))==25)
          lim=load('app/src/main/assets/data/limites_bairros_v030.json')
          if isinstance(lim,dict):
              ns=lim.get('neighborhoods')
              check('25 limites declarados',lim.get('neighborhood_count')==25)
              check('25 geometrias',isinstance(ns,list) and len(ns)==25)
              if isinstance(ns,list):
                  ids=[x.get('id') for x in ns if isinstance(x,dict)]
                  check('IDs das geometrias únicos',len(ids)==25 and len(set(ids))==25)
          script=root/'tools/preflight_3d.py'
          check('Script PRE-FLIGHT auxiliar presente (opcional)',script.is_file(),
                'A auditoria autónoma continua sem este ficheiro.' if not script.is_file() else '')
          for label,ok,detail in checks:
              print(('PASS' if ok else 'FAIL')+' | '+label+((' | '+detail) if detail else ''))
          fails=sum(not x[1] for x in checks if 'opcional' not in x[0])
          print(f'TOTAL_PASS={sum(x[1] for x in checks)} TOTAL_FAIL={fails}')
          if fails:
              sys.exit(1)
          print('PRE-FLIGHT ESTÁTICO PASSOU. Isto não certifica a qualidade visual nem o 3D a 100%.')
          PY

      - name: Determinar autorização para APK
        id: gate
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          root=Path(os.environ['PROJECT_DIR'])
          p=root/'quality_gate_3d.json'
          try: g=json.loads(p.read_text(encoding='utf-8'))
          except Exception: g={}
          c=g.get('criteria',{})
          e=g.get('evidence',{})
          shots=e.get('screenshots',[]) if isinstance(e,dict) else []
          shots_ok=isinstance(shots,list) and bool(shots) and all(isinstance(s,str) and s.strip() and (root/s).is_file() for s in shots)
          evidence_ok=bool(str(e.get('device_model','')).strip() and str(e.get('android_version','')).strip() and str(e.get('validation_notes','')).strip() and shots_ok)
          ok=(g.get('approved') is True and g.get('status')=='APPROVED' and isinstance(c,dict) and bool(c) and all(v is True for v in c.values()) and evidence_ok)
          print('release_approved='+('true' if ok else 'false'))
          print('gate_status='+('APPROVED' if ok else 'BLOCKED'))
          PY
          if [[ "$(grep '^release_approved=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)" == "true" ]]; then
            echo "Gate APK: APROVADO."
          else
            echo "Gate APK: BLOQUEADO — mundo 3D ainda não validado a 100%."
          fi

      - name: Resumo do gate
        if: always()
        run: |
          echo "O PRE-FLIGHT estático não certifica sozinho a qualidade visual 3D."
          echo "O APK permanece bloqueado sem aprovação explícita e evidências de validação real."

  compile-check:
    name: Verificar compilação Kotlin sem gerar APK
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Localizar projeto Android e compilar Kotlin
        shell: bash
        run: |
          set -euo pipefail
          d="."
          if [[ ! -f "$d/settings.gradle.kts" ]]; then
            d="$(find . -type f -name settings.gradle.kts -not -path '*/.gradle/*' -printf '%h\n' | head -n 1 || true)"
          fi
          [[ -n "$d" && -f "$d/app/build.gradle.kts" ]] || { echo "::error::Raiz Android não encontrada"; exit 1; }
          cd "$d"
          gradle --no-daemon :app:compileDebugKotlin

  build-apk:
    name: Construir APK apenas após aprovação integral do 3D
    needs: [preflight, compile-check]
    if: needs.preflight.outputs.release_approved == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar gate e construir APK release
        shell: bash
        run: |
          set -euo pipefail
          d="."
          if [[ ! -f "$d/settings.gradle.kts" ]]; then
            d="$(find . -type f -name settings.gradle.kts -not -path '*/.gradle/*' -printf '%h\n' | head -n 1 || true)"
          fi
          [[ -n "$d" && -f "$d/app/build.gradle.kts" ]] || { echo "::error::Raiz Android não encontrada"; exit 1; }
          cd "$d"
          python3 - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('quality_gate_3d.json')
          try: g=json.loads(p.read_text(encoding='utf-8'))
          except Exception: g={}
          c=g.get('criteria',{}); e=g.get('evidence',{}); s=e.get('screenshots',[]) if isinstance(e,dict) else []
          ok=g.get('approved') is True and g.get('status')=='APPROVED' and isinstance(c,dict) and bool(c) and all(v is True for v in c.values()) and bool(str(e.get('device_model','')).strip()) and bool(str(e.get('android_version','')).strip()) and bool(str(e.get('validation_notes','')).strip()) and isinstance(s,list) and bool(s) and all(isinstance(x,str) and x.strip() and pathlib.Path(x).is_file() for x in s)
          print('Gate 3D aprovado' if ok else 'APK BLOQUEADO: gate 3D incompleto ou evidência em falta')
          sys.exit(0 if ok else 1)
          PY
          gradle --no-daemon :app:assembleRelease
      - name: Publicar APK validado
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-APK-3D-APROVADO
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
