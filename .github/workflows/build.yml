name: Valepólis V0.3.0 — PRE-FLIGHT 3D e APK bloqueado

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**'
      - '.github/workflows/preflight-3d.yml'

permissions:
  contents: read

concurrency:
  group: valepolis-v030-preflight-3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Auditar projeto, dados e gate 3D
    runs-on: ubuntu-24.04
    outputs:
      release_approved: ${{ steps.gate.outputs.release_approved }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Executar PRE-FLIGHT estático
        run: python tools/preflight_3d.py

      - name: Determinar autorização para APK
        id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          g=json.loads(Path('quality_gate_3d.json').read_text(encoding='utf-8'))
          c=g.get('criteria',{})
          e=g.get('evidence',{})
          shots=e.get('screenshots', []) if isinstance(e,dict) else []
          shots_exist=isinstance(shots,list) and len(shots)>0 and all(isinstance(p,str) and p.strip() and Path(p).is_file() for p in shots)
          evidence_ok=bool(e.get('device_model','').strip() and e.get('android_version','').strip() and e.get('validation_notes','').strip() and shots_exist)
          ok=(g.get('approved') is True and g.get('status')=='APPROVED' and isinstance(c,dict) and len(c)>0 and all(v is True for v in c.values()) and evidence_ok)
          print('release_approved=' + ('true' if ok else 'false'))
          print('Gate APK: ' + ('APROVADO' if ok else 'BLOQUEADO — mundo 3D ainda não validado a 100%'))
          PY

      - name: Resumo do gate
        if: always()
        run: |
          echo 'O PRE-FLIGHT estático não consegue certificar sozinho a qualidade visual 3D.'
          echo 'O APK só é construído quando quality_gate_3d.json está aprovado e existe evidência visual real.'

  compile-check:
    name: Verificar compilação Kotlin sem gerar APK
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar código Kotlin (sem empacotar APK)
        run: gradle --no-daemon :app:compileDebugKotlin

  build-apk:
    name: Construir APK apenas após aprovação integral do 3D
    needs: [preflight, compile-check]
    if: needs.preflight.outputs.release_approved == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar gate novamente imediatamente antes da construção
        run: |
          python3 -c "import json,pathlib; g=json.loads(pathlib.Path('quality_gate_3d.json').read_text()); c=g.get('criteria',{}); e=g.get('evidence',{}); s=e.get('screenshots',[]) if isinstance(e,dict) else []; ok=g.get('approved') is True and g.get('status')=='APPROVED' and isinstance(c,dict) and bool(c) and all(v is True for v in c.values()) and bool(e.get('device_model','').strip()) and bool(e.get('android_version','').strip()) and bool(e.get('validation_notes','').strip()) and isinstance(s,list) and bool(s) and all(isinstance(p,str) and p.strip() and pathlib.Path(p).is_file() for p in s); print('Gate 3D aprovado' if ok else 'APK BLOQUEADO: gate 3D incompleto ou evidência em falta'); raise SystemExit(0 if ok else 1)"
      - name: Construir APK release
        run: gradle --no-daemon :app:assembleRelease
      - name: Publicar artefacto APK validado
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-APK-3D-APROVADO
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
