name: Valepólis V0.3.0 — Kotlin Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: valepolis-kotlin-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validar e compilar APK Kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Obter código
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar projeto Kotlin a partir de qualquer ZIP
        shell: bash
        run: |
          set -euo pipefail

          # Primeiro, aceitar projeto Gradle já extraído na raiz.
          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            echo "PASS | Projeto Kotlin já está extraído na raiz"
          else
            # Procurar qualquer ZIP no repositório, sem depender do nome.
            ARCHIVE="$(find . -path './.git' -prune -o -type f -iname '*.zip' -print | sort | head -n 1 || true)"

            if [ -z "$ARCHIVE" ]; then
              echo "::error::Não foi encontrado nenhum ficheiro ZIP no repositório."
              echo "Conteúdo disponível:"
              find . -path './.git' -prune -o -maxdepth 4 -type f -print | sort | head -200
              exit 1
            fi

            echo "ZIP selecionado: $ARCHIVE"
            mkdir -p _zip_extract
            unzip -oq "$ARCHIVE" -d _zip_extract

            # Localizar um projeto Android Gradle em qualquer profundidade.
            APP_GRADLE="$(find _zip_extract -type f -path '*/app/build.gradle.kts' -print -quit)"
            if [ -z "$APP_GRADLE" ]; then
              APP_GRADLE="$(find _zip_extract -type f -path '*/app/build.gradle' -print -quit)"
            fi

            if [ -z "$APP_GRADLE" ]; then
              echo "::error::O ZIP selecionado não contém app/build.gradle.kts nem app/build.gradle."
              echo "Ficheiros extraídos (amostra):"
              find _zip_extract -maxdepth 6 -type f -print | sort | head -200
              exit 1
            fi

            PROJECT_ROOT="${APP_GRADLE%/app/build.gradle.kts}"
            if [[ "$APP_GRADLE" == */app/build.gradle ]]; then
              PROJECT_ROOT="${APP_GRADLE%/app/build.gradle}"
            fi

            if [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ] && [ ! -f "$PROJECT_ROOT/settings.gradle" ]; then
              echo "::error::Projeto encontrado, mas falta settings.gradle.kts/settings.gradle."
              exit 1
            fi

            cp -a "$PROJECT_ROOT/." .
            echo "PASS | Projeto extraído de $ARCHIVE"
          fi

          # Confirmar a estrutura necessária para o build.
          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "::error::Falta app/build.gradle.kts ou app/build.gradle na raiz preparada."
            exit 1
          fi

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "::error::Falta settings.gradle.kts ou settings.gradle na raiz preparada."
            exit 1
          fi

          echo "PASS | Estrutura Gradle localizada"

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "::error::Android SDK não encontrado em $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(
            find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null |
            sort -V | tail -n 1
          )"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Não foi encontrado o sdkmanager"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

          test -d "$SDK_ROOT/platforms/android-35"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          echo "PASS | Android SDK configurado"

      - name: Validar estrutura Kotlin e dados
        shell: bash
        run: |
          set -euo pipefail

          test -f "app/src/main/AndroidManifest.xml"

          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "::error::Falta ficheiro Gradle do módulo app"
            exit 1
          fi

          if [ ! -f "app/src/main/java/pt/valepolis/quandotocaasirene/MainActivity.kt" ]; then
            MAIN_KT="$(find app/src/main -type f -name '*.kt' -print -quit)"
            if [ -z "$MAIN_KT" ]; then
              echo "::error::Não foi encontrado código Kotlin em app/src/main"
              exit 1
            fi
            echo "Aviso: MainActivity.kt não está no caminho esperado; encontrado: $MAIN_KT"
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = Path("app/src/main/assets/data")
          required = [
              "bairros_valepolis.json",
              "populacao_valepolis.json",
              "episodes_200.json",
          ]

          missing = []
          for name in required:
              path = data / name
              if not path.is_file():
                  missing.append(str(path))
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"FALHA | JSON inválido em {path}: {exc}")

          if missing:
              print("AVISO | Recursos JSON esperados não encontrados: " + ", ".join(missing))
              print("A compilação continua; confirmar se este ZIP contém os dados de jogo.")
          else:
              print("PASS | JSON principais válidos")
          PY

      - name: Compilar APK Android
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon --stacktrace clean :app:assembleDebug 2>&1 | tee build-kotlin.log
          else
            gradle --no-daemon --stacktrace clean :app:assembleDebug 2>&1 | tee build-kotlin.log
          fi

      - name: Validar APK e calcular SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::A APK não foi gerada"
            exit 1
          fi

          sha256sum "$APK" | tee "$APK.sha256"
          echo "PASS | APK gerada e SHA-256 criado"

      - name: Publicar APK e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-Kotlin-Android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            build-kotlin.log
          if-no-files-found: warn
          retention-days: 14
