name: Valepólis V0.3.0 — PRE-FLIGHT 3D e APK bloqueado

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: valepolis-v030-preflight-3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Extrair projeto, auditar 3D e verificar compilação
    runs-on: ubuntu-24.04
    outputs:
      release_approved: ${{ steps.gate.outputs.release_approved }}
      project_dir: ${{ steps.locate.outputs.project_dir }}
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Instalar ferramentas de auditoria
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip python3

      - name: Localizar projeto Android (pasta ou ZIP carregado no GitHub)
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/valepolis-extracted"
          find . -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -not -path './.git/*' -print > "$RUNNER_TEMP/settings-files.txt"

          found=""
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if [[ -f "$d/app/build.gradle" || -f "$d/app/build.gradle.kts" ]]; then
              found="$d"; break
            fi
          done < "$RUNNER_TEMP/settings-files.txt"

          if [[ -z "$found" ]]; then
            while IFS= read -r archive; do
              [[ -n "$archive" ]] || continue
              dest="$RUNNER_TEMP/valepolis-extracted/$(basename "$archive" .zip)"
              mkdir -p "$dest"
              if ! unzip -oq "$archive" -d "$dest"; then
                echo "::warning::Não foi possível extrair $archive"
                continue
              fi
              while IFS= read -r f; do
                d="$(dirname "$f")"
                if [[ -f "$d/app/build.gradle" || -f "$d/app/build.gradle.kts" ]]; then
                  found="$d"; break 2
                fi
              done < <(find "$dest" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -not -path '*/.gradle/*' -print)
            done < <(find . -type f -iname '*.zip' -not -path './.git/*' -print | sort)
          fi

          if [[ -z "$found" ]]; then
            echo "::error::Não encontrei um projeto Android. O ZIP no repositório pode não conter settings.gradle(.kts) e app/build.gradle(.kts)."
            echo "Ficheiros encontrados no repositório:"
            find . -maxdepth 4 -type f -not -path './.git/*' | sort | head -n 200
            echo "Conteúdo de ZIPs:"
            find "$RUNNER_TEMP/valepolis-extracted" -maxdepth 5 -type f | head -n 100 || true
            exit 1
          fi

          echo "project_dir=$found" >> "$GITHUB_OUTPUT"
          echo "Projeto Android encontrado em: $found"

      - name: PRE-FLIGHT estático dos dados territoriais
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          root=Path(os.environ["PROJECT_DIR"]).resolve()
          results=[]
          def check(label, ok, detail=""):
              results.append((label, bool(ok), detail))
          for rel in ("settings.gradle.kts","settings.gradle","app/build.gradle.kts","app/build.gradle","app/src/main/AndroidManifest.xml"):
              if (root/rel).exists():
                  check("Ficheiro obrigatório: "+rel, True)
          check("Manifest Android", (root/"app/src/main/AndroidManifest.xml").is_file())
          assets=root/"app/src/main/assets"
          candidates=list(assets.rglob("*.json")) if assets.exists() else []
          neighborhood_file=next((p for p in candidates if p.name=="bairros_valepolis.json"),None)
          limits_file=next((p for p in candidates if p.name=="limites_bairros_v030.json"),None)
          def load(p,label):
              if not p:
                  check(label,False,"Ficheiro não encontrado nos assets")
                  return None
              try:
                  return json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  check(label,False,str(e))
                  return None
          b=load(neighborhood_file,"JSON dos bairros encontrado e válido")
          if isinstance(b,dict):
              ns=b.get("neighborhoods")
              check("Cidade Valepólis",b.get("city")=="Valepólis",repr(b.get("city")))
              check("Contagem declarada de 25 bairros",b.get("neighborhood_count")==25)
              check("25 registos de bairros",isinstance(ns,list) and len(ns)==25)
              if isinstance(ns,list):
                  ids=[x.get("id") for x in ns if isinstance(x,dict)]
                  names=[x.get("name") for x in ns if isinstance(x,dict)]
                  check("IDs únicos",len(ids)==25 and len(set(ids))==25)
                  check("Nomes preenchidos e únicos",len(names)==25 and all(isinstance(n,str) and n.strip() for n in names) and len(set(names))==25)
          lim=load(limits_file,"JSON dos limites encontrado e válido")
          if isinstance(lim,dict):
              ns=lim.get("neighborhoods")
              check("25 limites declarados",lim.get("neighborhood_count")==25)
              check("25 geometrias de bairros",isinstance(ns,list) and len(ns)==25)
          for label,ok,detail in results:
              print(("PASS" if ok else "FAIL")+" | "+label+((" | "+detail) if detail else ""))
          failures=sum(not ok for _,ok,_ in results)
          print(f"TOTAL_PASS={len(results)-failures} TOTAL_FAIL={failures}")
          if failures:
              sys.exit(1)
          print("PRE-FLIGHT estático aprovado; isto não certifica a qualidade visual do 3D.")
          PY

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar Kotlin sem publicar APK
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:compileDebugKotlin

      - name: Avaliar gate de libertação do APK
        id: gate
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          root=Path(os.environ["PROJECT_DIR"])
          p=root/"quality_gate_3d.json"
          try: g=json.loads(p.read_text(encoding="utf-8"))
          except Exception: g={}
          c=g.get("criteria",{})
          e=g.get("evidence",{})
          screenshots=e.get("screenshots",[]) if isinstance(e,dict) else []
          screenshots_ok=isinstance(screenshots,list) and bool(screenshots) and all(isinstance(s,str) and s.strip() and (root/s).is_file() for s in screenshots)
          evidence_ok=bool(str(e.get("device_model","")).strip() and str(e.get("android_version","")).strip() and str(e.get("validation_notes","")).strip() and screenshots_ok)
          approved=(g.get("approved") is True and g.get("status")=="APPROVED" and isinstance(c,dict) and bool(c) and all(v is True for v in c.values()) and evidence_ok)
          print("release_approved="+("true" if approved else "false"))
          print("APK "+("autorizado pelo gate" if approved else "BLOQUEADO: falta aprovação/evidência visual"))
          PY

      - name: Construir APK release apenas após aprovação
        if: steps.gate.outputs.release_approved == 'true' && github.ref == 'refs/heads/main'
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleRelease

      - name: Publicar APK aprovado
        if: steps.gate.outputs.release_approved == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-APK-3D-APROVADO
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Resumo final
        if: always()
        run: |
          echo "A aprovação estática não prova que o 3D está a 100%."
          echo "O APK só pode ser publicado com gate aprovado e evidências visuais reais."
