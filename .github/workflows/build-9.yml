name: A Última Expedição V0.1.126 — PRE-FLIGHT e APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ultima-expedicao-v0126-android-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.5.0
  APK_NAME: A-Ultima-Expedicao-v0.1.126-android.apk
  MAX_FILE_MIB: 25

jobs:
  preflight-android:
    name: Auditar, importar, testar e exportar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Localizar ou extrair projeto Godot
        shell: bash
        run: |
          set -euo pipefail
          root=""
          if [ -s project.godot ]; then
            root="$GITHUB_WORKSPACE"
          else
            # Primeiro procura um projeto já extraído no repositório.
            root="$(find . -type f -name project.godot -not -path './.git/*' -not -path './.godot/*' -printf '%h\n' -quit || true)"
          fi

          if [ -z "$root" ]; then
            # O repositório contém ZIPs do projeto em vez dos ficheiros Godot diretamente.
            # Só extrai um ZIP se a sua listagem confirmar que contém project.godot.
            mkdir -p "$RUNNER_TEMP/ultima-expedicao-project"
            candidates=()
            while IFS= read -r archive; do
              if unzip -Z1 "$archive" 2>/dev/null | grep -Eq '(^|/)project\.godot$'; then
                candidates+=("$archive")
              fi
            done < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' -print | sort)

            if [ "${#candidates[@]}" -eq 0 ]; then
              echo "::error::Não existe project.godot no repositório nem em nenhum ZIP da raiz. É necessário carregar o ZIP que contém o projeto Godot completo."
              echo "ZIPs encontrados na raiz:"
              find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort || true
              exit 1
            fi
            # Seleção explícita do ZIP de personagem humano auditado. Não escolher por ordem alfabética.
            selected=""
            for archive in "${candidates[@]}"; do
              case "$(basename "$archive")" in
                A-Ultima-Expedicao-v0.1.126-HUMANO-SEM-CABELO.zip) selected="$archive" ;;
              esac
            done
            if [ -z "$selected" ]; then
              printf '::error::O ZIP aprovado para a correção do personagem não foi encontrado. Candidatos: \n'
              printf ' - %s\n' "${candidates[@]}"
              exit 1
            fi

            echo "A extrair o projeto selecionado explicitamente: $selected"
            unzip -q "$selected" -d "$RUNNER_TEMP/ultima-expedicao-project"
            root="$(find "$RUNNER_TEMP/ultima-expedicao-project" -type f -name project.godot -printf '%h\n' -quit || true)"
          fi

          if [ -z "${root:-}" ] || [ ! -s "$root/project.godot" ]; then
            echo "::error::Não foi possível resolver uma pasta de projeto válida com project.godot."
            exit 1
          fi
          root="$(realpath "$root")"
          echo "PROJECT_DIR=$root" >> "$GITHUB_ENV"
          echo "Projeto Godot encontrado em: $root"


      - name: Corrigir retorno antecipado que desativava a criatura
        shell: bash
        run: |
          set -euo pipefail
          python - "$PROJECT_DIR/scripts/expedition.gd" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = """func _activate_entity_reaction(outcome: String) -> void:
          \t# V0.1.126 cleanup: a criatura foi removida do jogo. Mantém-se a assinatura
          \t# para que decisões/RPC antigos não quebrem, mas não cria qualquer entidade.
          \tentity_active = false
          \tentity_presence = null
          \treturn
          \t# Código antigo preservado temporariamente abaixo para facilitar auditoria.
          """
          new = """func _activate_entity_reaction(outcome: String) -> void:
          \t# A criatura permanece ativa sob controlo da IA; a aparição depende de eventos
          \t# narrativos e decisões, não apenas da passagem do tempo.
          """
          if old not in text:
              if "V0.1.126 cleanup: a criatura foi removida do jogo" not in text:
                  print("A correção já não é necessária; bloco de desativação não encontrado.")
                  sys.exit(0)
              print("FAIL: foi encontrada uma variante inesperada do bloco de desativação.")
              sys.exit(1)
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          print("PASS: removido o retorno antecipado que impedia a lógica de criação da criatura.")
          PY

      - name: Repor apenas recursos ausentes do PROJETO-BASE
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_WORKSPACE/A-Ultima-Expedicao-v0.1.126-PROJETO-BASE.zip" "$PROJECT_DIR" "$GITHUB_WORKSPACE/zip-merge-report.txt" <<'PY'
          import pathlib, shutil, sys, tempfile, zipfile
          archive = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2]).resolve()
          report_path = pathlib.Path(sys.argv[3])
          if not archive.is_file():
              raise SystemExit("FAIL: não foi encontrado o ZIP PROJETO-BASE para recuperar dependências ausentes.")
          copied, kept = [], []
          with tempfile.TemporaryDirectory(prefix="base-deps-") as temp:
              temp_path = pathlib.Path(temp)
              with zipfile.ZipFile(archive) as z:
                  bad = z.testzip()
                  if bad:
                      raise SystemExit(f"FAIL: ZIP PROJETO-BASE corrompido: {bad}")
                  z.extractall(temp_path)
              roots = [p.parent for p in temp_path.rglob("project.godot") if p.is_file()]
              if len(roots) != 1:
                  raise SystemExit(f"FAIL: esperado um project.godot no PROJETO-BASE; encontrados {len(roots)}.")
              base_root = roots[0]
              for source in base_root.rglob("*"):
                  if not source.is_file():
                      continue
                  relative = source.relative_to(base_root)
                  destination = target / relative
                  if destination.exists():
                      kept.append(relative.as_posix())
                      continue
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, destination)
                  copied.append(relative.as_posix())
          report = [
              "Merge de dependências: apenas ficheiros ausentes copiados do PROJETO-BASE.",
              "Ficheiros existentes no HUMANO-SEM-CABELO foram preservados, sem sobrescrita.",
              f"Copiados: {len(copied)}",
              f"Preservados por já existirem: {len(kept)}",
              "",
              "Ficheiros copiados:",
              *(f"- {p}" for p in copied),
          ]
          report_path.write_text("\n".join(report) + "\n", encoding="utf-8")
          print("\n".join(report))
          PY

      - name: Recuperar kit modular a partir de arquivos disponíveis
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_WORKSPACE" "$PROJECT_DIR" <<'PY'
          import pathlib, sys, zipfile
          workspace = pathlib.Path(sys.argv[1])
          project = pathlib.Path(sys.argv[2])
          required = ("assets/station_corridor_kit.blend", "assets/station_corridor_kit.glb")
          missing = [p for p in required if not (project / p).is_file()]
          if not missing:
              print("PASS: kit modular já está presente.")
              raise SystemExit(0)
          candidates = sorted(workspace.glob("*.zip"))
          restored = []
          for archive in candidates:
              try:
                  with zipfile.ZipFile(archive) as z:
                      members = {pathlib.PurePosixPath(n).name: n for n in z.namelist() if not n.endswith("/")}
                      for rel in list(missing):
                          name = pathlib.PurePosixPath(rel).name
                          member = members.get(name)
                          if member:
                              destination = project / rel
                              destination.parent.mkdir(parents=True, exist_ok=True)
                              destination.write_bytes(z.read(member))
                              restored.append(f"{rel} <- {archive.name}:{member}")
                              missing.remove(rel)
                  if not missing:
                      break
              except (OSError, zipfile.BadZipFile):
                  continue
          for item in restored:
              print("RESTORED:", item)
          if missing:
              print("FAIL: kit modular não encontrado nos ZIPs presentes no repositório:")
              for rel in missing:
                  print(" -", rel)
              print("O PRE-FLIGHT para aqui sem inventar ou substituir os modelos.")
              raise SystemExit(1)
          print("PASS: ambos os ficheiros do kit modular foram recuperados de arquivos do repositório.")
          PY

      - name: Auditar limite de 25 MiB por ficheiro
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python - <<'PY'
          import os, sys
          limit = 25 * 1024 * 1024
          oversized = []
          lfs_patterns = []
          if os.path.isfile(".gitattributes"):
              with open(".gitattributes", encoding="utf-8", errors="replace") as f:
                  for line in f:
                      line = line.split("#", 1)[0].strip()
                      if line and "filter=lfs" in line:
                          lfs_patterns.append(line.split()[0])
          import fnmatch
          def is_lfs(path):
              path = path.removeprefix("./")
              return any(fnmatch.fnmatch(path, pattern) or fnmatch.fnmatch("/" + path, pattern) for pattern in lfs_patterns)
          for base, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in {".git", ".godot"}]
              for name in files:
                  path = os.path.join(base, name)
                  try:
                      size = os.path.getsize(path)
                  except OSError:
                      continue
                  if size > limit and not is_lfs(path):
                      oversized.append((size, path))
          if oversized:
              print("FAIL: ficheiros acima de 25 MiB que não estão cobertos por Git LFS:")
              for size, path in sorted(oversized, reverse=True):
                  print(f"{size / 1024 / 1024:.2f} MiB  {path}")
              print("O workflow não remove nem comprime ficheiros automaticamente.")
              sys.exit(1)
          print("PASS: todos os ficheiros são <=25 MiB ou estão explicitamente configurados em .gitattributes para Git LFS.")
          PY

      - name: Verificar ficheiros essenciais e versão
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -s project.godot
          test -s export_presets.cfg
          if [ -f VERSION.txt ]; then
            test "$(tr -d '\r\n' < VERSION.txt)" = "0.1.126"
          fi
          if [ -f scripts/VERSION.txt ]; then
            test "$(tr -d '\r\n' < scripts/VERSION.txt)" = "0.1.126"
          fi
          if [ -f tests/quality_audit.py ]; then
            python tests/quality_audit.py
          else
            echo "::warning::tests/quality_audit.py não existe; auditoria estática específica marcada como SKIP."
          fi

      - name: Instalar Godot 4.5
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.0
          use-dotnet: false
          include-templates: true

      - name: Confirmar versão do motor
        run: godot --version

      - name: Importar recursos no Godot (com diagnóstico e limite)
        shell: bash
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"
          log="$GITHUB_WORKSPACE/godot-import.log"
          echo "Início da importação: $(date -u +%FT%TZ)"
          echo "Projeto: $PROJECT_DIR"
          echo "Godot: $(godot --version)"
          echo "Recursos 3D e áudio que serão importados:"
          find . -type f \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.blend' -o -iname '*.wav' -o -iname '*.png' \) -not -path './.godot/*' -printf '%s bytes %p\n' | sort -nr | head -40
          set +e
          timeout --signal=TERM --kill-after=30s 12m godot --headless --verbose --editor --path . --quit 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          echo "Fim da importação: $(date -u +%FT%TZ)"
          echo "GODOT_IMPORT_EXIT_CODE=$status"
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::Importação excedeu 12 minutos; log e recurso em processamento ficam disponíveis para diagnóstico."
            tail -n 250 "$log" || true
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::Godot terminou a importação com código $status."
            tail -n 250 "$log" || true
            exit "$status"
          fi
          echo "PASS: processo de importação terminou."

      - name: Teste de arranque headless
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          godot --headless --path . --quit-after 5 2>&1 | tee "$GITHUB_WORKSPACE/godot-startup.log"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Verificar preset Android
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          grep -Eq '^\[preset\.[0-9]+\]' export_presets.cfg
          grep -Eq '^platform="Android"$' export_presets.cfg
          grep -Eq '^name="Android"$' export_presets.cfg

      - name: Exportar APK Android
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p build
          godot --headless --path . --export-debug "Android" "build/$APK_NAME" 2>&1 | tee "$GITHUB_WORKSPACE/godot-export.log"
          test -s "build/$APK_NAME"
          echo "APK_EXPORT_PASS=True"

      - name: Publicar APK e relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-v0.1.126-Android-PRE-FLIGHT
          path: |
            **/build/A-Ultima-Expedicao-v0.1.126-android.apk
            godot-import.log
            godot-startup.log
            godot-export.log
            zip-merge-report.txt
          if-no-files-found: warn
          retention-days: 14
