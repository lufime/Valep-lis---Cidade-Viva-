name: A Última Expedição — APK Android (Godot + modelos 3D)

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: "ZIP do projeto Godot (deixar vazio para detetar automaticamente)"
        required: false
        type: string
        default: ""
  push:
    paths:
      - ".github/workflows/ultima-expedicao-apk-android.yml"
      - "**/*.gd"
      - "**/*.tscn"
      - "**/*.tres"
      - "**/*.godot"
      - "export_presets.cfg"
      - "*.zip"

permissions:
  contents: read

concurrency:
  group: ultima-expedicao-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Auditar e compilar APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Localizar e extrair o projeto
        id: project
        env:
          SOURCE_ZIP: ${{ inputs.source_zip }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SOURCE_ZIP}" ]; then
            ZIP_PATH="${SOURCE_ZIP}"
            test -f "$ZIP_PATH" || { echo "::error::ZIP indicado não existe: $ZIP_PATH"; exit 1; }
          elif [ -f "project.godot" ]; then
            echo "project_dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            exit 0
          else
            ZIP_PATH="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*A*Ultima*Expedicao*.zip' ! -iname '*result*' | head -n 1)"
            if [ -z "$ZIP_PATH" ]; then
              ZIP_PATH="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' ! -iname '*result*' | head -n 1)"
            fi
            test -n "$ZIP_PATH" || { echo "::error::Não encontrei project.godot nem ZIP do projeto."; exit 1; }
          fi
          mkdir -p "$RUNNER_TEMP/game-source"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/game-source"
          PROJECT_FILE="$(find "$RUNNER_TEMP/game-source" -type f -name project.godot -print -quit)"
          test -n "$PROJECT_FILE" || { echo "::error::O ZIP não contém project.godot; não é um projeto Godot completo."; exit 1; }
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          test -f "$PROJECT_DIR/export_presets.cfg" || { echo "::error::Falta export_presets.cfg no projeto."; exit 1; }
          test -f "$PROJECT_DIR/scenes/Boot.tscn" || { echo "::error::Falta scenes/Boot.tscn."; exit 1; }
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto localizado em: $PROJECT_DIR"

      - name: Instalar Godot 4.5 e templates de exportação
        shell: bash
        run: |
          set -euo pipefail
          VERSION="4.5"
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          wget -q "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" -O "$RUNNER_TEMP/godot/godot.zip"
          unzip -oq "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 2 -type f -name 'Godot_v*-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          wget -q "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz" -O "$RUNNER_TEMP/godot/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot/templates"
          unzip -oq "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          test -d "$RUNNER_TEMP/godot/templates/templates"
          cp -a "$RUNNER_TEMP/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"
          "$GODOT_BIN" --version

      - name: Configurar definições Android do Godot
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 2>/dev/null || true
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Auditoria estática do projeto
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tests/quality_audit.py ]; then
            python3 tests/quality_audit.py
          else
            echo "::error::O projeto não inclui tests/quality_audit.py; não vou marcar a auditoria como aprovada."
            exit 1
          fi

      - name: Importar recursos e validar arranque Godot
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --import
          "$GODOT_BIN" --headless --editor --path . --quit
          "$GODOT_BIN" --headless --path . --quit-after 5

      - name: Exportar APK de depuração
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          "$GODOT_BIN" --headless --path . --export-debug "Android" "$GITHUB_WORKSPACE/build/A-Ultima-Expedicao-v0.1.107-android.apk"

      - name: Verificar APK e calcular SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/build/A-Ultima-Expedicao-v0.1.107-android.apk"
          test -s "$APK" || { echo "::error::A APK não foi criada."; exit 1; }
          unzip -l "$APK" | grep -q 'AndroidManifest.xml' || { echo "::error::A APK não contém AndroidManifest.xml."; exit 1; }
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/build/SHA256SUMS.txt"
          echo "APK criada e verificação estrutural concluída. Isto não substitui testes num dispositivo Android."

      - name: Guardar APK e logs como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-Android-${{ github.run_number }}
          path: |
            build/*.apk
            build/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14
