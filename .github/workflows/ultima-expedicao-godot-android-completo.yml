name: A Última Expedição — Blender a partir de ZIP

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Caminho do ZIP do projeto no repositório (ex.: assets/projeto-blender.zip)"
        required: true
        type: string
        default: "assets/projeto-blender.zip"
      script_path:
        description: "Caminho do script Python do Blender dentro do repositório"
        required: true
        type: string
        default: "blender/gerar_estacao_blender.py"

permissions:
  contents: read

concurrency:
  group: blender-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-blender-from-zip:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Validar caminhos fornecidos
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
          SCRIPT_PATH: ${{ inputs.script_path }}
        run: |
          set -euo pipefail
          test -f "$ZIP_PATH" || {
            echo "::error::Não foi encontrado o ZIP: $ZIP_PATH"
            echo "Confirma o caminho exato do ZIP no repositório."
            exit 1
          }
          test -f "$SCRIPT_PATH" || {
            echo "::error::Não foi encontrado o script Blender: $SCRIPT_PATH"
            echo "Confirma o caminho exato do script no repositório."
            exit 1
          }
          echo "ZIP encontrado: $ZIP_PATH"
          echo "Script encontrado: $SCRIPT_PATH"

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y blender unzip zip

      - name: Registar versão do Blender
        run: blender --background --version | tee blender-version.log

      - name: Verificar e extrair ZIP do projeto
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP_PATH" | tee zip-integrity.log
          mkdir -p entrada_zip
          unzip -q "$ZIP_PATH" -d entrada_zip
          echo "Conteúdo extraído:"
          find entrada_zip -maxdepth 4 -type f -print | sort | tee zip-files.txt

      - name: Executar script Blender
        env:
          SCRIPT_PATH: ${{ inputs.script_path }}
          OUTPUT_DIR: ${{ github.workspace }}/saida_blender
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          blender --background --python "$SCRIPT_PATH" 2>&1 | tee blender-build.log

      - name: Validar ficheiros de saída
        if: success()
        run: |
          set -euo pipefail
          test -s "saida_blender/A_Ultima_Expedicao_Estacao_Completa.blend"
          test -s "saida_blender/A_Ultima_Expedicao_Estacao_Completa.glb"
          ls -lh saida_blender/
          echo "PASS: os ficheiros .blend e .glb existem e não estão vazios."

      - name: Preparar ZIP de resultados e logs
        if: always()
        run: |
          mkdir -p entrega
          cp blender-version.log entrega/ 2>/dev/null || true
          cp zip-integrity.log entrega/ 2>/dev/null || true
          cp zip-files.txt entrega/ 2>/dev/null || true
          cp blender-build.log entrega/ 2>/dev/null || true
          cp -r saida_blender entrega/ 2>/dev/null || true
          if [ -d entrada_zip ]; then
            cp -r entrada_zip entrega/ 2>/dev/null || true
          fi
          zip -qr A_Ultima_Expedicao_Blender_Resultados.zip entrega

      - name: Publicar ZIP e logs como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-Blender-Resultados
          path: |
            A_Ultima_Expedicao_Blender_Resultados.zip
            blender-version.log
            zip-integrity.log
            zip-files.txt
            blender-build.log
          if-no-files-found: warn
          retention-days: 14
