name: A Última Expedição — Validar projeto e gerar APK Android

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Caminho do ZIP do projeto na raiz do repositório (vazio = seleção automática)"
        required: false
        type: string
        default: ""
      godot_version:
        description: "Versão estável do Godot 4 (ex.: 4.5.1)"
        required: true
        type: string
        default: "4.5.1"

permissions:
  contents: read

concurrency:
  group: ultima-expedicao-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Validar projeto Godot e exportar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip wget curl openjdk-17-jdk python3
          java -version
          unzip -v | head -n 2

      - name: Selecionar e extrair ZIP do projeto
        env:
          ZIP_INPUT: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          ZIP_PATH="${ZIP_INPUT:-}"

          if [ -n "$ZIP_PATH" ]; then
            [ -f "$ZIP_PATH" ] || { echo "::error::O ZIP indicado não existe: $ZIP_PATH"; exit 1; }
          else
            for candidate in \
              "./A-Ultima-Expedicao-Godot-v0.1.107-KIT-3D-GLB-1.zip" \
              "./A-Ultima-Expedicao-Godot-v0.1.107-KIT-3D-GLB.zip"; do
              if [ -f "$candidate" ]; then ZIP_PATH="$candidate"; break; fi
            done
            if [ -z "$ZIP_PATH" ]; then
              ZIP_PATH="$(find . -maxdepth 1 -type f -iname '*.zip' \
                ! -iname '*resultados*' ! -iname '*results*' ! -iname '*blender*' \
                -print | sort | head -n 1)"
            fi
          fi

          if [ -z "$ZIP_PATH" ] || [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Não foi encontrado um ZIP de origem na raiz do repositório."
            find . -maxdepth 1 -type f -iname '*.zip' -print | sort || true
            exit 1
          fi

          echo "ZIP selecionado: $ZIP_PATH"
          unzip -t "$ZIP_PATH" | tee zip-integrity.log
          mkdir -p projeto_extraido
          unzip -q "$ZIP_PATH" -d projeto_extraido

          PROJECT_FILE="$(find projeto_extraido -type f -name project.godot -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::O ZIP selecionado não contém project.godot. Este ZIP pode conter apenas recursos/modelos 3D, e não o projeto Godot completo."
            find projeto_extraido -maxdepth 4 -type f | sort | head -n 300 || true
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_FILE=$PROJECT_FILE" >> "$GITHUB_ENV"
          echo "Projeto Godot encontrado: $PROJECT_FILE"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -n 500 | tee project-files.txt

      - name: Instalar Godot e templates de exportação
        env:
          GODOT_VERSION: ${{ inputs.godot_version }}
        run: |
          set -euo pipefail
          VERSION="${GODOT_VERSION}"
          BASE="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"
          GODOT_ZIP="Godot_v${VERSION}-stable_linux.x86_64.zip"
          TEMPLATES_ZIP="Godot_v${VERSION}-stable_export_templates.tpz"

          wget -q --show-progress "${BASE}/${GODOT_ZIP}" -O godot.zip
          wget -q --show-progress "${BASE}/${TEMPLATES_ZIP}" -O templates.tpz

          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          unzip -q godot.zip -d "$HOME/godot"
          unzip -q templates.tpz -d templates_extracted

          TEMPLATE_SOURCE="$(find templates_extracted -type d -name templates -print -quit)"
          if [ -z "$TEMPLATE_SOURCE" ]; then
            echo "::error::Não foi encontrada a pasta templates no pacote oficial de exportação."
            find templates_extracted -maxdepth 3 -type f | head -n 100 || true
            exit 1
          fi
          cp -a "$TEMPLATE_SOURCE/." "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"

          GODOT_BIN="$(find "$HOME/godot" -maxdepth 2 -type f -name 'Godot_v*-stable_linux.x86_64' -print -quit)"
          if [ -z "$GODOT_BIN" ]; then
            echo "::error::Não foi encontrado o executável Godot no pacote descarregado."
            exit 1
          fi
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version | tee godot-version.log

      - name: Validar projeto e descobrir preset Android
        run: |
          set -euo pipefail
          test -s "$PROJECT_FILE"
          python3 - "$PROJECT_DIR/export_presets.cfg" <<'PY'
          import configparser
          import os
          import sys

          path = sys.argv[1]
          if not os.path.isfile(path):
              print("::error::Falta export_presets.cfg. É necessário configurar um preset Android no editor Godot.")
              raise SystemExit(1)

          parser = configparser.ConfigParser(interpolation=None, strict=False)
          parser.read(path, encoding="utf-8")
          found = []
          for section in parser.sections():
              if not section.startswith("preset."):
                  continue
              name = parser.get(section, "name", fallback="")
              platform = parser.get(section, "platform", fallback="")
              if platform.lower() == "android" or "android" in name.lower():
                  found.append(name)

          if not found:
              print("::error::Não existe um preset Android em export_presets.cfg.")
              print("Presets encontrados:")
              for section in parser.sections():
                  if section.startswith("preset."):
                      print(section, parser.get(section, "name", fallback="?"),
                            parser.get(section, "platform", fallback="?"))
              raise SystemExit(1)

          # Use the first Android preset and pass its exact name to Godot.
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("ANDROID_PRESET=" + found[0].replace("\n", "") + "\n")
          print("ANDROID_PRESET_FOUND=", found[0])
          PY

      - name: Importar recursos e validar projeto
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" --editor --import 2>&1 | tee godot-import.log
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" --quit 2>&1 | tee godot-validation.log

      - name: Exportar APK de depuração
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" --export-debug "$ANDROID_PRESET" "$GITHUB_WORKSPACE/build/A_Ultima_Expedicao-debug.apk" 2>&1 | tee godot-export.log

      - name: Validar APK gerada
        run: |
          set -euo pipefail
          APK="build/A_Ultima_Expedicao-debug.apk"
          test -s "$APK"
          python3 - "$APK" <<'PY'
          import os
          import sys
          import zipfile

          path = sys.argv[1]
          if not zipfile.is_zipfile(path):
              raise SystemExit("APK_FAIL: o ficheiro gerado não é um arquivo ZIP/APK válido.")
          with zipfile.ZipFile(path) as z:
              names = set(z.namelist())
              if "AndroidManifest.xml" not in names:
                  raise SystemExit("APK_FAIL: AndroidManifest.xml não encontrado.")
              if not any(n.startswith("lib/") for n in names) and not any(n.endswith(".dex") for n in names):
                  print("AVISO: não foi encontrada biblioteca nativa nem ficheiro DEX; verificar o conteúdo da APK.")
              print("APK_ZIP_VALID=True")
              print("APK_FILE_COUNT=", len(names))
              print("ANDROID_MANIFEST=True")
          print("APK_SIZE_BYTES=", os.path.getsize(path))
          PY
          sha256sum "$APK" | tee apk-sha256.txt
          ls -lh "$APK"
          echo "APK_VALIDATION_PASS=True"

      - name: Publicar APK e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-APK-Android
          path: |
            build/A_Ultima_Expedicao-debug.apk
            godot-version.log
            zip-integrity.log
            project-files.txt
            godot-import.log
            godot-validation.log
            godot-export.log
            apk-sha256.txt
          if-no-files-found: warn
          retention-days: 14
