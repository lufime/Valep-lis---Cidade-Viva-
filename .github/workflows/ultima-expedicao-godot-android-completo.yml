name: A Última Expedição — Gerar projeto Blender

on:
  workflow_dispatch:
  push:
    paths:
      - "blender/gerar_estacao_blender.py"
      - ".github/workflows/blender-estacao.yml"

permissions:
  contents: read

jobs:
  gerar-estacao:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Instalar Blender e ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y blender zip

      - name: Verificar versão do Blender
        run: blender --background --version

      - name: Criar pasta de saída
        run: mkdir -p "$GITHUB_WORKSPACE/saida_blender"

      - name: Gerar cena Blender e exportar GLB
        env:
          OUTPUT_DIR: ${{ github.workspace }}/saida_blender
        run: |
          set -o pipefail
          blender --background --python blender/gerar_estacao_blender.py 2>&1 | tee blender-build.log
          test -s "saida_blender/A_Ultima_Expedicao_Estacao_Completa.blend"
          test -s "saida_blender/A_Ultima_Expedicao_Estacao_Completa.glb"
          echo "PASS: .blend e .glb existem e não estão vazios"

      - name: Empacotar ficheiros e logs
        if: always()
        run: |
          mkdir -p artefactos
          cp blender-build.log artefactos/ 2>/dev/null || true
          cp -r saida_blender artefactos/ 2>/dev/null || true
          zip -r A_Ultima_Expedicao_Blender_Artefactos.zip artefactos

      - name: Publicar ficheiros gerados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-Blender
          path: |
            A_Ultima_Expedicao_Blender_Artefactos.zip
            blender-build.log
          if-no-files-found: warn
          retention-days: 14
