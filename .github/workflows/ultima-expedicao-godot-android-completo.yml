name: A Última Expedição — Gerar BLEND a partir do ZIP

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "ZIP do projeto na raiz do repositório (vazio = selecionar automaticamente)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: blender-from-project-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-blend:
    name: Validar ZIP e gerar ficheiros Blender
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Instalar Blender, NumPy e ferramentas ZIP
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy unzip zip
          blender --background --version | tee blender-version.log
          echo "Verificar se o NumPy está disponível no Python do Blender..."
          blender --background --python-expr "import numpy; print('NUMPY_OK', numpy.__version__)" 2>&1 | tee numpy-check.log

      - name: Selecionar, validar e extrair o ZIP do projeto
        env:
          ZIP_INPUT: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          ZIP_PATH="${ZIP_INPUT:-}"

          if [ -n "$ZIP_PATH" ]; then
            [ -f "$ZIP_PATH" ] || { echo "::error::O ZIP indicado não existe: $ZIP_PATH"; exit 1; }
          else
            for candidate in \
              "./A-Ultima-Expedicao-Godot-v0.1.107-KIT-3D-GLB-1.zip" \
              "./A-Ultima-Expedicao-Godot-v0.1.107-KIT-3D-GLB.zip"; do
              if [ -f "$candidate" ]; then ZIP_PATH="$candidate"; break; fi
            done
            if [ -z "$ZIP_PATH" ]; then
              ZIP_PATH="$(find . -maxdepth 1 -type f -iname '*.zip' \
                ! -iname '*resultados*' ! -iname '*results*' -print | sort | head -n 1)"
            fi
          fi

          if [ -z "$ZIP_PATH" ] || [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Não foi encontrado o ZIP de origem do projeto na raiz."
            find . -maxdepth 2 -type f -iname '*.zip' -print | sort || true
            exit 1
          fi

          echo "ZIP selecionado: $ZIP_PATH"
          unzip -t "$ZIP_PATH" | tee zip-integrity.log
          mkdir -p entrada_zip
          unzip -q "$ZIP_PATH" -d entrada_zip
          find entrada_zip -type f -print | sort | tee zip-files.txt

          GLB_PATH="$(find entrada_zip -type f -name 'station_corridor_kit.glb' -print -quit)"
          if [ -z "$GLB_PATH" ]; then
            GLB_PATH="$(find entrada_zip -type f -iname '*.glb' -print -quit)"
          fi
          if [ -z "$GLB_PATH" ]; then
            echo "::error::O ZIP de origem não contém nenhum ficheiro .glb."
            echo "Conteúdo da pasta assets, se existir:"
            find entrada_zip -type f -ipath '*/assets/*' -print | sort || true
            exit 1
          fi

          echo "GLB_PATH=$GLB_PATH" >> "$GITHUB_ENV"
          echo "GLB encontrado: $GLB_PATH"

      - name: Criar script de conversão GLB para BLEND
        run: |
          cat > converter_glb.py <<'PY'
          import bpy
          import os
          import numpy

          print("NUMPY_OK", numpy.__version__)
          source = os.path.abspath(os.environ["GLB_PATH"])
          outdir = os.path.abspath("saida_blender")
          os.makedirs(outdir, exist_ok=True)

          if not os.path.isfile(source):
              raise FileNotFoundError("GLB de origem não encontrado: " + source)

          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.gltf(filepath=source)

          objects = list(bpy.context.scene.objects)
          if not objects:
              raise RuntimeError("A importação do GLB não criou objetos Blender.")

          blend_path = os.path.join(outdir, "A_Ultima_Expedicao_Kit_3D.blend")
          glb_path = os.path.join(outdir, "A_Ultima_Expedicao_Kit_3D.glb")
          bpy.ops.wm.save_as_mainfile(filepath=blend_path)
          bpy.ops.export_scene.gltf(filepath=glb_path, export_format="GLB")

          print("OBJECT_COUNT=", len(objects))
          print("BLEND_OUTPUT=", blend_path)
          print("GLB_OUTPUT=", glb_path)
          PY

      - name: Converter GLB para projeto Blender editável
        run: |
          set -euo pipefail
          blender --background --python converter_glb.py 2>&1 | tee blender-build.log

      - name: Validar ficheiros gerados
        run: |
          set -euo pipefail
          test -s saida_blender/A_Ultima_Expedicao_Kit_3D.blend
          test -s saida_blender/A_Ultima_Expedicao_Kit_3D.glb
          ls -lh saida_blender/
          echo "PASS: os dois ficheiros existem e não estão vazios; a qualidade visual ainda requer inspeção."

      - name: Preparar pacote de resultados e logs
        if: always()
        run: |
          mkdir -p entrega
          cp blender-version.log entrega/ 2>/dev/null || true
          cp numpy-check.log entrega/ 2>/dev/null || true
          cp zip-integrity.log entrega/ 2>/dev/null || true
          cp zip-files.txt entrega/ 2>/dev/null || true
          cp blender-build.log entrega/ 2>/dev/null || true
          cp -r saida_blender entrega/ 2>/dev/null || true
          zip -qr A_Ultima_Expedicao_Blender_Resultados.zip entrega

      - name: Publicar resultados e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-Blender-Resultados
          path: A_Ultima_Expedicao_Blender_Resultados.zip
          if-no-files-found: warn
          retention-days: 14
