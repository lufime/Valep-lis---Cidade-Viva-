name: A Última Expedição — Godot Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'A-Ultima-Expedicao-Godot-*.zip'
      - '.github/workflows/ultima-expedicao-godot-android-1.yml'

permissions:
  contents: read

concurrency:
  group: ultima-expedicao-godot-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.5-stable'
  APK_NAME: 'A-Ultima-Expedicao-Godot-v0.1.20-debug.apk'

jobs:
  build:
    name: Validar projeto e exportar APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar utilitários
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip xvfb file

      - name: Encontrar e extrair o projeto Godot
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \
              -name 'A-Ultima-Expedicao-Godot-*.zip' -print | sort
          )

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::É necessário exatamente um ZIP A-Ultima-Expedicao-Godot-*.zip na raiz. Encontrados: ${#ZIPS[@]}"
            printf '%s\n' "${ZIPS[@]:-nenhum}"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/godot-project" "$RUNNER_TEMP/artifacts/logs"
          echo "PROJECT_ZIP=${ZIPS[0]}" >> "$GITHUB_ENV"
          unzip -q "${ZIPS[0]}" -d "$RUNNER_TEMP/godot-project"

          mapfile -t PROJECTS < <(
            find "$RUNNER_TEMP/godot-project" -type f \
              -name project.godot -not -path '*/.godot/*' -printf '%h\n'
          )

          if [ "${#PROJECTS[@]}" -ne 1 ]; then
            echo "::error::Esperava exatamente um project.godot; encontrados: ${#PROJECTS[@]}"
            find "$RUNNER_TEMP/godot-project" -name project.godot -print
            exit 1
          fi

          PROJECT_DIR="${PROJECTS[0]}"
          test -s "$PROJECT_DIR/project.godot"
          test -s "$PROJECT_DIR/export_presets.cfg"
          grep -q 'platform="Android"' "$PROJECT_DIR/export_presets.cfg" || {
            echo "::error::Não foi encontrado um preset Android em export_presets.cfg"
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"
          {
            echo "ZIP: ${ZIPS[0]}"
            echo "PROJECT_DIR: $PROJECT_DIR"
            echo "project.godot:"
            sed -n '1,100p' "$PROJECT_DIR/project.godot"
            echo
            echo "Presets de exportação:"
            grep -nE '^\[preset|name=|platform=|runnable=|export_path=' "$PROJECT_DIR/export_presets.cfg" || true
          } > "$RUNNER_TEMP/artifacts/logs/project-info.txt"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado em $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$SDK_ROOT/platforms/android-34"
          test -d "$SDK_ROOT/build-tools/34.0.0"
          {
            echo "SDK_ROOT=$SDK_ROOT"
            "$SDKMANAGER" --list_installed
          } > "$RUNNER_TEMP/artifacts/logs/android-sdk.txt" 2>&1

      - name: Instalar Godot 4.5 e templates oficiais
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/artifacts/logs"

          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -oq "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"

          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f \
            -name 'Godot_v*_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version | tee "$RUNNER_TEMP/artifacts/logs/godot-version.txt"

          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" \
            -o "$RUNNER_TEMP/godot/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot/templates"
          unzip -oq "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"

          TEMPLATE_SOURCE="$(find "$RUNNER_TEMP/godot/templates" -type f \
            -name android_debug.apk -printf '%h\n' -quit)"
          if [ -z "$TEMPLATE_SOURCE" ]; then
            echo "::error::Template Android oficial não encontrado no pacote Godot."
            find "$RUNNER_TEMP/godot/templates" -maxdepth 5 -type f -print \
              > "$RUNNER_TEMP/artifacts/logs/templates-found.txt" || true
            exit 1
          fi

          test -s "$TEMPLATE_SOURCE/android_release.apk" || {
            echo "::error::android_release.apk não existe junto do template debug"
            exit 1
          }

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$TEMPLATE_SOURCE"/. "$TEMPLATE_DIR"/
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          echo "Templates Android instalados em $TEMPLATE_DIR"

      - name: Configurar caminhos Android no Godot
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF_SETTINGS

      - name: Importar recursos e guardar log
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --import \
            2>&1 | tee "$RUNNER_TEMP/artifacts/logs/import.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::error::A importação de recursos falhou (código $result)."
            exit "$result"
          fi

      - name: Validar arranque headless
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          timeout 120 "$GODOT_BIN" --headless --path "$PROJECT_DIR" --quit-after 5 \
            2>&1 | tee "$RUNNER_TEMP/artifacts/logs/startup-headless.log"
          result=${PIPESTATUS[0]}
          set -e

          if [ "$result" -ne 0 ]; then
            echo "::error::O teste de arranque falhou ou excedeu 120 segundos (código $result)."
            exit "$result"
          fi

          # Falhar apenas perante erros de script/carregamento que indiquem
          # que o projeto não consegue executar. Não tratar avisos de limpeza
          # no encerramento (ObjectDB/resources still in use) como erro fatal.
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Parse error' \
            "$RUNNER_TEMP/artifacts/logs/startup-headless.log"; then
            echo "::error::O log de arranque contém erros de script ou de parsing."
            exit 1
          fi

          # Registar mensagens de limpeza para análise, sem falhar só por elas.
          if grep -Eiq 'ObjectDB instances leaked|resources still in use at exit' \
            "$RUNNER_TEMP/artifacts/logs/startup-headless.log"; then
            echo "::warning::O Godot reportou recursos ainda em uso ao terminar o teste headless; ver startup-headless.log."
          fi

      - name: Verificar cena principal e recursos referenciados
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN_SCENE="$(sed -n 's/^run\/main_scene="\(.*\)"/\1/p' "$PROJECT_DIR/project.godot" | head -n1)"
          if [ -z "$MAIN_SCENE" ]; then
            echo "::error::Não foi possível determinar run/main_scene em project.godot"
            exit 1
          fi

          if [[ "$MAIN_SCENE" != res://* ]]; then
            echo "::error::A cena principal não usa um caminho res:// válido: $MAIN_SCENE"
            exit 1
          fi

          MAIN_FILE="$PROJECT_DIR/${MAIN_SCENE#res://}"
          if [ ! -s "$MAIN_FILE" ]; then
            echo "::error::A cena principal não existe: $MAIN_SCENE"
            exit 1
          fi

          echo "Cena principal encontrada: $MAIN_SCENE" \
            | tee "$RUNNER_TEMP/artifacts/logs/main-scene-check.txt"

      - name: Exportar APK Android de depuração
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts"

          set +e
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" \
            --export-debug 'Android' "$RUNNER_TEMP/artifacts/$APK_NAME" \
            2>&1 | tee "$RUNNER_TEMP/artifacts/logs/android-export.log"
          result=${PIPESTATUS[0]}
          set -e

          if [ "$result" -ne 0 ]; then
            echo "::error::A exportação do APK falhou (código $result)."
            exit "$result"
          fi

          if [ ! -s "$RUNNER_TEMP/artifacts/$APK_NAME" ]; then
            echo "::error::O Godot terminou sem criar um APK válido."
            exit 1
          fi

          file "$RUNNER_TEMP/artifacts/$APK_NAME" \
            | tee "$RUNNER_TEMP/artifacts/logs/apk-file-info.txt"
          sha256sum "$RUNNER_TEMP/artifacts/$APK_NAME" \
            > "$RUNNER_TEMP/artifacts/SHA256SUMS.txt"

      - name: Resumo do resultado
        if: always()
        shell: bash
        run: |
          {
            echo "# A Última Expedição — relatório de build"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Workflow: \`${GITHUB_WORKFLOW}\`"
            echo "- Godot pretendido: \`${GODOT_VERSION}\`"
            echo "- APK esperado: \`${APK_NAME}\`"
            echo
            if [ -s "$RUNNER_TEMP/artifacts/$APK_NAME" ]; then
              echo "## Resultado: APK criado"
              echo
              echo "- Tamanho: $(stat -c '%s bytes' "$RUNNER_TEMP/artifacts/$APK_NAME")"
              echo "- SHA-256:"
              sha256sum "$RUNNER_TEMP/artifacts/$APK_NAME"
            else
              echo "## Resultado: APK não criado"
              echo
              echo "Consultar os logs anexados para identificar a etapa que falhou."
            fi
          } > "$RUNNER_TEMP/artifacts/RELATORIO-BUILD.md"

      - name: Publicar APK e logs de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-Godot-Android-${{ github.run_number }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: warn
          retention-days: 14
