name: A Última Expedição — Gerar BLEND a partir do ZIP

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Caminho do ZIP no repositório; vazio = procurar automaticamente'
        required: false
        type: string
        default: ''
  push:
    paths:
      - '.github/workflows/blender-from-project-zip.yml'
      - 'assets/**'
      - '*.zip'
      - '**/*.zip'

permissions:
  contents: read

concurrency:
  group: blender-from-project-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-blend:
    name: Validar ZIP e gerar ficheiros Blender
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Instalar Blender e ferramentas ZIP
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender unzip zip
          blender --background --version | tee blender-version.log

      - name: Encontrar, validar e extrair ZIP
        env:
          INPUT_ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          ZIP_PATH="${INPUT_ZIP_PATH:-}"
          if [ -z "$ZIP_PATH" ]; then
            ZIP_PATH="$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' -print | sort | head -n 1 || true)"
          fi
          if [ -z "$ZIP_PATH" ] || [ ! -f "$ZIP_PATH" ]; then
            echo '::error::Não foi encontrado um ZIP. Coloca o ZIP da fonte na raiz ou em assets/, faz commit e volta a executar.'
            echo 'ZIPs encontrados:'
            find . -maxdepth 5 -type f -iname '*.zip' -not -path './.git/*' -print | sort || true
            exit 1
          fi
          echo "ZIP_PATH=$ZIP_PATH" | tee zip-selected.log
          unzip -t "$ZIP_PATH" | tee zip-integrity.log
          mkdir -p entrada_zip
          unzip -q "$ZIP_PATH" -d entrada_zip
          find entrada_zip -type f -print | sort | tee zip-files.txt
          GLB_PATH="$(find entrada_zip -type f -name 'station_corridor_kit.glb' -print -quit)"
          if [ -z "$GLB_PATH" ]; then
            GLB_PATH="$(find entrada_zip -type f -iname '*.glb' -print -quit)"
          fi
          if [ -z "$GLB_PATH" ]; then
            echo '::error::O ZIP foi extraído, mas não contém qualquer ficheiro .glb para importar.'
            exit 1
          fi
          echo "GLB_PATH=$GLB_PATH" >> "$GITHUB_ENV"
          echo "GLB encontrado: $GLB_PATH"

      - name: Criar script de conversão GLB para BLEND
        run: |
          cat > converter_glb.py <<'PY'
          import bpy, os
          source = os.path.abspath(os.environ['GLB_PATH'])
          outdir = os.path.abspath('saida_blender')
          os.makedirs(outdir, exist_ok=True)
          if not os.path.isfile(source):
              raise FileNotFoundError('GLB de origem não encontrado: ' + source)
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.gltf(filepath=source)
          if not bpy.context.scene.objects:
              raise RuntimeError('A importação não criou objetos Blender.')
          blend_path = os.path.join(outdir, 'A_Ultima_Expedicao_Kit_3D.blend')
          glb_path = os.path.join(outdir, 'A_Ultima_Expedicao_Kit_3D.glb')
          object_count = len(bpy.context.scene.objects)
          bpy.ops.wm.save_as_mainfile(filepath=blend_path)
          bpy.ops.export_scene.gltf(filepath=glb_path, export_format='GLB')
          print('OBJECT_COUNT=', object_count)
          print('BLEND_OUTPUT=', blend_path)
          print('GLB_OUTPUT=', glb_path)
          PY

      - name: Converter GLB para projeto Blender editável
        env:
          GLB_PATH: ${{ env.GLB_PATH }}
        run: |
          set -euo pipefail
          blender --background --python converter_glb.py 2>&1 | tee blender-build.log

      - name: Validar ficheiros de saída
        run: |
          set -euo pipefail
          test -s saida_blender/A_Ultima_Expedicao_Kit_3D.blend
          test -s saida_blender/A_Ultima_Expedicao_Kit_3D.glb
          ls -lh saida_blender/
          echo 'PASS: ficheiros presentes e não vazios; inspeção visual não executada.'

      - name: Preparar resultados e logs
        if: always()
        run: |
          mkdir -p entrega
          cp blender-version.log zip-selected.log zip-integrity.log zip-files.txt blender-build.log entrega/ 2>/dev/null || true
          cp -r saida_blender entrega/ 2>/dev/null || true
          zip -qr A_Ultima_Expedicao_Blender_Resultados.zip entrega || true

      - name: Publicar resultados e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-Blender-Resultados
          path: |
            A_Ultima_Expedicao_Blender_Resultados.zip
            blender-version.log
            zip-selected.log
            zip-integrity.log
            zip-files.txt
            blender-build.log
          if-no-files-found: warn
          retention-days: 14
