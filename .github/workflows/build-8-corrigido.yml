name: A Última Expedição v0.4.0 — Nearby e APK Android

on:
  workflow_dispatch:
  push:
    # Permite iniciar em qualquer branch; não fica limitado a main/master.
    branches:
      - '**'
    # Sem filtro paths: qualquer commit inicia o workflow, incluindo alterações
    # ao próprio workflow e ao ZIP do jogo.

permissions:
  contents: read

concurrency:
  group: ultima-expedicao-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Descompactar projeto e compilar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Localizar e descompactar ZIP do jogo
        shell: bash
        run: |
          set -Eeuo pipefail
          EXTRACT_ROOT="$RUNNER_TEMP/ultima-expedicao"
          PROBE_ROOT="$RUNNER_TEMP/zip-probe"
          mkdir -p "$EXTRACT_ROOT"

          ZIP_PATH=""
          # Procura qualquer versão do ZIP do jogo, sem ficar preso à v0.1.0.
          while IFS= read -r -d '' candidate; do
            [[ "$candidate" == *"/.git/"* ]] && continue
            if ! unzip -tq "$candidate" >/dev/null 2>&1; then
              continue
            fi

            rm -rf "$PROBE_ROOT"
            mkdir -p "$PROBE_ROOT"
            if ! unzip -oq "$candidate" -d "$PROBE_ROOT"; then
              continue
            fi

            # Não usar apenas o primeiro package.json: plugins internos também têm um.
            while IFS= read -r -d '' package_file; do
              candidate_dir="$(dirname "$package_file")"
              if [[ -s "$candidate_dir/capacitor.config.json" && -s "$candidate_dir/www/index.html" ]]; then
                ZIP_PATH="$candidate"
                PROJECT_REL="${candidate_dir#"$PROBE_ROOT"/}"
                break
              fi
            done < <(find "$PROBE_ROOT" -type f -name package.json -print0)

            [[ -n "$ZIP_PATH" ]] && break
          done < <(find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print0)

          if [[ -z "$ZIP_PATH" ]]; then
            echo "::error::Não encontrei um ZIP válido com package.json, capacitor.config.json e www/index.html."
            echo "ZIPs encontrados no repositório:"
            find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print || true
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_PATH"
          unzip -tq "$ZIP_PATH"
          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"
          unzip -oq "$ZIP_PATH" -d "$EXTRACT_ROOT"

          # Reencontrar a raiz real do projeto no ZIP extraído; ignora package.json de plugins.
          PROJECT_DIR=""
          while IFS= read -r -d '' package_file; do
            candidate_dir="$(dirname "$package_file")"
            if [[ -s "$candidate_dir/capacitor.config.json" && -s "$candidate_dir/www/index.html" ]]; then
              PROJECT_DIR="$candidate_dir"
              break
            fi
          done < <(find "$EXTRACT_ROOT" -type f -name package.json -print0)

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::O ZIP foi extraído, mas não foi possível identificar a raiz do projeto Capacitor."
            find "$EXTRACT_ROOT" -maxdepth 5 -type f \( -name package.json -o -name capacitor.config.json -o -path '*/www/index.html' \) -print
            exit 1
          fi

          for required in package.json capacitor.config.json www/index.html; do
            if [[ ! -s "$PROJECT_DIR/$required" ]]; then
              echo "::error::Falta o ficheiro obrigatório $required."
              exit 1
            fi
          done

          GAME_VERSION="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$PROJECT_DIR/package.json" 2>/dev/null || true)"
          if [[ -z "$GAME_VERSION" ]]; then
            echo "::error::Não foi possível ler a versão do package.json."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "GAME_VERSION=$GAME_VERSION" >> "$GITHUB_ENV"
          echo "Projeto descompactado em: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar pacotes Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager --list_installed || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Validar projeto e instalar dependências
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          node --version
          npm --version
          node -e "const p=require('./package.json'); if(!p.dependencies?.['@capacitor/core'] || !p.dependencies?.['@capacitor/android'] || !p.devDependencies?.['@capacitor/cli']) { console.error('Dependências Capacitor incompletas em package.json'); process.exit(1); } console.log('Projeto:', p.name, p.version)"
          node -e "const c=require('./capacitor.config.json'); if(!c.appId || !c.appName || c.webDir !== 'www') { console.error('capacitor.config.json inválido: requer appId, appName e webDir=www'); process.exit(1); } console.log('Capacitor:', c.appId, '-', c.appName)"
          npm install --no-audit --no-fund
          npm run build

      - name: Criar projeto Android
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Sincronizar recursos
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Compilar APK de depuração
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$RUNNER_TEMP/ultima-expedicao-artifacts"
          cp "$APK" "$RUNNER_TEMP/ultima-expedicao-artifacts/A-Ultima-Expedicao-Android-v${GAME_VERSION}-debug.apk"
          ls -lh "$RUNNER_TEMP/ultima-expedicao-artifacts/A-Ultima-Expedicao-Android-v${GAME_VERSION}-debug.apk"

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-Android-debug
          path: ${{ runner.temp }}/ultima-expedicao-artifacts/A-Ultima-Expedicao-Android-v*-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Guardar diagnóstico se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-diagnostico
          path: |
            ${{ runner.temp }}/ultima-expedicao/
            ${{ runner.temp }}/zip-probe/
          if-no-files-found: ignore
          retention-days: 7

      - name: Resumo
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## A Última Expedição v0.4.0 - resultado"
            echo ""
            echo "- Estado: **$JOB_STATUS**"
            echo "- O workflow procura e descompacta o ZIP antes da compilação."
            if [[ "$JOB_STATUS" == "success" && -s "$RUNNER_TEMP/ultima-expedicao-artifacts/A-Ultima-Expedicao-Android-v${GAME_VERSION}-debug.apk" ]]; then
              echo "- APK gerada e verificada como ficheiro não vazio."
            else
              echo "- APK não confirmada; consultar a etapa que falhou."
            fi
            echo "- A compilação não substitui o teste de instalação num telemóvel."
          } >> "$GITHUB_STEP_SUMMARY"
