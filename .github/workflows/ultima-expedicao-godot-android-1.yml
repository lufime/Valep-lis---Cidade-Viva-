name: A Última Expedição — Godot Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'A-Ultima-Expedicao-Godot-*.zip'
      - '.github/workflows/ultima-expedicao-godot-android.yml'

permissions:
  contents: read

concurrency:
  group: ultima-expedicao-godot-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.5-stable'
  APK_NAME: 'A-Ultima-Expedicao-Godot-v0.1.8-debug.apk'

jobs:
  build:
    name: Validar projeto Godot e exportar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Encontrar e extrair ZIP do projeto Godot
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t ZIPS < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'A-Ultima-Expedicao-Godot-*.zip' -print)
          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::É necessário exatamente um ZIP A-Ultima-Expedicao-Godot-*.zip na raiz. Encontrados: ${#ZIPS[@]}"
            printf '%s\n' "${ZIPS[@]:-nenhum}"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/godot-project"
          unzip -q "${ZIPS[0]}" -d "$RUNNER_TEMP/godot-project"
          mapfile -t PROJECTS < <(find "$RUNNER_TEMP/godot-project" -type f -name project.godot -not -path '*/.godot/*' -printf '%h\n')
          if [ "${#PROJECTS[@]}" -ne 1 ]; then
            echo "::error::Esperava um único project.godot dentro do ZIP; encontrados: ${#PROJECTS[@]}"
            find "$RUNNER_TEMP/godot-project" -name project.godot -print
            exit 1
          fi
          PROJECT_DIR="${PROJECTS[0]}"
          test -s "$PROJECT_DIR/export_presets.cfg"
          grep -q 'platform="Android"' "$PROJECT_DIR/export_presets.cfg" || { echo "::error::Falta preset Android em export_presets.cfg"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto Godot encontrado: $PROJECT_DIR"

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          # O pacote legado "tools" já não existe nos repositórios atuais do Android SDK.
          packages: 'platform-tools;platforms;android-35;build-tools;35.0.0'

      - name: Instalar ferramentas e Godot 4.5
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip xvfb
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -oq "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o "$RUNNER_TEMP/godot/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot/templates"
          unzip -oq "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          TEMPLATE_SOURCE="$(find "$RUNNER_TEMP/godot/templates" -type f -name android_debug.apk -printf '%h\n' -quit)"
          test -n "$TEMPLATE_SOURCE" || { echo "::error::Template Android oficial não encontrado"; exit 1; }
          cp -a "$TEMPLATE_SOURCE"/. "$TEMPLATE_DIR"/
          "$GODOT_BIN" --version

      - name: Configurar caminhos Android no Godot
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF_SETTINGS

      - name: Importar recursos
        shell: bash
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --import

      - name: Teste de arranque
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 120 "$GODOT_BIN" --headless --path "$PROJECT_DIR" --quit-after 5

      - name: Exportar APK Android de depuração
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts"
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" --export-debug 'Android' "$RUNNER_TEMP/artifacts/$APK_NAME"
          test -s "$RUNNER_TEMP/artifacts/$APK_NAME"
          sha256sum "$RUNNER_TEMP/artifacts/$APK_NAME" > "$RUNNER_TEMP/artifacts/SHA256SUMS.txt"

      - name: Publicar APK e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-Godot-Android
          path: ${{ runner.temp }}/artifacts/**
          if-no-files-found: warn
          retention-days: 14
