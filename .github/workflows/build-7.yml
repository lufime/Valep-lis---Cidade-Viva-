name: Valepólis V0.3.0 — DEM, PRE-FLIGHT 3D e APK DEBUG

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: 'Caminho do ZIP completo do projeto dentro do repositório (opcional se o projeto estiver extraído)'
        required: false
        default: ''
        type: string
      dem_tile:
        description: 'Tile Copernicus DEM de referência do relevo de Setúbal'
        required: true
        default: 'N38_00_W009_00'
        type: string
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: valepolis-v030-integrado-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight-dem-debug:
    name: Validar dados, integrar DEM, executar PRE-FLIGHT e compilar DEBUG
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3 unzip
          gdalinfo --version

      - name: Localizar projeto Android na raiz, subpastas ou ZIPs do repositório
        id: project
        shell: bash
        env:
          REQUESTED_ZIP: ${{ inputs.project_zip }}
        run: |
          set -euo pipefail
          extract="$RUNNER_TEMP/valepolis-extract"
          mkdir -p "$extract"
          find_project() {
            local base="$1" f d
            while IFS= read -r f; do
              d="$(dirname "$f")"
              if [[ -f "$d/app/build.gradle.kts" || -f "$d/app/build.gradle" ]]; then
                printf '%s\n' "$d"
                return 0
              fi
            done < <(find "$base" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.git/*' -not -path '*/.gradle/*' -print | sort)
            return 1
          }
          found="$(find_project . || true)"
          if [[ -z "$found" && -n "$REQUESTED_ZIP" ]]; then
            if [[ ! -f "$REQUESTED_ZIP" ]]; then
              echo "::error::O ZIP indicado não existe no repositório: $REQUESTED_ZIP"
              echo 'Adiciona o ZIP completo ao repositório ou deixa o projeto Android extraído na raiz/subpasta.'
              exit 1
            fi
            dest="$extract/selected"
            mkdir -p "$dest"
            unzip -oq "$REQUESTED_ZIP" -d "$dest"
            found="$(find_project "$dest" || true)"
          fi
          if [[ -z "$found" ]]; then
            while IFS= read -r z; do
              dest="$extract/$(basename "$z" .zip)"
              mkdir -p "$dest"
              unzip -oq "$z" -d "$dest" || continue
              found="$(find_project "$dest" || true)"
              [[ -n "$found" ]] && break
            done < <(find . -type f -iname '*.zip' -not -path './.git/*' -print | sort)
          fi
          if [[ -z "$found" ]]; then
            echo '::error::O checkout do GitHub não contém o projeto Android nem um ZIP do projeto.'
            echo 'O ZIP anexado à conversa não fica automaticamente disponível no runner do GitHub Actions.'
            echo 'Adiciona o ZIP completo ao repositório (por exemplo na raiz) ou envia os ficheiros do projeto para o repositório.'
            echo 'Ficheiros Gradle encontrados no checkout:'
            find . -type f \( -name settings.gradle.kts -o -name settings.gradle -o -name build.gradle.kts -o -name build.gradle \) -not -path './.git/*' -print | head -100
            exit 1
          fi
          echo "dir=$found" >> "$GITHUB_OUTPUT"
          echo "Projeto Android selecionado: $found"

      - name: Validar estrutura e dados dos 25 bairros
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import json
          from pathlib import Path
          assets = Path('app/src/main/assets')
          def load(name):
              matches = list(assets.rglob(name)) if assets.exists() else []
              if not matches:
                  raise SystemExit(f'FAIL | Recurso obrigatório em falta: {name}')
              try:
                  return json.loads(matches[0].read_text(encoding='utf-8'))
              except Exception as e:
                  raise SystemExit(f'FAIL | JSON inválido {name}: {e}')
          b = load('bairros_valepolis.json')
          if not isinstance(b, dict) or b.get('city') != 'Valepólis' or b.get('neighborhood_count') != 25:
              raise SystemExit('FAIL | Metadados de Valepólis/25 bairros inválidos')
          ns = b.get('neighborhoods')
          if not isinstance(ns, list) or len(ns) != 25 or not all(isinstance(x, dict) for x in ns):
              raise SystemExit('FAIL | Esperados exatamente 25 bairros válidos')
          ids = [x.get('id') for x in ns]
          names = [x.get('name') for x in ns]
          if not all(ids) or len(set(ids)) != 25 or not all(isinstance(n, str) and n.strip() for n in names) or len(set(names)) != 25:
              raise SystemExit('FAIL | IDs/nomes dos bairros em falta ou duplicados')
          lim = load('limites_bairros_v030.json')
          geoms = lim.get('neighborhoods') if isinstance(lim, dict) else None
          if lim.get('neighborhood_count') != 25 or not isinstance(geoms, list) or len(geoms) != 25:
              raise SystemExit('FAIL | Limites territoriais: não existem 25 geometrias')
          try:
              load('populacao_valepolis.json')
          except SystemExit:
              load('population_simulation_v030.json')
          load('episodes_200.json')
          print('PASS | 25 bairros com IDs e nomes únicos')
          print('PASS | 25 geometrias territoriais')
          print('PASS | JSON de população e 200 episódios válidos')
          PY

      - name: Validar e descarregar tile Copernicus DEM
        env:
          DEM_TILE: ${{ inputs.dem_tile || 'N38_00_W009_00' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DEM_TILE" =~ ^[NS][0-8][0-9]_00_[WE][0-1][0-9][0-9]_00$ ]]; then
            echo "::error::Formato de tile inválido: $DEM_TILE"
            exit 1
          fi
          name="Copernicus_DSM_COG_30_${DEM_TILE}_DEM"
          url="https://copernicus-dem-90m.s3.eu-central-1.amazonaws.com/${name}/${name}.tif"
          echo "Fonte DEM: $url"
          curl --fail --show-error --location --retry 4 --retry-all-errors --connect-timeout 20 "$url" -o "$RUNNER_TEMP/copernicus_dem.tif"
          test -s "$RUNNER_TEMP/copernicus_dem.tif"
          gdalinfo "$RUNNER_TEMP/copernicus_dem.tif" > "$RUNNER_TEMP/dem-gdalinfo.txt"
          sed -n '1,40p' "$RUNNER_TEMP/dem-gdalinfo.txt"
          if [[ "$DEM_TILE" == 'N38_00_W009_00' ]]; then
            python3 - "$RUNNER_TEMP/dem-gdalinfo.txt" <<'PYDEM'
          import re, sys
          from pathlib import Path
          info = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          m = re.search(r'Origin = \(([-+0-9.eE]+),\s*([-+0-9.eE]+)\)', info)
          if not m:
              raise SystemExit('FAIL | Não foi possível ler a origem do raster DEM')
          x, y = map(float, m.groups())
          # GeoTIFF pode reportar o centro do primeiro pixel, cerca de meio pixel
          # para dentro do tile; validar a coordenada dentro de uma tolerância.
          if abs(x - (-9.0)) > 0.001 or abs(y - 39.0) > 0.001:
              raise SystemExit(f'FAIL | Origem fora do tile N38/W009: x={x}, y={y}')
          print(f'PASS | Tile N38/W009 confirmado por coordenadas: x={x}, y={y}')
          PYDEM
          fi

      - name: Converter e validar DEM offline 129x129
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/app/src/main/assets/data"
          gdal_translate -q -of AAIGrid -outsize 129 129 -a_nodata -9999 \
            "$RUNNER_TEMP/copernicus_dem.tif" \
            "$PROJECT_DIR/app/src/main/assets/data/terrain_reference_dem.asc"
          export PROJECT_DIR
          python3 - <<'PY'
          import math, os
          from pathlib import Path
          p = Path(os.environ['PROJECT_DIR']) / 'app/src/main/assets/data/terrain_reference_dem.asc'
          lines = p.read_text(encoding='utf-8').splitlines()
          if len(lines) < 135:
              raise SystemExit(f'FAIL | DEM demasiado curto: {len(lines)} linhas')
          header = {}
          for line in lines[:6]:
              parts = line.split()
              if len(parts) != 2:
                  raise SystemExit(f'FAIL | Cabeçalho AAIGrid inválido: {line}')
              header[parts[0].lower()] = parts[1]
          if int(header.get('ncols', 0)) != 129 or int(header.get('nrows', 0)) != 129:
              raise SystemExit(f'FAIL | Dimensões inesperadas: {header}')
          rows = lines[6:]
          if len(rows) != 129:
              raise SystemExit(f'FAIL | Esperadas 129 linhas de dados, encontradas {len(rows)}')
          values = []
          for i, row in enumerate(rows):
              cells = [float(v) for v in row.split()]
              if len(cells) != 129:
                  raise SystemExit(f'FAIL | Linha {i}: esperadas 129 colunas, encontradas {len(cells)}')
              values.extend(cells)
          nodata = float(header.get('nodata_value', '-9999'))
          valid = [v for v in values if math.isfinite(v) and v > nodata + 0.001]
          if not valid or max(valid) - min(valid) <= 0.1:
              raise SystemExit('FAIL | DEM sem variação de altitude válida')
          print(f'PASS | DEM 129x129; altitude {min(valid):.2f}–{max(valid):.2f} m; {p.stat().st_size} bytes')
          PY

      - name: Verificar que o código Android referencia o DEM
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          src="$PROJECT_DIR/app/src/main"
          if ! grep -Rqs --include='*.kt' --include='*.java' 'terrain_reference_dem.asc' "$src"; then
            echo '::error::O código Android não referencia terrain_reference_dem.asc; não é possível afirmar que o jogo o carrega.'
            exit 1
          fi
          echo 'PASS | Referência estática ao recurso DEM encontrada.'
          echo 'NOTA | Isto não comprova renderização 3D real no dispositivo.'

      - name: PRE-FLIGHT do gate 3D — estado explícito sem falsos aprovados
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          export PROJECT_DIR
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['PROJECT_DIR'])
          p = root / 'quality_gate_3d.json'
          status = 'BLOCKED'
          reason = 'Falta quality_gate_3d.json; não existe evidência documental de aprovação.'
          if p.is_file():
              try:
                  d = json.loads(p.read_text(encoding='utf-8'))
                  criteria = d.get('criteria', {})
                  evidence = d.get('evidence', {})
                  required = ('device_model', 'android_version', 'screenshots', 'validation_notes')
                  if (d.get('approved') is True and d.get('status') == 'APPROVED'
                      and criteria and all(v is True for v in criteria.values())
                      and all(evidence.get(k) for k in required)):
                      status = 'DOCUMENTED_APPROVAL_REQUIRES_HUMAN_REVIEW'
                      reason = 'O ficheiro declara aprovação e evidências; a execução automatizada não confirma visualmente o 3D no telemóvel.'
                  else:
                      reason = 'Gate 3D incompleto ou não aprovado; APK DEBUG pode ser criada apenas para diagnóstico.'
              except Exception as e:
                  reason = f'quality_gate_3d.json inválido: {e}'
          report = {
              'project_version': 'V0.3.0',
              'dem_asset_generated': (root / 'app/src/main/assets/data/terrain_reference_dem.asc').is_file(),
              'three_d_release_gate': status,
              'release_allowed': False,
              'reason': reason,
              'note': 'Não se declara o mapa 3D aprovado sem validação visual real em Android.'
          }
          out = Path(os.environ['GITHUB_WORKSPACE']) / 'output' / 'PRE-FLIGHT-RESULT.json'
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'{status} | {reason}')
          print('APK DEBUG é apenas para diagnóstico; APK RELEASE permanece bloqueada.')
          PY

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Usar Android SDK pré-instalado no runner
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager não encontrado no SDK pré-instalado: $ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses < <(yes) || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          "$ANDROID_HOME/platform-tools/adb" version
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK DEBUG
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace clean :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-debug.log"
          else
            gradle --no-daemon --stacktrace clean :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-debug.log"
          fi
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          cp "$apk" "$GITHUB_WORKSPACE/output/Valepolis-V0.3.0-DEBUG-DEM.apk"
          cp app/src/main/assets/data/terrain_reference_dem.asc "$GITHUB_WORKSPACE/output/"
          cp "$RUNNER_TEMP/dem-gdalinfo.txt" "$GITHUB_WORKSPACE/output/"
          sha256sum "$GITHUB_WORKSPACE/output/Valepolis-V0.3.0-DEBUG-DEM.apk" > "$GITHUB_WORKSPACE/output/SHA256.txt"

      - name: Publicar APK e relatório PRE-FLIGHT
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-DEM-PREFLIGHT-DEBUG-NAO-RELEASE
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: Publicar logs em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-DEM-PREFLIGHT-LOGS
          path: |
            build-debug.log
            ${{ runner.temp }}/dem-gdalinfo.txt
            ${{ runner.temp }}/copernicus_dem.tif
          if-no-files-found: ignore
          retention-days: 7
