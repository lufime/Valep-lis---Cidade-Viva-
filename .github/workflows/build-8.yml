name: A Última Expedição — Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: ultima-expedicao-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Validar projeto e compilar APK de depuração
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Validar ficheiros do projeto
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s package.json || { echo '::error::Falta package.json na raiz do repositório.'; exit 1; }
          test -s capacitor.config.json || { echo '::error::Falta capacitor.config.json na raiz do repositório.'; exit 1; }
          test -s www/index.html || { echo '::error::Falta www/index.html; não existem os recursos web do jogo.'; exit 1; }
          node --version || true
          echo 'Ficheiros essenciais encontrados.'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências npm
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund

      - name: Validar configuração Capacitor
        shell: bash
        run: |
          set -Eeuo pipefail
          npx cap --version
          node -e "const c=require('./capacitor.config.json'); if(!c.appId || !c.appName || c.webDir !== 'www') process.exit(1); console.log('Capacitor:', c.appId, '-', c.appName)"

      - name: Gerar projeto Android
        shell: bash
        run: npx cap add android

      - name: Sincronizar recursos do jogo
        shell: bash
        run: npx cap sync android

      - name: Compilar APK de depuração
        shell: bash
        working-directory: android
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK Android
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Guardar logs de diagnóstico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-build-logs
          path: |
            npm-debug.log
            android/*.log
            android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
