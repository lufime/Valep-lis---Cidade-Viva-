name: Valepólis V0.3.0 — Gerar APK DEBUG (release bloqueada)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  debug-apk:
    name: Construir APK DEBUG
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        name: Obter repositório

      - name: Encontrar projeto Android
        id: project
        shell: bash
        run: |
          set -euo pipefail
          found=""
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if [[ -f "$d/app/build.gradle.kts" || -f "$d/app/build.gradle" ]]; then found="$d"; break; fi
          done < <(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' -print)
          if [[ -z "$found" ]]; then
            while IFS= read -r z; do
              dest="$RUNNER_TEMP/$(basename "$z" .zip)"
              mkdir -p "$dest"
              unzip -oq "$z" -d "$dest" || continue
              while IFS= read -r f; do
                d="$(dirname "$f")"
                if [[ -f "$d/app/build.gradle.kts" || -f "$d/app/build.gradle" ]]; then found="$d"; break 2; fi
              done < <(find "$dest" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.gradle/*' -print)
            done < <(find . -type f -iname '*.zip' -not -path './.git/*' -print | sort)
          fi
          if [[ -z "$found" ]]; then
            echo "::error::Projeto Android não encontrado."
            find . -maxdepth 4 -type f -not -path './.git/*' | sort
            exit 1
          fi
          echo "dir=$found" >> "$GITHUB_OUTPUT"
          echo "Projeto: $found"

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Não usar "packages: tools platform-tools": o pacote tools foi removido.
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android necessários
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construir APK DEBUG
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-debug.log"
          else
            gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-debug.log"
          fi
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/Valepolis-V0.3.0-DEBUG-VALIDACAO-3D-NAO-RELEASE.apk"
          sha256sum "$GITHUB_WORKSPACE/apk-output/"*.apk > "$GITHUB_WORKSPACE/apk-output/SHA256.txt"

      - name: Publicar APK DEBUG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-DEBUG-VALIDACAO-3D-NAO-RELEASE
          path: apk-output/*
          if-no-files-found: error
          retention-days: 7

      - name: Publicar log se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-ERRO-BUILD-DEBUG
          path: build-debug.log
          if-no-files-found: warn
          retention-days: 7

      - name: Manter APK RELEASE bloqueada
        if: always()
        run: echo "APK RELEASE BLOQUEADA até validação visual e técnica do mundo 3D."
