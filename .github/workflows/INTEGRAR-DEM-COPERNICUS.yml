name: Valepólis V0.3.0 — Integrar DEM Copernicus e validar APK

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: 'Caminho do ZIP Android no repositório (obrigatório se houver vários ZIPs válidos)'
        required: false
        type: string
  push:
    paths:
      - '.github/workflows/INTEGRAR-DEM-COPERNICUS.yml'
      - '*.zip'
      - '**/*.zip'
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: valepolis-dem-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dem-and-build:
    name: Obter DEM, preparar asset offline e validar
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DEM_TILE: N41_00_W008_00
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Instalar ferramentas geoespaciais
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3 unzip
          gdalinfo --version

      - name: Selecionar ZIP do projeto Android sem ambiguidade
        id: project
        shell: bash
        env:
          REQUESTED_ZIP: ${{ inputs.project_zip }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_ZIP:-}" ]]; then
            [[ -f "$REQUESTED_ZIP" ]] || { echo "::error::ZIP indicado não existe: $REQUESTED_ZIP"; exit 1; }
            unzip -Z1 "$REQUESTED_ZIP" | grep -qE '(^|/)app/src/main/java/.*/MainActivity\.kt$' || { echo '::error::O ZIP indicado não contém MainActivity.kt Android.'; exit 1; }
            found="$REQUESTED_ZIP"
          else
            mapfile -t candidates < <(
              while IFS= read -r z; do
                if unzip -Z1 "$z" 2>/dev/null | grep -qE '(^|/)app/src/main/java/.*/MainActivity\.kt$'; then printf '%s\n' "$z"; fi
              done < <(find . -type f -iname '*.zip' -not -path './.git/*' -print | sort)
            )
            if [[ "${#candidates[@]}" -ne 1 ]]; then
              echo "::error::Foram encontrados ${#candidates[@]} ZIPs Android válidos. Executa workflow_dispatch e indica o caminho exato em project_zip."
              printf 'Candidato: %s\n' "${candidates[@]:-nenhum}"
              exit 1
            fi
            found="${candidates[0]}"
          fi
          echo "zip=$found" >> "$GITHUB_OUTPUT"
          echo "ZIP selecionado: $found"

      - name: Extrair projeto e confirmar estrutura Android
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/valepolis-project"
          unzip -oq "${{ steps.project.outputs.zip }}" -d "$RUNNER_TEMP/valepolis-project"
          mapfile -t roots < <(
            while IFS= read -r settings; do
              candidate="$(dirname "$settings")"
              if [[ -f "$candidate/app/build.gradle.kts" || -f "$candidate/app/build.gradle" ]]; then printf '%s\n' "$candidate"; fi
            done < <(find "$RUNNER_TEMP/valepolis-project" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.gradle/*' -print)
          )
          if [[ "${#roots[@]}" -ne 1 ]]; then
            echo "::error::Esperava uma raiz Android, encontrei ${#roots[@]}."
            printf 'Raiz: %s\n' "${roots[@]:-nenhuma}"
            exit 1
          fi
          project="${roots[0]}"
          if ! grep -Rqs --include='*.kt' --include='*.java' 'terrain_reference_dem.asc' "$project/app/src/main/java"; then
            echo '::error::O código não referencia terrain_reference_dem.asc. Não vou incorporar um DEM sem evidência de carregador.'
            exit 1
          fi
          echo "dir=$project" >> "$GITHUB_OUTPUT"
          echo "Raiz Android: $project"

      - name: Descarregar tile Copernicus DEM
        shell: bash
        run: |
          set -euo pipefail
          name="Copernicus_DSM_COG_30_${DEM_TILE}_DEM"
          url="https://copernicus-dem-90m.s3.eu-central-1.amazonaws.com/${name}/${name}.tif"
          echo "Fonte DEM: $url"
          curl --fail --show-error --location --retry 4 --retry-all-errors --connect-timeout 20 "$url" -o "$RUNNER_TEMP/copernicus_dem.tif"
          test -s "$RUNNER_TEMP/copernicus_dem.tif"
          gdalinfo "$RUNNER_TEMP/copernicus_dem.tif" | tee "$RUNNER_TEMP/dem-gdalinfo.txt" | head -35

      - name: Converter DEM para grelha ASCII offline compacta
        env:
          PROJECT_DIR: ${{ steps.source.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/app/src/main/assets/data"
          gdal_translate -q -of AAIGrid -outsize 129 129 -a_nodata -9999 "$RUNNER_TEMP/copernicus_dem.tif" "$PROJECT_DIR/app/src/main/assets/data/terrain_reference_dem.asc"
          python3 - <<'PY'
          from pathlib import Path
          import os, math
          p = Path(os.environ['PROJECT_DIR']) / 'app/src/main/assets/data/terrain_reference_dem.asc'
          lines = p.read_text().splitlines()
          assert len(lines) >= 135, f'DEM demasiado curto: {len(lines)} linhas'
          header = {}
          for line in lines[:6]:
              parts = line.split()
              assert len(parts) == 2, f'Cabeçalho inválido: {line}'
              header[parts[0].lower()] = parts[1]
          assert int(header['ncols']) == 129 and int(header['nrows']) == 129, header
          data = lines[6:]
          assert len(data) == 129, f'Esperadas 129 linhas de dados, recebidas {len(data)}'
          values = []
          for row in data:
              nums = [float(x) for x in row.split()]
              assert len(nums) == 129, f'Linha com {len(nums)} colunas, esperadas 129'
              values.extend(nums)
          valid = [v for v in values if math.isfinite(v) and v != -9999]
          assert valid, 'DEM não contém alturas válidas'
          assert max(valid) - min(valid) > 0.1, 'DEM sem variação de altitude'
          print(f'DEM validado: {header}; valores válidos={len(valid)}; min={min(valid):.2f}m; max={max(valid):.2f}m; bytes={p.stat().st_size}')
          PY

      - name: Configurar Java e Android SDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar plataforma e Build Tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK DEBUG com DEM incorporado
        env:
          PROJECT_DIR: ${{ steps.source.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          set +e
          if [[ -f gradlew ]]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-debug.log"
            result=${PIPESTATUS[0]}
          else
            gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-debug.log"
            result=${PIPESTATUS[0]}
          fi
          set -e
          [[ "$result" -eq 0 ]] || exit "$result"
          apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$apk" "$GITHUB_WORKSPACE/output/Valepolis-V0.3.0-DEBUG-DEM-COPERNICUS.apk"
          cp "$PROJECT_DIR/app/src/main/assets/data/terrain_reference_dem.asc" "$GITHUB_WORKSPACE/output/"
          cp "$RUNNER_TEMP/dem-gdalinfo.txt" "$GITHUB_WORKSPACE/output/"
          sha256sum "$GITHUB_WORKSPACE/output/"* > "$GITHUB_WORKSPACE/output/SHA256.txt"

      - name: Publicar APK, DEM e relatório
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-DEM-COPERNICUS-DEBUG
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: Publicar diagnóstico se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-DEM-COPERNICUS-LOGS
          path: |
            build-debug.log
            ${{ runner.temp }}/dem-gdalinfo.txt
            ${{ runner.temp }}/copernicus_dem.tif
          if-no-files-found: ignore
          retention-days: 7
