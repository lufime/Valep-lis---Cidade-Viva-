name: A Última Expedição V0.1.126 — PRE-FLIGHT e APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'A-Ultima-Expedicao-v0.1.126-BLENDER-CORRIGIDO.zip'

permissions:
  contents: write

concurrency:
  group: ultima-expedicao-v0126-android-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.5.0
  APK_NAME: A-Ultima-Expedicao-v0.1.126-android.apk

jobs:
  preflight-android:
    name: Auditar, importar, testar e exportar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Preparar Python e ferramentas
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Localizar e extrair ZIP do projeto V0.1.126
        shell: bash
        run: |
          set -euo pipefail
          zipfile="$(find . -maxdepth 2 -type f -name 'A-Ultima-Expedicao*0.1.126*.zip' -print -quit)"
          if [ -z "$zipfile" ]; then
            echo "::error::Não foi encontrado ZIP do projeto V0.1.126."
            exit 1
          fi
          mkdir -p project
          unzip -q "$zipfile" -d project
          root="$(find project -type f -name project.godot -printf '%h\n' -quit)"
          if [ -z "$root" ]; then
            # Alguns pacotes PRE-FLIGHT são contentores: incluem o projeto
            # Godot num segundo ZIP de referência. Extrair esse ZIP sem
            # substituir nem alterar o pacote original.
            nested_zip="$(find project -type f -name 'projeto_godot_v0.1.126_referencia.zip' -print -quit)"
            if [ -z "$nested_zip" ]; then
              echo "::error::Não foi encontrado project.godot nem ZIP Godot aninhado no pacote."
              find project -maxdepth 4 -type f -print | sort
              exit 1
            fi
            echo "Pacote contentor detetado; a extrair projeto Godot: $nested_zip"
            unzip -q "$nested_zip" -d project/godot-project
            root="$(find project/godot-project -type f -name project.godot -printf '%h\n' -quit)"
          fi
          if [ -z "$root" ]; then
            echo "::error::O ZIP interno também não contém project.godot."
            find project -maxdepth 5 -type f -print | sort
            exit 1
          fi
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$root" >> "$GITHUB_ENV"
          echo "Projeto selecionado: $root"
          test -s "$root/project.godot"
          test -s "$root/export_presets.cfg"
          test -s "$root/scripts/VERSION.txt"
          test "$(tr -d '\r\n' < "$root/VERSION.txt")" = "0.1.126"
          test "$(tr -d '\r\n' < "$root/scripts/VERSION.txt")" = "0.1.126"

      - name: Corrigir tipo explícito de end_z antes das auditorias
        shell: bash
        run: |
          set -euo pipefail
          target="$PROJECT_DIR/scripts/expedition.gd"
          test -s "$target"
          if grep -Fq 'var end_z := end_sign * room_depth * 0.5' "$target"; then
            sed -i 's/var end_z := end_sign \* room_depth \* 0.5/var end_z: float = float(end_sign) * float(room_depth) * 0.5/' "$target"
          fi
          grep -Fq 'var end_z: float = float(end_sign) * float(room_depth) * 0.5' "$target"
          echo "END_Z_EXPLICIT_FLOAT_FIX_PASS=True"

      - name: Validar preset Android
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          grep -Eq '^\[preset\.[0-9]+\]' export_presets.cfg
          grep -Eq '^platform="Android"$' export_presets.cfg
          grep -Eq '^name="Android"$' export_presets.cfg
          grep -Fq 'build/A-Ultima-Expedicao-v0.1.126-android.apk' export_presets.cfg
          echo "ANDROID_PRESET_STATIC_PASS=True"

      - name: Auditoria estática do projeto
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python tests/quality_audit.py

      # O ZIP atual inclui a fonte .blend, mas não o .glb exigido pelo runtime.
      # Gerar o GLB a partir da fonte com Blender antes de a separar do projeto.
      - name: Gerar recurso GLB a partir da fonte Blender, se necessário
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$PROJECT_DIR/assets/station_corridor_kit.glb" ]; then
            blend="$PROJECT_DIR/assets/station_corridor_kit.blend"
            if [ ! -s "$blend" ]; then
              echo "::error::Falta station_corridor_kit.glb e também a fonte station_corridor_kit.blend."
              find "$PROJECT_DIR/assets" -maxdepth 2 -type f -print | sort
              exit 1
            fi
            echo "A instalar Blender e NumPy com limites de tempo..."
            sudo timeout 600s apt-get update
            sudo timeout 600s apt-get install -y blender python3-numpy
            echo "A exportar GLB; limite de 120 segundos..."
            timeout 120s env PYTHONPATH="/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}" blender --background "$blend" --python-expr "import bpy; import numpy; print('NUMPY_VERSION=' + numpy.__version__); bpy.ops.export_scene.gltf(filepath=r'$PROJECT_DIR/assets/station_corridor_kit.glb', export_format='GLB')"
          fi
          test -s "$PROJECT_DIR/assets/station_corridor_kit.glb"
          echo "BLENDER_GLB_GENERATION_PASS=True"

      - name: Executar scripts Blender e verificar modelos 3D
        shell: bash
        run: |
          set -euo pipefail
          # Blender já foi instalado no passo de geração do GLB; reutilizar a instalação.
          command -v blender
          cd "$PROJECT_DIR"
          mkdir -p "$GITHUB_WORKSPACE/blender-logs"
          for script in blender/build_polar_station_exterior.py blender/build_station_interior.py blender/build_creature_entity.py blender/build_player_expedition_survivor.py blender/build_rigged_animated_players.py; do
            test -s "$script"
            log="$GITHUB_WORKSPACE/blender-logs/$(basename "$script" .py).log"
            timeout 180s env PYTHONPATH="/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}" blender --background --factory-startup --python "$script" >"$log" 2>&1 || { cat "$log"; exit 1; }
          done
          for model in polar_station_exterior station_interior_modular entity_creature player_expedition_survivor player_expedition_rigged; do
            if [ ! -s "assets/$model.glb" ]; then
              echo "::error::Modelo GLB em falta: assets/$model.glb"
              exit 1
            fi
          done
          for source in polar_station_exterior.blend station_interior_modular.blend creature_entity.blend player_expedition_survivor.blend player_expedition_rigged.blend; do
            if [ ! -s "assets/$source" ]; then
              echo "::error::Fonte Blender em falta: assets/$source"
              exit 1
            fi
          done

      - name: Empacotar projeto atualizado com modelos Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          project_parent="$(dirname "$PROJECT_DIR")"
          project_name="$(basename "$PROJECT_DIR")"
          (cd "$project_parent" && zip -qr "$GITHUB_WORKSPACE/dist/A-Ultima-Expedicao-v0.1.126-BLENDER-CORRIGIDO.zip" "$project_name" -x '*/.godot/*' '*/build/*')
          test -s "$GITHUB_WORKSPACE/dist/A-Ultima-Expedicao-v0.1.126-BLENDER-CORRIGIDO.zip"
          unzip -tq "$GITHUB_WORKSPACE/dist/A-Ultima-Expedicao-v0.1.126-BLENDER-CORRIGIDO.zip"
          sha256sum "$GITHUB_WORKSPACE/dist/A-Ultima-Expedicao-v0.1.126-BLENDER-CORRIGIDO.zip"

      - name: Publicar ZIP atualizado na branch main
        shell: bash
        run: |
          set -euo pipefail
          zip_src="$GITHUB_WORKSPACE/dist/A-Ultima-Expedicao-v0.1.126-BLENDER-CORRIGIDO.zip"
          zip_dest="A-Ultima-Expedicao-v0.1.126-BLENDER-CORRIGIDO.zip"
          test -s "$zip_src"
          cp "$zip_src" "$GITHUB_WORKSPACE/$zip_dest"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$zip_dest"
          if git diff --cached --quiet; then
            echo "ZIP já está atualizado; nenhuma alteração binária a publicar."
          else
            git commit -m "Publicar ZIP atualizado com modelos Blender [skip ci]"
            git push origin HEAD:main
            echo "ZIP publicado em main: $zip_dest"
          fi

      # O GLB fica no projeto; o .blend original é guardado no artefacto de diagnóstico.
      - name: Separar fontes Blender antes da importação Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/blender-source"
          while IFS= read -r -d '' src; do
            rel="${src#"$PROJECT_DIR"/}"
            dest="$GITHUB_WORKSPACE/blender-source/$rel"
            mkdir -p "$(dirname "$dest")"
            mv "$src" "$dest"
            echo "Fonte Blender separada: $rel"
          done < <(find "$PROJECT_DIR" -type f -name '*.blend' -print0)
          if find "$PROJECT_DIR" -type f -name '*.blend' -print -quit | grep -q .; then
            echo "::error::Ainda existem ficheiros .blend dentro do projeto Godot."
            exit 1
          fi
          test -s "$PROJECT_DIR/assets/station_corridor_kit.glb"

      - name: Instalar Godot 4.5
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.0
          use-dotnet: false
          include-templates: true

      # Os .blend já foram separados do projeto Godot. O runtime utiliza o .glb,
      # por isso não se chama Blender nem se declara essa ferramenta necessária.
      - name: Confirmar ferramenta e versão do Godot
        shell: bash
        run: |
          set -euo pipefail
          godot --version

      - name: Importar recursos no Godot
        shell: bash
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"
          log="$GITHUB_WORKSPACE/godot-import.log"
          printf 'IMPORT_START_UTC=%s\n' "$(date -u +%FT%TZ)" | tee "$log"
          godot --headless --editor --path "$PROJECT_DIR" --quit 2>&1 | tee -a "$log"
          rc=${PIPESTATUS[0]}
          printf 'IMPORT_EXIT_CODE=%s\nIMPORT_END_UTC=%s\n' "$rc" "$(date -u +%FT%TZ)" | tee -a "$log"
          if [ "$rc" -ne 0 ]; then
            echo "::error::A importação do Godot falhou com código $rc. Consultar godot-import.log."
            exit "$rc"
          fi
          if [ ! -d "$PROJECT_DIR/.godot/imported" ]; then
            echo "::error::Godot terminou sem criar .godot/imported; importação não comprovada."
            exit 1
          fi
          echo "GODOT_IMPORT_PROCESS_PASS=True" | tee -a "$log"

      - name: Teste de arranque headless
        shell: bash
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"
          log="$GITHUB_WORKSPACE/godot-startup.log"
          godot --headless --path "$PROJECT_DIR" --quit-after 5 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          echo "STARTUP_EXIT_CODE=$rc" | tee -a "$log"
          if [ "$rc" -ne 0 ]; then
            echo "::error::O teste de arranque headless falhou."
            exit "$rc"
          fi

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          # O pacote legado "tools" já não existe nos repositórios atuais.
          # Instalar explicitamente os componentes usados pela exportação.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Preparar pasta de exportação
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/build"

      - name: Exportar APK Android
        shell: bash
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"
          log="$GITHUB_WORKSPACE/godot-export.log"
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$PROJECT_DIR/build/$APK_NAME" 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          echo "EXPORT_EXIT_CODE=$rc" | tee -a "$log"
          if [ "$rc" -ne 0 ]; then
            echo "::error::A exportação Android falhou."
            exit "$rc"
          fi
          if [ ! -s "$PROJECT_DIR/build/$APK_NAME" ]; then
            echo "::error::O Godot terminou sem gerar uma APK não vazia."
            exit 1
          fi
          echo "APK_EXPORT_PASS=True" | tee -a "$log"

      - name: Publicar APK, logs e relatório mesmo em caso de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-v0.1.126-Android-Diagnostico
          path: |
            project/**/build/A-Ultima-Expedicao-v0.1.126-android.apk
            dist/A-Ultima-Expedicao-v0.1.126-BLENDER-CORRIGIDO.zip
            blender-source/**
            godot-import.log
            godot-startup.log
            godot-export.log
            blender-logs/**
          if-no-files-found: warn
          retention-days: 14
