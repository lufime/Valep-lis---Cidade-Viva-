name: A Última Expedição — PRE-FLIGHT da nova base

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/a-ultima-expedicao-zero
    paths:
      - "expedicao/**"
      - ".github/workflows/expedicao-preflight.yml"

permissions:
  contents: read

concurrency:
  group: ultima-expedicao-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-smoke-test:
    name: Verificar projeto Godot em modo headless
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Godot 4.5
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Verificar importação e análise do projeto
        shell: bash
        run: |
          set -euo pipefail
          godot_bin="/tmp/godot/Godot_v4.5-stable_linux.x86_64"
          "$godot_bin" --version
          "$godot_bin" --headless --path expedicao --editor --quit

      - name: Verificar arranque headless
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.5-stable_linux.x86_64 \
            --headless --path expedicao --quit-after 3

      - name: Testar arranque direto da cena 3D
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.5-stable_linux.x86_64 \
            --headless --path expedicao res://scenes/expedition_3d.tscn --quit-after 5

      - name: Testes funcionais da cena 3D e das portas
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s \
            /tmp/godot/Godot_v4.5-stable_linux.x86_64 \
            --headless --path expedicao --script res://tests/test_expedition_3d.gd

      - name: Teste ENet entre processos separados
        shell: bash
        run: |
          set -euo pipefail
          godot_bin="/tmp/godot/Godot_v4.5-stable_linux.x86_64"
          server_log="$(mktemp)"
          client_log="$(mktemp)"
          "$godot_bin" --headless --path expedicao --script res://tests/network_probe.gd -- server >"$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            rm -f "$server_log" "$client_log"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 100); do
            if grep -q "SERVER_READY" "$server_log"; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$server_log"
              exit 1
            fi
            sleep 0.1
          done

          if ! grep -q "SERVER_READY" "$server_log"; then
            cat "$server_log"
            echo "FAIL | O servidor ENet não ficou pronto."
            exit 1
          fi

          if ! timeout --signal=TERM --kill-after=2s 15s "$godot_bin" --headless --path expedicao --script res://tests/network_probe.gd -- client >"$client_log" 2>&1; then
            cat "$server_log"
            cat "$client_log"
            exit 1
          fi

          if ! wait "$server_pid"; then
            cat "$server_log"
            cat "$client_log"
            exit 1
          fi

          cat "$server_log"
          cat "$client_log"
          grep -q "SERVER_PASS" "$server_log"
          grep -q "CLIENT_PASS" "$client_log"
          grep -q "SERVER_REPLICATION_PASS" "$server_log"
          grep -q "CLIENT_REPLICATION_PASS" "$client_log"
