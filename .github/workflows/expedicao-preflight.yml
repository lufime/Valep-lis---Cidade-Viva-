name: A Última Expedição — PRE-FLIGHT da nova base

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/a-ultima-expedicao-zero
    paths:
      - "expedicao/**"
      - ".github/workflows/expedicao-preflight.yml"
      - ".github/workflows/build-9.yml"

permissions:
  contents: read

concurrency:
  group: ultima-expedicao-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  godot-smoke-test:
    name: Verificar projeto Godot em modo headless
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Godot 4.5
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Obter animações humanoides CC0 e combiná-las com o modelo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p expedicao/assets
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/DyingStar-game/DyingStar/509148dc81a54061ec1422dbe78d03af4ac8648b/assets/Universal%20Animation%20Library/Unreal-Godot/UAL1_Standard.glb" \
            -o /tmp/UAL1_Standard.glb
          test -s /tmp/UAL1_Standard.glb
          npm install --no-audit --no-fund --prefix expedicao/tools @gltf-transform/core @gltf-transform/extensions
          node expedicao/tools/merge_animations.mjs \
            expedicao/assets/character.glb \
            expedicao/assets/character_animated.glb \
            /tmp/UAL1_Standard.glb
          test -s expedicao/assets/character_animated.glb
          test "$(stat -c %s expedicao/assets/character_animated.glb)" -gt 1000000

      - name: Importar modelo com animações para Godot
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.5-stable_linux.x86_64 --headless --path expedicao --editor --quit
          test -s expedicao/assets/character_animated.glb.import

      - name: Verificar importação e análise do projeto
        shell: bash
        run: |
          set -euo pipefail
          godot_bin="/tmp/godot/Godot_v4.5-stable_linux.x86_64"
          "$godot_bin" --version
          "$godot_bin" --headless --path expedicao --editor --quit

      - name: Verificar arranque headless
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.5-stable_linux.x86_64 \
            --headless --path expedicao --quit-after 3

      - name: Testar arranque direto da cena 3D
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.5-stable_linux.x86_64 \
            --headless --path expedicao res://scenes/expedition_3d.tscn --quit-after 5

      - name: Capturar imagem da cena 3D com rendering por software
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a /tmp/godot/Godot_v4.5-stable_linux.x86_64 \
            --audio-driver Dummy --path expedicao --script res://tests/capture_visual.gd
          test -s /tmp/expedition-showcase.png

      - name: Testar captura e libertação do rato em ambiente gráfico
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          godot_bin="/tmp/godot/Godot_v4.5-stable_linux.x86_64"
          test_log="/tmp/mouse-capture-gui.log"
          timeout --signal=TERM --kill-after=2s 30s env LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a "$godot_bin" --audio-driver Dummy --path expedicao \
            --script res://tests/test_mouse_capture_gui.gd 2>&1 | tee "$test_log"
          grep -q "GUI_MOUSE_CAPTURE_PASS" "$test_log"
          grep -q "GUI_MOUSE_ESCAPE_RELEASE_PASS" "$test_log"
          grep -q "GUI_MOUSE_CLICK_CAPTURE_PASS" "$test_log"
          grep -q "GUI_INPUT_PASS=3 GUI_INPUT_FAIL=0 RESULTADO=PASS" "$test_log"

      - name: Publicar captura da cena 3D
        uses: actions/upload-artifact@v4
        with:
          name: a-ultima-expedicao-captura-grafica
          path: /tmp/expedition-showcase.png
          if-no-files-found: error
          retention-days: 7

      - name: Testes funcionais da cena 3D e das portas
        shell: bash
        run: |
          set -euo pipefail
          test_log="$(mktemp)"
          if ! timeout --signal=TERM --kill-after=5s 60s \
            /tmp/godot/Godot_v4.5-stable_linux.x86_64 \
            --headless --path expedicao --script res://tests/test_expedition_3d.gd 2>&1 | tee "$test_log"; then
            echo "FAIL | A suite funcional Godot terminou com código diferente de zero."
            exit 1
          fi
          if grep -E "^(ERROR:|SCRIPT ERROR:|Parse Error:)" "$test_log"; then
            echo "FAIL | A suite funcional contém erros do motor ou do GDScript."
            exit 1
          fi
          grep -qE "TOTAL_PASS=[0-9]+ TOTAL_FAIL=0 TOTAL_SKIP=[0-9]+ RESULTADO=PASS" "$test_log"

      - name: Teste ENet entre processos separados
        shell: bash
        run: |
          set -euo pipefail
          godot_bin="/tmp/godot/Godot_v4.5-stable_linux.x86_64"
          server_log="$(mktemp)"
          client_log="$(mktemp)"
          "$godot_bin" --headless --path expedicao --script res://tests/network_probe.gd -- server >"$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            rm -f "$server_log" "$client_log"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 100); do
            if grep -q "SERVER_READY" "$server_log"; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$server_log"
              exit 1
            fi
            sleep 0.1
          done

          if ! grep -q "SERVER_READY" "$server_log"; then
            cat "$server_log"
            echo "FAIL | O servidor ENet não ficou pronto."
            exit 1
          fi

          if ! timeout --signal=TERM --kill-after=2s 15s "$godot_bin" --headless --path expedicao --script res://tests/network_probe.gd -- client >"$client_log" 2>&1; then
            cat "$server_log"
            cat "$client_log"
            exit 1
          fi

          if ! wait "$server_pid"; then
            cat "$server_log"
            cat "$client_log"
            exit 1
          fi

          cat "$server_log"
          cat "$client_log"
          grep -q "SERVER_PASS" "$server_log"
          grep -q "CLIENT_PASS" "$client_log"
          grep -q "CLIENT_INITIAL_POSITION_SPOOF_SENT" "$client_log"
          grep -q "SERVER_INITIAL_SPAWN_PASS" "$server_log"
          grep -q "CLIENT_DOOR_SPOOF_GUARD_PASS" "$client_log"
          grep -q "SERVER_DOOR_SPOOF_REJECT_PASS" "$server_log"
          grep -q "SERVER_REPLICATION_PASS" "$server_log"
          grep -q "CLIENT_REPLICATION_PASS" "$client_log"
          grep -q "CLIENT_REMOTE_PLAYER_PASS" "$client_log"
          grep -q "CLIENT_REMOTE_ORIENTATION_PASS" "$client_log"
          grep -q "CLIENT_DOOR_DISTANCE_GUARD_PASS" "$client_log"
          grep -q "SERVER_DOOR_REPLICATION_PASS" "$server_log"
          grep -q "CLIENT_DOOR_REPLICATION_PASS" "$client_log"
          grep -q "SERVER_DOOR_CLOSE_REPLICATION_PASS" "$server_log"
          grep -q "CLIENT_DOOR_CLOSE_REPLICATION_PASS" "$client_log"
          grep -q "CLIENT_MOVEMENT_BURST_SENT" "$client_log"
          grep -q "SERVER_BURST_RATE_LIMIT_PASS" "$server_log"
          grep -q "CLIENT_TELEPORT_ATTEMPT_SENT" "$client_log"
          grep -q "SERVER_TELEPORT_REJECT_PASS" "$server_log"
          grep -q "CLIENT_TELEPORT_REJECT_ACK_PASS" "$client_log"
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:" "$server_log" "$client_log"; then
            echo "FAIL | Os logs dos processos ENet contêm erros inesperados."
            exit 1
          fi

      - name: Repetir testes funcionais em ciclo de estabilidade
        shell: bash
        run: |
          set -euo pipefail
          godot_bin="/tmp/godot/Godot_v4.5-stable_linux.x86_64"
          for iteration in 1 2 3; do
            echo "STABILITY_LOOP_START | round=$iteration/3"
            test_log="$(mktemp)"
            if ! timeout --signal=TERM --kill-after=5s 60s \
              "$godot_bin" --headless --path expedicao --script res://tests/test_expedition_3d.gd 2>&1 | tee "$test_log"; then
              echo "FAIL | A suite funcional falhou na ronda $iteration."
              cat "$test_log"
              exit 1
            fi
            if grep -E "^(ERROR:|SCRIPT ERROR:|Parse Error:)" "$test_log"; then
              echo "FAIL | A ronda $iteration contém erros do motor ou do GDScript."
              exit 1
            fi
            if ! grep -qE "TOTAL_PASS=[0-9]+ TOTAL_FAIL=0 TOTAL_SKIP=[0-9]+ RESULTADO=PASS" "$test_log"; then
              echo "FAIL | A ronda $iteration não confirmou uma contagem PASS sem falhas."
              exit 1
            fi
            rm -f "$test_log"
            echo "STABILITY_LOOP_PASS | round=$iteration/3"
          done
