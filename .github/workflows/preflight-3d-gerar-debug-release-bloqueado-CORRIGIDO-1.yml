name: Valepólis V0.3.0 — Gerar APK DEBUG (release bloqueada)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: valepolis-v030-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Construir APK DEBUG e guardar logs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Encontrar e extrair projeto Android
        id: project
        shell: bash
        run: |
          set -euo pipefail
          extract="$RUNNER_TEMP/valepolis-project"
          mkdir -p "$extract"
          found=""
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if [[ -f "$d/app/build.gradle.kts" || -f "$d/app/build.gradle" ]]; then found="$d"; break; fi
          done < <(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' -print)
          if [[ -z "$found" ]]; then
            while IFS= read -r archive; do
              dest="$extract/$(basename "$archive" .zip)"
              mkdir -p "$dest"
              unzip -oq "$archive" -d "$dest" || continue
              while IFS= read -r f; do
                d="$(dirname "$f")"
                if [[ -f "$d/app/build.gradle.kts" || -f "$d/app/build.gradle" ]]; then found="$d"; break 2; fi
              done < <(find "$dest" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.gradle/*' -print)
            done < <(find . -type f -iname '*.zip' -not -path './.git/*' -print | sort)
          fi
          if [[ -z "$found" ]]; then
            echo "::error::Projeto Android não encontrado na raiz, subpastas ou ZIPs."
            find . -maxdepth 4 -type f -not -path './.git/*' | sort
            exit 1
          fi
          echo "dir=$found" >> "$GITHUB_OUTPUT"
          echo "Projeto selecionado: $found"
          {
            echo "Projeto selecionado: $found"
            echo "Data UTC: $(date -u +%FT%TZ)"
          } > "$GITHUB_WORKSPACE/diagnostico-build.txt"

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Não definir packages: tools; esse pacote já não existe.
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK necessário
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > "$GITHUB_WORKSPACE/sdk-licenses.log" 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 2>&1 | tee "$GITHUB_WORKSPACE/sdk-install.log"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construir APK DEBUG
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set +e
          cd "$PROJECT_DIR" || exit 1
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace --info :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-debug.log"
            rc=${PIPESTATUS[0]}
          else
            gradle --no-daemon --stacktrace --info :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-debug.log"
            rc=${PIPESTATUS[0]}
          fi
          echo "GRADLE_EXIT_CODE=$rc" > "$GITHUB_WORKSPACE/build-debug-status.txt"
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [[ "$rc" -eq 0 && -s "$APK" ]]; then
            mkdir -p "$GITHUB_WORKSPACE/apk-output"
            cp "$APK" "$GITHUB_WORKSPACE/apk-output/app-debug.apk"
            sha256sum "$GITHUB_WORKSPACE/apk-output/app-debug.apk" > "$GITHUB_WORKSPACE/apk-output/app-debug.apk.sha256"
            echo "APK DEBUG criada."
            exit 0
          fi
          echo "APK DEBUG não foi criada; ver build-debug.log." >> "$GITHUB_WORKSPACE/diagnostico-build.txt"
          find "$PROJECT_DIR/app/build/outputs" -maxdepth 6 -type f -print >> "$GITHUB_WORKSPACE/diagnostico-build.txt" 2>/dev/null || true
          exit 1

      - name: Publicar APK DEBUG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-DEBUG-VALIDACAO-3D-NAO-RELEASE
          path: apk-output/*
          if-no-files-found: error
          retention-days: 7

      - name: Publicar logs se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Valepolis-V0.3.0-ERRO-BUILD-DEBUG
          path: |
            build-debug.log
            build-debug-status.txt
            diagnostico-build.txt
            sdk-install.log
            sdk-licenses.log
          if-no-files-found: warn
          retention-days: 7

      - name: Estado da libertação
        if: always()
        run: |
          echo "APK DEBUG: apenas para validação no telemóvel."
          echo "APK RELEASE: BLOQUEADA até aprovação visual e técnica documentada do mundo 3D."
