name: A Última Expedição — Godot 4.5 Android Build (corrigido)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**/*.zip'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ultima-expedicao-godot-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.5-stable'
  GODOT_TEMPLATE_VERSION: '4.5.stable'
  APK_NAME: 'A-Ultima-Expedicao-v0.1.8-android.apk'

jobs:
  build:
    name: Preparar SDK, validar projeto e exportar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Godot 4.5 e templates Android
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip curl
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/artifacts"
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -oq "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot/bin" -type f -name 'Godot_v*_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o "$RUNNER_TEMP/godot/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot/templates"
          unzip -oq "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          TEMPLATE_SOURCE="$(find "$RUNNER_TEMP/godot/templates" -type f -name android_debug.apk -printf '%h\n' -quit)"
          test -n "$TEMPLATE_SOURCE" || { echo "::error::Os templates oficiais não incluem android_debug.apk."; exit 1; }
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$TEMPLATE_SOURCE"/. "$TEMPLATE_DIR"/
          "$GODOT_BIN" --version
          find "$TEMPLATE_DIR" -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/artifacts/installed-godot-templates.txt"

      # A ação recebe apenas um pacote aqui. Não usar lista multilinha:
      # versões da ação podem tratar o bloco todo como o nome de um único pacote.
      - name: Preparar Android SDK — apenas platform-tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar restantes componentes Android individualmente
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" && test -d "$SDK_ROOT" || { echo "::error::Android SDK não encontrado."; exit 1; }
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager não encontrado em $SDK_ROOT"; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF_SETTINGS
          {
            printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\nJAVA_HOME=%s\n' "$SDK_ROOT" "$SDK_ROOT" "$JAVA_HOME"
            java -version
            "$SDKMANAGER" --version
            "$SDK_ROOT/platform-tools/adb" version
          } > "$RUNNER_TEMP/artifacts/android-environment.txt" 2>&1
          for f in "$SDK_ROOT/build-tools/35.0.0/aapt" "$SDK_ROOT/build-tools/35.0.0/apksigner" "$SDK_ROOT/platforms/android-35/android.jar"; do
            test -e "$f" || { echo "::error::Falta componente Android: $f"; exit 1; }
          done

      - name: Encontrar e validar projeto Godot no ZIP
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/extracted" "$RUNNER_TEMP/artifacts"
          candidates=()
          while IFS= read -r -d '' z; do
            if unzip -Z1 "$z" 2>/dev/null | grep -E '(^|/)project[.]godot$' >/dev/null; then
              candidates+=("$z")
            fi
          done < <(find "$GITHUB_WORKSPACE" -type f -name '*.zip' -print0)
          if [[ "${#candidates[@]}" -eq 0 ]]; then
            echo "::error::Nenhum ZIP contém project.godot."
            find "$GITHUB_WORKSPACE" -type f -print > "$RUNNER_TEMP/artifacts/workspace-files.txt"
            exit 1
          fi
          selected=""
          for z in "${candidates[@]}"; do
            base="$(basename "$z" | tr '[:upper:]' '[:lower:]')"
            if [[ "$base" == *"a-ultima-expedicao"* && "$base" != *"log"* && "$base" != *"diagnost"* && "$base" != *"preflight"* ]]; then
              if [[ -n "$selected" ]]; then
                echo "::error::Vários ZIPs do jogo encontrados; deixa apenas um ZIP do projeto no repositório."
                printf 'Candidato: %s\n' "${candidates[@]}"
                exit 1
              fi
              selected="$z"
            fi
          done
          if [[ -z "$selected" ]]; then
            if [[ "${#candidates[@]}" -eq 1 ]]; then selected="${candidates[0]}"; else
              echo "::error::Vários ZIPs contêm project.godot e não é seguro escolher um ao acaso."
              printf 'Candidato: %s\n' "${candidates[@]}"
              exit 1
            fi
          fi
          echo "ZIP selecionado: $selected" | tee "$RUNNER_TEMP/artifacts/selected-project.txt"
          unzip -oq "$selected" -d "$RUNNER_TEMP/extracted"
          mapfile -t project_files < <(find "$RUNNER_TEMP/extracted" -type f -name project.godot -print)
          if [[ "${#project_files[@]}" -ne 1 ]]; then
            echo "::error::Esperava um project.godot; encontrados ${#project_files[@]}."
            printf '%s\n' "${project_files[@]}"
            exit 1
          fi
          PROJECT_DIR="$(dirname "${project_files[0]}")"
          test -s "$PROJECT_DIR/export_presets.cfg" || { echo "::error::Falta export_presets.cfg em $PROJECT_DIR"; exit 1; }
          grep -E '^[[:space:]]*platform="Android"[[:space:]]*$' "$PROJECT_DIR/export_presets.cfg" >/dev/null || { echo "::error::Não existe preset Android."; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" | tee "$RUNNER_TEMP/artifacts/project-path-diagnostic.txt"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Importar recursos do projeto
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -Eeuo pipefail
          test -n "$PROJECT_DIR" && test -f "$PROJECT_DIR/project.godot" || { echo "::error::PROJECT_DIR vazio ou sem project.godot: '$PROJECT_DIR'"; exit 1; }
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --import 2>&1 | tee "$RUNNER_TEMP/artifacts/godot-import.log"

      - name: Teste de arranque headless
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -Eeuo pipefail
          test -n "$PROJECT_DIR" && test -f "$PROJECT_DIR/project.godot"
          set +e
          timeout 120 "$GODOT_BIN" --headless --path "$PROJECT_DIR" --quit-after 5 2>&1 | tee "$RUNNER_TEMP/artifacts/godot-smoke-test.log"
          status=${PIPESTATUS[0]}
          set -e
          if grep -E '^(ERROR:|SCRIPT ERROR:|Parse Error:)' "$RUNNER_TEMP/artifacts/godot-smoke-test.log"; then
            echo "::error::O teste de arranque reportou erros Godot."
            exit 1
          fi
          test "$status" -eq 0

      - name: Diagnóstico detalhado do preset Android
        if: always() && steps.project.outputs.dir != ''
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set +e
          {
            echo "PROJECT_DIR=[$PROJECT_DIR]"
            echo '=== PRESET ==='
            cat "$PROJECT_DIR/export_presets.cfg"
            echo '=== EXPORT TEST ==='
            "$GODOT_BIN" --verbose --headless --path "$PROJECT_DIR" --export-debug 'Android' "$RUNNER_TEMP/artifacts/diagnostic-test.apk"
            echo "export_exit_code=$?"
          } > "$RUNNER_TEMP/artifacts/android-export-diagnostic.txt" 2>&1
          rm -f "$RUNNER_TEMP/artifacts/diagnostic-test.apk"
          exit 0

      - name: Exportar APK Android
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -Eeuo pipefail
          test -n "$PROJECT_DIR" && test -f "$PROJECT_DIR/project.godot" || { echo "::error::PROJECT_DIR vazio; exportação cancelada."; exit 1; }
          set +e
          "$GODOT_BIN" --verbose --headless --path "$PROJECT_DIR" --export-debug 'Android' "$RUNNER_TEMP/artifacts/$APK_NAME" 2>&1 | tee "$RUNNER_TEMP/artifacts/godot-export.log"
          export_status=${PIPESTATUS[0]}
          set -e
          if [[ "$export_status" -ne 0 ]]; then
            echo "::error::Exportação Android falhou (código $export_status). Consultar os logs do artefacto."
            exit "$export_status"
          fi
          test -s "$RUNNER_TEMP/artifacts/$APK_NAME"
          sha256sum "$RUNNER_TEMP/artifacts/$APK_NAME" | tee "$RUNNER_TEMP/artifacts/SHA256SUMS.txt"

      - name: Publicar APK e diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-Godot-Android-Build
          if-no-files-found: warn
          path: ${{ runner.temp }}/artifacts/**
          retention-days: 14
