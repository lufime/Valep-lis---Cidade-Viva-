name: A Última Expedição v0.8.0 — Testes de protocolo e APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ultima-expedicao-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Localizar ZIP e compilar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Localizar e descompactar o projeto
        shell: bash
        run: |
          set -Eeuo pipefail
          EXTRACT_ROOT="$RUNNER_TEMP/ultima-expedicao"
          PROBE="$RUNNER_TEMP/zip-probe"
          mkdir -p "$EXTRACT_ROOT"
          ZIP_PATH=""

          # Aceita nomes com sufixos automáticos, por exemplo -1.zip.
          while IFS= read -r -d '' candidate; do
            unzip -tq "$candidate" >/dev/null 2>&1 || continue
            rm -rf "$PROBE"; mkdir -p "$PROBE"
            unzip -oq "$candidate" -d "$PROBE" || continue
            while IFS= read -r -d '' package_file; do
              candidate_dir="$(dirname "$package_file")"
              if [[ -s "$candidate_dir/capacitor.config.json" && -s "$candidate_dir/www/index.html" ]]; then
                ZIP_PATH="$candidate"; break
              fi
            done < <(find "$PROBE" -type f -name package.json -print0)
            [[ -n "$ZIP_PATH" ]] && break
          done < <(find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print0)

          if [[ -z "$ZIP_PATH" ]]; then
            echo "::error::Não encontrei um ZIP válido do projeto Capacitor (package.json + capacitor.config.json + www/index.html)."
            find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print || true
            while IFS= read -r -d '' candidate; do
              echo "--- Conteúdo de $candidate"
              unzip -Z1 "$candidate" 2>/dev/null | head -40 || true
            done < <(find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print0)
            exit 1
          fi

          echo "ZIP válido encontrado: $ZIP_PATH"
          rm -rf "$EXTRACT_ROOT"; mkdir -p "$EXTRACT_ROOT"
          unzip -oq "$ZIP_PATH" -d "$EXTRACT_ROOT"
          PROJECT_DIR=""
          while IFS= read -r -d '' package_file; do
            candidate_dir="$(dirname "$package_file")"
            if [[ -s "$candidate_dir/capacitor.config.json" && -s "$candidate_dir/www/index.html" ]]; then
              PROJECT_DIR="$candidate_dir"; break
            fi
          done < <(find "$EXTRACT_ROOT" -type f -name package.json -print0)
          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::ZIP encontrado, mas a raiz do projeto não foi identificada."
            find "$EXTRACT_ROOT" -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit || true)"; fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then echo "::error::sdkmanager não encontrado"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar dependências e compilar web
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          node -e "const p=require('./package.json'); if(!p.dependencies?.['@capacitor/core'] || !p.dependencies?.['@capacitor/android'] || !p.devDependencies?.['@capacitor/cli']) process.exit(1); console.log('Projeto:',p.name,p.version)"
          node -e "const c=require('./capacitor.config.json'); if(!c.appId || !c.appName || c.webDir !== 'www') process.exit(1)"
          npm install --no-audit --no-fund
          npm run build

      - name: Testes do protocolo
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          npm test

      - name: Criar e sincronizar projeto Android
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          npx cap add android
          npx cap sync android
          test -s www/js/nearby-bridge.bundle.js

      - name: Compilar APK de depuração
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$RUNNER_TEMP/ultima-expedicao-artifacts"
          cp "$APK" "$RUNNER_TEMP/ultima-expedicao-artifacts/A-Ultima-Expedicao-Android-v0.8.0-debug.apk"

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-Android-v0.8.0-debug
          path: ${{ runner.temp }}/ultima-expedicao-artifacts/A-Ultima-Expedicao-Android-v0.8.0-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Guardar diagnóstico se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-diagnostico
          path: |
            ${{ runner.temp }}/ultima-expedicao/
            ${{ runner.temp }}/zip-probe/
          if-no-files-found: ignore
          retention-days: 7
