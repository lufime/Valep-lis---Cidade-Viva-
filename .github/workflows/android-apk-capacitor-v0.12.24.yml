name: A Última Expedição v0.12.24 — Capacitor Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**/*.zip'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ultima-expedicao-capacitor-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Validar, testar e compilar APK Capacitor
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Localizar ZIP v0.12.24 (com ou sem sufixo)
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail
          EXTRACT_ROOT="$RUNNER_TEMP/ultima-expedicao"
          mkdir -p "$EXTRACT_ROOT"

          mapfile -t candidates < <(
            find "$GITHUB_WORKSPACE" -type f -iname 'A-Ultima-Expedicao-v0.12.24-REMODELACAO-CINEMATOGRAFICA*.zip' \
              -not -path '*/.git/*' -print | sort
          )

          if [[ "${#candidates[@]}" -eq 0 ]]; then
            echo "::error::Não encontrei um ZIP A-Ultima-Expedicao-v0.12.24-REMODELACAO-CINEMATOGRAFICA*.zip."
            echo "ZIPs encontrados:"
            find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print || true
            exit 1
          fi

          # Se o repositório tiver vários ZIPs v0.12.24, escolhe o pacote COM-WORKFLOW
          # primeiro; caso exista só um, usa-o. Nunca escolhe uma versão diferente.
          selected=""
          for z in "${candidates[@]}"; do
            base="$(basename "$z")"
            if [[ "$base" == *"COM-WORKFLOW.zip" ]]; then
              if [[ -n "$selected" ]]; then
                echo "::error::Existem vários ZIPs v0.12.24 com COM-WORKFLOW. Deixa apenas um."
                printf '%s\n' "${candidates[@]}"
                exit 1
              fi
              selected="$z"
            fi
          done
          if [[ -z "$selected" ]]; then
            if [[ "${#candidates[@]}" -eq 1 ]]; then
              selected="${candidates[0]}"
            else
              echo "::error::Existem vários ZIPs v0.12.24 e nenhum tem prioridade clara. Deixa apenas um ZIP da versão."
              printf '%s\n' "${candidates[@]}"
              exit 1
            fi
          fi

          unzip -tq "$selected"
          unzip -oq "$selected" -d "$EXTRACT_ROOT"
          mapfile -t package_files < <(find "$EXTRACT_ROOT" -type f -name package.json -not -path '*/node_modules/*' -print)
          PROJECT_DIR=""
          for package_file in "${package_files[@]}"; do
            candidate="$(dirname "$package_file")"
            if [[ -s "$candidate/capacitor.config.json" && -s "$candidate/www/index.html" ]]; then
              if [[ -n "$PROJECT_DIR" ]]; then
                echo "::error::Mais de uma raiz Capacitor encontrada no ZIP."
                printf '%s\n' "$PROJECT_DIR" "$candidate"
                exit 1
              fi
              PROJECT_DIR="$candidate"
            fi
          done

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::ZIP encontrado, mas sem a estrutura Capacitor esperada."
            find "$EXTRACT_ROOT" -maxdepth 5 -type f -print || true
            exit 1
          fi

          node -e "const p=require(process.argv[1]); if(p.version !== '0.12.24') { console.error('Versão inesperada:',p.version); process.exit(1); } console.log('Versão do projeto:',p.version)" "$PROJECT_DIR/package.json"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          {
            echo "ZIP selecionado: $selected"
            echo "PROJECT_DIR=$PROJECT_DIR"
            sha256sum "$selected"
          } | tee "$RUNNER_TEMP/project-selection.txt"

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar plataforma e ferramentas Android
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" && test -d "$SDK_ROOT" || { echo "::error::Android SDK não encontrado."; exit 1; }
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager não encontrado."; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list_installed > "$RUNNER_TEMP/android-sdk-packages.txt"

      - name: Validar configuração e instalar dependências
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          node --version
          npm --version
          node -e "const p=require('./package.json'); for(const x of ['@capacitor/core','@capacitor/android']) if(!p.dependencies?.[x]) throw new Error('Falta dependência '+x); if(!p.devDependencies?.['@capacitor/cli']) throw new Error('Falta @capacitor/cli'); console.log('package.json válido:',p.name,p.version)"
          node -e "const c=require('./capacitor.config.json'); if(!c.appId || !c.appName || c.webDir!=='www') throw new Error('capacitor.config.json inválido'); console.log('Capacitor:',c.appId,c.appName)"
          npm install --no-audit --no-fund
          npm run build
          test -s www/js/nearby-bridge.bundle.js

      - name: Executar testes do projeto
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          npm test

      - name: Preparar projeto Android Capacitor
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          # O ZIP pode conter uma pasta android parcial (por exemplo, só os ícones).
          # A existência da pasta, por si só, não significa que exista um projeto Gradle válido.
          if [[ ! -s android/gradlew || ( ! -s android/app/build.gradle && ! -s android/app/build.gradle.kts ) ]]; then
            echo "Projeto Android incompleto; a gerar novamente com Capacitor."
            rm -rf android
            npx cap add android
          else
            echo "Projeto Android/Gradle existente e estruturalmente válido."
          fi
          npx cap sync android
          if [[ ! -s android/gradlew ]]; then
            echo "::error::Capacitor não gerou android/gradlew."
            find android -maxdepth 3 -type f -print | sort | head -200
            exit 1
          fi
          if [[ ! -s android/app/build.gradle && ! -s android/app/build.gradle.kts ]]; then
            echo "::error::Capacitor não gerou o ficheiro Gradle da aplicação."
            find android -maxdepth 4 -type f -print | sort | head -200
            exit 1
          fi
          echo "Projeto Android validado: wrapper Gradle e configuração da app encontrados."

      - name: Aplicar ícone Android
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          python3 -m pip install --quiet Pillow
          python3 scripts/apply-android-icon.py
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png

      - name: Validar plugin nativo Nearby
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          python3 scripts/register-nearby-android.py
          PLUGIN_JAVA="$(find node_modules/capacitor-nearby-link/android/src/main/java -type f -name '*Plugin.java' -print -quit)"
          test -n "$PLUGIN_JAVA" && test -s "$PLUGIN_JAVA"
          grep -q 'CapacitorPlugin' "$PLUGIN_JAVA"

      - name: Compilar APK Android
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$RUNNER_TEMP/ultima-expedicao-artifacts"
          cp "$APK" "$RUNNER_TEMP/ultima-expedicao-artifacts/A-Ultima-Expedicao-v0.12.24-debug.apk"
          sha256sum "$RUNNER_TEMP/ultima-expedicao-artifacts/A-Ultima-Expedicao-v0.12.24-debug.apk" | tee "$RUNNER_TEMP/ultima-expedicao-artifacts/SHA256SUMS.txt"

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-v0.12.24-Android-APK
          path: ${{ runner.temp }}/ultima-expedicao-artifacts/**
          if-no-files-found: error
          retention-days: 14

      - name: Guardar diagnósticos se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-v0.12.24-diagnostico
          path: |
            ${{ runner.temp }}/project-selection.txt
            ${{ runner.temp }}/android-sdk-packages.txt
            ${{ runner.temp }}/ultima-expedicao/**
          if-no-files-found: ignore
          retention-days: 14
