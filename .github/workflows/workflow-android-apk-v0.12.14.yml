name: A Última Expedição 3D v0.1.8 — Build Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'ultima-expedicao-3d-prototype/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

concurrency:
  group: ultima-expedicao-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.5-stable'
  APK_NAME: 'A-Ultima-Expedicao-v0.1.8-android.apk'

jobs:
  build:
    name: Importar, testar arranque e exportar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Java e Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Instalar dependências e descarregar Godot 4.5
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip xvfb
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/artifacts"
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -oq "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o "$RUNNER_TEMP/godot/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot/templates"
          unzip -oq "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          TEMPLATE_SOURCE="$(find "$RUNNER_TEMP/godot/templates" -type f -name android_debug.apk -printf '%h\n' -quit)"
          test -n "$TEMPLATE_SOURCE"
          cp -a "$TEMPLATE_SOURCE"/. "$TEMPLATE_DIR"/
          "$GODOT_BIN" --version

      - name: Preparar SDK Android
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'cmdline-tools;latest'
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF_SETTINGS

      - name: Encontrar e validar projeto
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/ultima-expedicao-3d-prototype"
          test -s "$PROJECT_DIR/project.godot"
          test -s "$PROJECT_DIR/export_presets.cfg"
          grep -q '^platform="Android"' "$PROJECT_DIR/export_presets.cfg"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Importar recursos Godot
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --import 2>&1 | tee "$RUNNER_TEMP/artifacts/godot-import.log"

      - name: Teste de arranque headless
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -Eeuo pipefail
          timeout 120 "$GODOT_BIN" --headless --path "$PROJECT_DIR" --quit-after 5 2>&1 | tee "$RUNNER_TEMP/artifacts/godot-smoke-test.log"

      - name: Exportar APK Android (debug)
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$PROJECT_DIR/build"
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" --export-debug 'Android' "$PROJECT_DIR/build/$APK_NAME" 2>&1 | tee "$RUNNER_TEMP/artifacts/godot-export.log"
          test -s "$PROJECT_DIR/build/$APK_NAME"
          cp "$PROJECT_DIR/build/$APK_NAME" "$RUNNER_TEMP/artifacts/$APK_NAME"
          sha256sum "$RUNNER_TEMP/artifacts/$APK_NAME" | tee "$RUNNER_TEMP/artifacts/SHA256SUMS.txt"

      - name: Guardar APK e logs como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-v0.1.8-Android-Build
          path: |
            ${{ runner.temp }}/artifacts/**
            ultima-expedicao-3d-prototype/build/*.apk
          if-no-files-found: warn
          retention-days: 14
