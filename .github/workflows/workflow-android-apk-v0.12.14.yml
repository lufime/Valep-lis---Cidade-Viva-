name: A Última Expedição — Godot 4.5 Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**/*.zip'
      - '.github/workflows/build.yml'
      - '.github/workflows/workflow-android-apk-v0.12.14.yml'

permissions:
  contents: read

concurrency:
  group: ultima-expedicao-godot-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.5-stable'
  GODOT_TEMPLATE_VERSION: '4.5.stable'
  APK_NAME: 'A-Ultima-Expedicao-v0.1.8-android.apk'

jobs:
  build:
    name: Encontrar projeto Godot, testar e exportar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Godot 4.5 e templates Android
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip curl
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/artifacts"
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -oq "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot/bin" -type f -name 'Godot_v*_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o "$RUNNER_TEMP/godot/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot/templates"
          unzip -oq "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          TEMPLATE_SOURCE="$(find "$RUNNER_TEMP/godot/templates" -type f -name android_debug.apk -printf '%h\n' -quit)"
          test -n "$TEMPLATE_SOURCE"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$TEMPLATE_SOURCE"/. "$TEMPLATE_DIR"/
          "$GODOT_BIN" --version

      - name: Instalar componentes Android e configurar Godot
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "::error::Android SDK não encontrado: $SDK_ROOT"; exit 1; }
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager não encontrado em $SDK_ROOT"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'cmdline-tools;latest'
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF_SETTINGS
          "$SDK_ROOT/platform-tools/adb" version || true

      - name: Encontrar ZIP original do projeto Godot
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/extracted"
          candidates=()
          while IFS= read -r -d '' z; do
            name="$(basename "$z")"
            # Não confundir pacotes de correção com o ZIP original do jogo.
            if [[ "$name" =~ [Cc][Oo][Rr][Rr][Ii][Gg][Ii][Dd][Oo] || "$name" =~ [Cc][Oo][Rr][Rr][Ee][Cc][Aa][Oo] || "$name" =~ [Pp][Aa][Tt][Cc][Hh] ]]; then
              echo "Ignorado ZIP de correção: $z"
              continue
            fi
            if unzip -Z1 "$z" | grep -Eq '(^|/)project\.godot$'; then
              candidates+=("$z")
            fi
          done < <(find "$GITHUB_WORKSPACE" -type f -name '*.zip' -print0)
          if [[ "${#candidates[@]}" -ne 1 ]]; then
            echo "::error::Era esperado exatamente um ZIP original válido com project.godot; encontrados: ${#candidates[@]}"
            printf 'Candidato: %s\n' "${candidates[@]:-nenhum}"
            find "$GITHUB_WORKSPACE" -type f -name '*.zip' -printf '%p\n'
            exit 1
          fi
          echo "ZIP original selecionado: ${candidates[0]}"
          unzip -oq "${candidates[0]}" -d "$RUNNER_TEMP/extracted"
          PROJECT_FILE="$(find "$RUNNER_TEMP/extracted" -type f -name project.godot -print -quit)"
          test -n "$PROJECT_FILE"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          test -s "$PROJECT_DIR/export_presets.cfg"
          grep -q '^platform="Android"' "$PROJECT_DIR/export_presets.cfg"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Importar recursos do projeto
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --import 2>&1 | tee "$RUNNER_TEMP/artifacts/godot-import.log"

      - name: Teste de arranque headless
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -Eeuo pipefail
          set +e
          timeout 120 "$GODOT_BIN" --headless --path "$PROJECT_DIR" --quit-after 5 2>&1 | tee "$RUNNER_TEMP/artifacts/godot-smoke-test.log"
          status=${PIPESTATUS[0]}
          set -e
          if grep -E '^(ERROR:|SCRIPT ERROR:|Parse Error:)' "$RUNNER_TEMP/artifacts/godot-smoke-test.log"; then
            echo "::error::O teste de arranque reportou erros Godot."
            exit 1
          fi
          test "$status" -eq 0

      - name: Diagnosticar configuração do preset Android
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --quit 2>&1 | tee "$RUNNER_TEMP/artifacts/godot-editor-validation.log"
          cp "$PROJECT_DIR/export_presets.cfg" "$RUNNER_TEMP/artifacts/export-presets-diagnostic.txt"
          grep -nE '^(name|platform|runnable|advanced_options|gradle_build|package/|version/|architectures/|permissions/)' "$PROJECT_DIR/export_presets.cfg" > "$RUNNER_TEMP/artifacts/export-options-summary.txt" || true
          printf 'ANDROID_HOME=%s\nJAVA_HOME=%s\n' "$ANDROID_HOME" "$JAVA_HOME" > "$RUNNER_TEMP/artifacts/android-paths.txt"

      - name: Exportar APK Android
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" --export-debug 'Android' "$RUNNER_TEMP/artifacts/$APK_NAME" 2>&1 | tee "$RUNNER_TEMP/artifacts/godot-export.log"
          test -s "$RUNNER_TEMP/artifacts/$APK_NAME"
          sha256sum "$RUNNER_TEMP/artifacts/$APK_NAME" | tee "$RUNNER_TEMP/artifacts/SHA256SUMS.txt"

      - name: Publicar APK e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-Godot-Android-Build
          if-no-files-found: warn
          path: ${{ runner.temp }}/artifacts/**
          retention-days: 14
