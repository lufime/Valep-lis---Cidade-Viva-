name: A Última Expedição — Build APK Android (Godot 4.5)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

concurrency:
  group: ultima-expedicao-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Importar, validar e exportar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      GODOT_VERSION: 4.5-stable
      APK_PATH: build/A-Ultima-Expedicao-v0.1.107-android.apk

    steps:
      - name: Obter projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK sem pacote legado tools
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado em $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Instalar Godot 4.5 (binário oficial)
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ARCHIVE="$RUNNER_TEMP/godot-4.5-linux.zip"
          curl --fail --location --retry 3 \\
            "https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip" \\
            -o "$GODOT_ARCHIVE"
          mkdir -p "$RUNNER_TEMP/godot-bin"
          unzip -q "$GODOT_ARCHIVE" -d "$RUNNER_TEMP/godot-bin"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot-bin" -maxdepth 1 -type f -name 'Godot_v4.5-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          ln -sf "$GODOT_BIN" "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
          "$GODOT_BIN" --version

      - name: Verificar Godot e projeto
        run: |
          set -euo pipefail
          godot --version
          test -s project.godot
          test -s export_presets.cfg
          grep -q 'platform="Android"' export_presets.cfg
          mkdir -p build

      - name: Preparar templates de exportação
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          # Download the matching official export templates archive.
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" \
            -o "$RUNNER_TEMP/godot-templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot-templates"
          unzip -q "$RUNNER_TEMP/godot-templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          TEMPLATE_VERSION="4.5.stable"
          mkdir -p "$HOME/.local/share/godot/export_templates/${TEMPLATE_VERSION}"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." \
            "$HOME/.local/share/godot/export_templates/${TEMPLATE_VERSION}/"
          test -d "$HOME/.local/share/godot/export_templates/${TEMPLATE_VERSION}"

      - name: Auditar regras e recursos
        run: |
          set -euo pipefail
          if [ -f tests/quality_audit.py ]; then
            python3 tests/quality_audit.py
          else
            echo "AVISO: tests/quality_audit.py não existe; auditoria estática ignorada."
          fi

      - name: Importar recursos Godot
        shell: bash
        run: |
          set -euo pipefail
          # Evita que a fonte editável do Blender seja importada pelo Godot.
          find . -path './.git' -prune -o -type f -name '*.blend' -print
          if find . -path './.git' -prune -o -type f -name '*.blend' -print -quit | grep -q .; then
            echo "ERRO: existe um .blend dentro da raiz do projeto Godot."
            echo "O .blend deve ficar fora da pasta do projeto; manter o .glb em assets/."
            exit 1
          fi
          timeout 8m godot --headless --editor --path . --import --verbose 2>&1 | tee godot-import.log
          grep -E 'ERROR|Parse Error|SCRIPT ERROR' godot-import.log && exit 1 || true

      - name: Teste de arranque headless
        run: timeout 2m godot --headless --path . --quit-after 5

      - name: Exportar APK Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" "$APK_PATH" 2>&1 | tee godot-export.log
          test -s "$APK_PATH"
          file "$APK_PATH"
          echo "APK_EXPORT_PASS=true"

      - name: Guardar APK e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-v0.1.107-Android
          path: |
            build/*.apk
            godot-import.log
            godot-export.log
          if-no-files-found: warn
          retention-days: 14
          
