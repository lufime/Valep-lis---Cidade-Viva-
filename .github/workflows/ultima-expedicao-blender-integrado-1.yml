name: A Última Expedição — Build APK Android (Godot 4.5)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**'
      - '.github/workflows/ultima-expedicao-blender-integrado-1.yml'

permissions:
  contents: read

concurrency:
  group: ultima-expedicao-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Importar, validar e exportar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GODOT_VERSION: 4.5-stable
      APK_NAME: A-Ultima-Expedicao-v0.1.115-android.apk
      PROJECT_ZIP_NAME: A-Ultima-Expedicao-Godot-v0.1.115-Blender-Melhorado.zip

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado em $ANDROID_HOME/cmdline-tools"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Instalar Godot 4.5 oficial
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/godot-4.5-linux.zip"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            -o "$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/godot-bin"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/godot-bin"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot-bin" -maxdepth 1 -type f -name 'Godot_v4.5-stable_linux.x86_64' -print -quit)"
          if [ -z "$GODOT_BIN" ]; then
            echo "::error::Não foi encontrado o executável Godot esperado no arquivo oficial."
            find "$RUNNER_TEMP/godot-bin" -maxdepth 2 -type f -print
            exit 1
          fi
          chmod +x "$GODOT_BIN"
          ln -sf "$GODOT_BIN" "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
          "$GODOT_BIN" --version

      - name: Localizar ZIP exato do projeto
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/$PROJECT_ZIP_NAME"
          if [ ! -s "$ARCHIVE" ]; then
            echo "::error::Não foi encontrado o ZIP esperado: $PROJECT_ZIP_NAME"
            echo "ZIPs disponíveis na raiz:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' -printf '%f\n' || true
            echo "Adiciona o ZIP da versão correta à raiz do repositório ou atualiza PROJECT_ZIP_NAME."
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/ultima-expedicao-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"

          mapfile -t PROJECT_FILES < <(find "$EXTRACT_DIR" -type f -name project.godot -print)
          if [ "${#PROJECT_FILES[@]}" -ne 1 ]; then
            echo "::error::Esperava encontrar exatamente um project.godot; encontrei ${#PROJECT_FILES[@]}."
            printf '%s\n' "${PROJECT_FILES[@]:-}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${PROJECT_FILES[0]}")"
          test -s "$PROJECT_DIR/export_presets.cfg" || {
            echo "::error::Falta export_presets.cfg em $PROJECT_DIR"
            exit 1
          }

          if ! grep -Eq '^\[preset\.[0-9]+\]' "$PROJECT_DIR/export_presets.cfg"; then
            echo "::error::export_presets.cfg não contém qualquer preset exportável."
            exit 1
          fi
          if ! grep -E '^\[preset\.[0-9]+\]' "$PROJECT_DIR/export_presets.cfg" -A 8 | grep -qi 'Android'; then
            echo "::error::Não foi encontrado um preset Android em export_presets.cfg."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/build"
          echo "Projeto selecionado: $PROJECT_DIR"
          echo "ZIP selecionado: $ARCHIVE"

      - name: Auditar recursos 3D e separar fontes Blender
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "Modelos GLB encontrados:"
          find . -type f -iname '*.glb' -print | sort || true

          # O Godot deve importar os GLB, não tentar importar ficheiros-fonte .blend.
          # Preserva os .blend no diretório temporário do runner, fora da raiz do projeto.
          BLENDER_SOURCE_DIR="$RUNNER_TEMP/blender-source"
          mkdir -p "$BLENDER_SOURCE_DIR"
          BLEND_COUNT=0
          while IFS= read -r -d '' BLEND_FILE; do
            RELATIVE_PATH="${BLEND_FILE#"$PROJECT_DIR"/}"
            DESTINATION="$BLENDER_SOURCE_DIR/$RELATIVE_PATH"
            mkdir -p "$(dirname "$DESTINATION")"
            mv "$BLEND_FILE" "$DESTINATION"
            BLEND_COUNT=$((BLEND_COUNT + 1))
          done < <(find "$PROJECT_DIR" -type f -iname '*.blend' -print0)

          GLB_COUNT="$(find "$PROJECT_DIR" -type f -iname '*.glb' | wc -l)"
          echo "Fontes Blender guardadas fora do projeto Godot: $BLEND_COUNT"
          echo "Modelos exportados GLB disponíveis ao Godot: $GLB_COUNT"

          if [ "$GLB_COUNT" -eq 0 ]; then
            echo "::error::Não existem modelos .glb no projeto; os modelos 3D exportados são necessários para o jogo."
            exit 1
          fi

          if [ -f tests/quality_audit.py ]; then
            python3 tests/quality_audit.py
          else
            echo "::warning::tests/quality_audit.py não existe; auditoria específica do projeto não foi executada."
          fi

      - name: Preparar templates oficiais de exportação
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE_VERSION="4.5.stable"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION"
          mkdir -p "$RUNNER_TEMP/godot-templates" "$TEMPLATE_DIR"

          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" \
            -o "$RUNNER_TEMP/godot-templates.tpz"
          unzip -q "$RUNNER_TEMP/godot-templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          test -d "$RUNNER_TEMP/godot-templates/templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$TEMPLATE_DIR/"
          test -n "$(find "$TEMPLATE_DIR" -maxdepth 1 -type f -print -quit)"

      - name: Importar recursos Godot
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          timeout 20m godot --headless --editor --path "$PROJECT_DIR" --import \
            2>&1 | tee "$GITHUB_WORKSPACE/godot-import.log"

          if grep -E '(^|[[:space:]])(SCRIPT ERROR|Parse Error|Failed to load script|ERROR:)' \
            "$GITHUB_WORKSPACE/godot-import.log"; then
            echo "::error::Foram encontrados erros no log de importação."
            exit 1
          fi

      - name: Teste de arranque headless
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          timeout 2m godot --headless --path "$PROJECT_DIR" --quit-after 5 \
            2>&1 | tee "$GITHUB_WORKSPACE/godot-startup.log"

      - name: Exportar APK Android
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          APK_PATH="$GITHUB_WORKSPACE/build/$APK_NAME"
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$APK_PATH" \
            2>&1 | tee "$GITHUB_WORKSPACE/godot-export.log"
          test -s "$APK_PATH"
          file "$APK_PATH"
          echo "APK_EXPORT_PASS=true"

      - name: Guardar APK e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Expedicao-v0.1.115-Android
          path: |
            build/*.apk
            godot-import.log
            godot-startup.log
            godot-export.log
          if-no-files-found: warn
          retention-days: 14
